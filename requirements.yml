---
# Ansible Galaxy collection dependencies.
# Install with: ansible-galaxy collection install -r requirements.yml
# NOTE: Named .yml (not .yaml) so Semaphore auto-installs collections before each template run.
collections:
  - name: ansible.posix
    version: ">=2.2.0"
  - name: community.docker
    version: ">=5.2.0"
  - name: community.general
    version: ">=13.0.1"
  - name: ansible.mysql
    version: ">=5.0.1"
  - name: community.proxmox
    version: ">=2.0.0"

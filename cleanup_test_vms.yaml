---
# Category: Utilities
# Schedule: none
# Remove all test VMs from the Proxmox cluster.
# Queries the cluster API for VMs in the test-vm slot pool (VMIDs 1300–1309),
# stops any that are running, and destroys them.
#
# Usage:
#   ansible-playbook cleanup_test_vms.yaml -e confirm=yes
#
# Required extra vars:
#   confirm=yes  — safety gate (this playbook destroys all test VMs in the pool)

- name: Clean up all test VMs
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/secrets.yaml
    - vars/configs/proxmox.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/pve_definitions.yaml
  vars:
    _pool_start: "{{ vm_test_slot_base | int }}"
    _pool_end: "{{ (vm_test_slot_base + vm_test_slot_count) | int }}"

  pre_tasks:
    - name: Assert safety gate
      ansible.builtin.assert:
        that:
          - confirm | default('no') == 'yes'
        fail_msg: "Safety gate not set. This playbook destroys all test VMs in the pool. Usage: -e confirm=yes"

  tasks:
    - name: Resolve PVE API endpoint
      include_tasks: tasks/resolve_pve_api.yaml
      vars:
        _pve_target_node: "{{ pve_target_node | default('') }}"

    - name: Query cluster VMs
      ansible.builtin.uri:
        url: "https://{{ _pve.api_host }}:{{ pve_api_port }}/api2/json/cluster/resources?type=vm"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve.api_user }}!{{ _pve.api_token_id }}={{ _pve.api_token_secret }}"
        validate_certs: false
      register: _cluster_vms
      no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"

    - name: Find test VMs in slot pool
      ansible.builtin.set_fact:
        _test_vms: >-
          {{ _cluster_vms.json.data
             | selectattr('vmid', 'ge', _pool_start | int)
             | selectattr('vmid', 'lt', _pool_end | int)
             | list }}

    - name: Show test VMs found
      ansible.builtin.debug:
        msg: >-
          Found {{ _test_vms | length }} test VM(s):
          {{ _test_vms | map(attribute='name') | list | join(', ') | default('none') }}

    - name: Destroy test VM — {{ item.name }} (VMID {{ item.vmid }})
      include_tasks: tasks/destroy_vm.yaml
      vars:
        _destroy_vmid: "{{ item.vmid }}"
        _destroy_node: "{{ item.node }}"
        _destroy_name: "{{ item.name }}"
      loop: "{{ _test_vms }}"
      loop_control:
        label: "{{ item.name }} (VMID {{ item.vmid }})"

    - name: Summary
      ansible.builtin.debug:
        msg: "Removed {{ _test_vms | length }} test VM(s)"

---
# Category: Utilities
# Schedule: none
# Deploys files/fast_check.py to the metube host (liberty) and registers ONE
# combined User Scripts entry that runs every platform. Re-run whenever the
# script or a platform's probe template changes, or when adding a platform.
#
# Platform-pluggable: one script (files/fast_check.py), one probe-config
# template per platform (templates/fast_check_probe_<platform>.conf.j2,
# including the shared templates/_fast_check_common.conf.j2 for rules that
# aren't platform-specific), one state directory per platform — but a single
# User Scripts entry/schedule/cron tick runs all of them. Adding a new
# platform means adding an entry to fast_check_platforms below and a new
# probe template, not a new copy of this playbook, the Python script, or the
# User Scripts entry.
#
# The wrapper script runs each platform as a separate `docker exec` line, not
# chained with && — one platform crashing/hanging does not stop the others
# from running that same tick, matching the failure-isolation a per-platform
# entry would have given, just without needing a second (or third...) GUI
# entry and schedule to manage for what is, in practice, always the same
# cadence.
#
# This intentionally does NOT set the cron schedule — User Scripts' schedule.json /
# customSchedule.cron are regenerated by its own PHP backend when the schedule is
# saved via its GUI, and reproducing that mechanism in Ansible risks writing state
# the plugin doesn't actually pick up. After the first run, open unRAID's User
# Scripts plugin, find "fast-check", and set its schedule once by hand (Custom,
# e.g. */10 * * * *). See files/fast_check.py's header for the full design: it
# runs a single stateless-between-invocations pass each cron tick, entirely via
# `docker exec` into the existing metube container — metube's own process/
# entrypoint is never modified, so a bad run there can never affect it.
#
# Required extra vars:
#   hosts_variable — inventory group/host to target (use "liberty")
#
# Usage:
#   ansible-playbook deploy_fast_check.yaml -e hosts_variable=liberty

- name: Deploy fast-discovery check
  hosts: "{{ hosts_variable }}"
  gather_facts: false
  # Loaded so each platform's probe template renders from the real config, not
  # a reimplementation of it. download_base.yaml alone supplies everything the
  # probe templates use (cookies, extractor-args, quality, reject-title,
  # live-filter, playlist-end, dateafter) — deliberately NOT download.yaml,
  # which explicitly clears ytdlp_dateafter back to "" for the real download
  # step; loading it here would silently defeat the enumeration scope this
  # was set up for.
  vars_files:
    - vars/configs/download_base.yaml
    # Only for vault_discord_download_webhook_{id,token} — rendered into each
    # platform state dir as alert_webhook so fast_check.py can fire a one-shot
    # Discord alert when it gives up re-dispatching a stuck download. Same
    # webhook (MeTube channel) download_videos.yaml uses for per-video notices.
    - vars/secrets.yaml

  vars:
    metube_appdata_dir: "/mnt/user/appdata/youtube-dl"
    user_scripts_name: fast-check
    ytdlp_update_scripts_name: metube-ytdlp-update
    fast_check_platforms:
      youtube:
        probe_template: templates/fast_check_probe_youtube.conf.j2
        state_dir_name: youtube_fast
      twitch:
        probe_template: templates/fast_check_probe_twitch.conf.j2
        state_dir_name: twitch_fast

  tasks:
    - name: Ensure metube scripts directory exists
      become: true
      ansible.builtin.file:
        path: "{{ metube_appdata_dir }}/scripts"
        state: directory
        mode: "0755"

    - name: Deploy fast_check.py
      become: true
      ansible.builtin.copy:
        src: files/fast_check.py
        dest: "{{ metube_appdata_dir }}/scripts/fast_check.py"
        mode: "0755"

    # Owned by uid 99/gid 100 (metube's own container user, matching the rest of
    # its /configs tree) — fast_check.py writes its log + JSON state files here,
    # and the container does not run as root, so a root-owned directory (what
    # Ansible/become would create by default) fails with a permission error the
    # moment the script actually tries to write anything.
    - name: Ensure platform state directories exist
      become: true
      ansible.builtin.file:
        path: "{{ metube_appdata_dir }}/{{ item.value.state_dir_name }}"
        state: directory
        mode: "0755"
        owner: "99"
        group: "100"
      loop: "{{ fast_check_platforms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Same rules the real download uses (cookies/extractor-args/reject-title/
    # quality/live-filter/playlist-end/dateafter) — re-rendered on every
    # deploy, so it can never silently drift from the profile it mirrors.
    - name: Render probe config for each platform
      become: true
      ansible.builtin.template:
        src: "{{ item.value.probe_template }}"
        dest: "{{ metube_appdata_dir }}/{{ item.value.state_dir_name }}/probe.conf"
        mode: "0644"
      loop: "{{ fast_check_platforms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # fast_check.py reads this (mode 0600, container user 99:100 like the rest of
    # its state) and POSTs a single Discord alert to it when it gives up
    # re-dispatching a download that never reached the archive. Absent file =
    # alerting silently disabled, so a run without the secret still works.
    - name: Render Discord alert webhook for each platform
      become: true
      ansible.builtin.copy:
        content: "https://discord.com/api/webhooks/{{ vault_discord_download_webhook_id }}/{{ vault_discord_download_webhook_token }}"
        dest: "{{ metube_appdata_dir }}/{{ item.value.state_dir_name }}/alert_webhook"
        mode: "0600"
        owner: "99"
        group: "100"
      loop: "{{ fast_check_platforms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Ensure User Scripts entry directory exists
      become: true
      ansible.builtin.file:
        path: "/boot/config/plugins/user.scripts/scripts/{{ user_scripts_name }}"
        state: directory
        mode: "0700"

    # Matches the file layout/permissions of existing User Scripts entries (e.g.
    # "Fix RealIP") exactly: 0600, not executable — the plugin's startCustom.php
    # bash-execs the content itself rather than relying on the execute bit.
    - name: Set User Scripts display name
      become: true
      ansible.builtin.copy:
        content: "{{ user_scripts_name }}"
        dest: "/boot/config/plugins/user.scripts/scripts/{{ user_scripts_name }}/name"
        mode: "0600"

    # User Scripts overwrites log.txt fresh on every run, so it can only ever show
    # the latest invocation. The persistent, size-capped log fast_check.py writes
    # under each platform's state dir lives inside the metube container, which
    # log.txt (on the unRAID host) has no visibility into — so after each run we
    # tail those files into this run's own output, making recent history show up
    # in the User Scripts GUI's "View Log" without needing a separate viewer.
    # 2000 lines ~= 1-2 weeks at typical activity per platform (see
    # fast_check.py's LOG_MAX_BYTES comment for the line-rate math) — well
    # within a single un-rotated log file, so this window is always backed by
    # real data.
    - name: Deploy User Scripts wrapper
      become: true
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          {% for platform, cfg in fast_check_platforms.items() %}
          docker exec metube python3 /configs/scripts/fast_check.py --platform {{ platform }}
          {% endfor %}
          {% for platform, cfg in fast_check_platforms.items() %}
          echo "--- recent history ({{ platform }}, last 2000 lines) ---"
          docker exec metube tail -n 2000 /configs/{{ cfg.state_dir_name }}/fast_check.log
          {% endfor %}
        dest: "/boot/config/plugins/user.scripts/scripts/{{ user_scripts_name }}/script"
        mode: "0600"

    # --- Second User Scripts entry: keep yt-dlp current -----------------------
    # The metube container runs non-root (PUID/PGID 99:100), and metube's
    # entrypoint explicitly disables its own scheduled nightly yt-dlp self-update
    # for non-root (disable_nightly_for_non_root). So yt-dlp is otherwise frozen
    # at whatever the image bundled until someone clicks "update" in the MeTube
    # UI — and a container recreate resets it. This entry runs the same upgrade
    # metube's entrypoint do_upgrade() would (pip install -U --pre yt-dlp), from
    # the boot flash so it survives recreates. yt-dlp breaks against YouTube
    # roughly monthly, so set this one to a daily schedule in the GUI (e.g.
    # 30 4 * * *) after the first run. Twitch's init-fragment issue
    # (yt-dlp #10878) is handled separately by --downloader "m3u8:ffmpeg" in
    # templates/metube.conf.j2, not by this.
    - name: Ensure yt-dlp updater User Scripts entry directory exists
      become: true
      ansible.builtin.file:
        path: "/boot/config/plugins/user.scripts/scripts/{{ ytdlp_update_scripts_name }}"
        state: directory
        mode: "0700"

    - name: Set yt-dlp updater display name
      become: true
      ansible.builtin.copy:
        content: "{{ ytdlp_update_scripts_name }}"
        dest: "/boot/config/plugins/user.scripts/scripts/{{ ytdlp_update_scripts_name }}/name"
        mode: "0600"

    - name: Deploy yt-dlp updater script
      become: true
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Refresh yt-dlp inside the metube container. metube's built-in nightly
          # self-update is disabled for non-root containers, and yt-dlp lives in
          # root-owned /usr/local/lib/.../site-packages, so the upgrade has to run
          # as root (-u 0) — a non-root pip falls back to ~/.local (HOME=/) and
          # fails with EACCES. Otherwise mirrors metube entrypoint's do_upgrade().
          docker exec -u 0 metube python3 -m pip install --root-user-action=ignore \
            -U --pre "yt-dlp[default,curl-cffi,deno]"
          echo "yt-dlp now: $(docker exec metube yt-dlp --version)"
        dest: "/boot/config/plugins/user.scripts/scripts/{{ ytdlp_update_scripts_name }}/script"
        mode: "0600"

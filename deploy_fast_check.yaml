---
# Category: Utilities
# Schedule: none
# Deploys files/fast_check.py to the metube host (liberty) and registers a
# per-platform User Scripts entry. Re-run whenever the script or a platform's
# probe template changes.
#
# Platform-pluggable: one script (files/fast_check.py), one probe-config
# template per platform (templates/fast_check_probe_<platform>.conf.j2,
# including the shared templates/_fast_check_common.conf.j2 for rules that
# aren't platform-specific), one User Scripts entry per platform — adding a
# new platform means adding an entry to fast_check_platforms below and a new
# probe template, not a new copy of this playbook or the Python script.
#
# This intentionally does NOT set the cron schedule — User Scripts' schedule.json /
# customSchedule.cron are regenerated by its own PHP backend when the schedule is
# saved via its GUI, and reproducing that mechanism in Ansible risks writing state
# the plugin doesn't actually pick up. After the first run, open unRAID's User
# Scripts plugin, find the platform's entry, and set its schedule once by hand
# (Custom, e.g. */10 * * * *). See files/fast_check.py's header for the full
# design: it runs a single stateless-between-invocations pass each cron tick,
# entirely via `docker exec` into the existing metube container — metube's own
# process/entrypoint is never modified, so a bad run there can never affect it.
#
# Required extra vars:
#   hosts_variable — inventory group/host to target (use "liberty")
#   platform        — which platform to deploy (currently: youtube)
#
# Usage:
#   ansible-playbook deploy_fast_check.yaml -e hosts_variable=liberty -e platform=youtube

- name: Deploy fast-discovery check
  hosts: "{{ hosts_variable }}"
  gather_facts: false
  # Loaded so each platform's probe template renders from the real config, not
  # a reimplementation of it. Order matters for YouTube: download_default.yaml
  # supplies ytdlp_dateafter (only it sets one — channel-scanning scope, which
  # this script replaces for YouTube); download_on_demand.yaml loads LAST so
  # its overrides (ytdlp_filter_live=false, etc.) win where the two profiles
  # differ, matching the profile fast-path dispatches actually route through.
  # A future Twitch profile may need different vars_files — adjust per platform
  # if/when its own download profile vars diverge from this list.
  vars_files:
    - vars/configs/download_base.yaml
    - vars/configs/download_default.yaml
    - vars/configs/download_on_demand.yaml

  vars:
    metube_appdata_dir: "/mnt/user/appdata/youtube-dl"
    fast_check_platforms:
      youtube:
        probe_template: templates/fast_check_probe_youtube.conf.j2
        state_dir_name: youtube_fast
        user_scripts_name: youtube-fast-check
      twitch:
        probe_template: templates/fast_check_probe_twitch.conf.j2
        state_dir_name: twitch_fast
        user_scripts_name: twitch-fast-check
    platform_cfg: "{{ fast_check_platforms[platform] }}"

  tasks:
    - name: Assert platform is supported
      ansible.builtin.assert:
        that: platform in fast_check_platforms
        fail_msg: "Unknown platform '{{ platform }}'. Known: {{ fast_check_platforms.keys() | list }}"
        quiet: true

    - name: Ensure metube scripts directory exists
      become: true
      ansible.builtin.file:
        path: "{{ metube_appdata_dir }}/scripts"
        state: directory
        mode: "0755"

    - name: Deploy fast_check.py
      become: true
      ansible.builtin.copy:
        src: files/fast_check.py
        dest: "{{ metube_appdata_dir }}/scripts/fast_check.py"
        mode: "0755"

    # Owned by uid 99/gid 100 (metube's own container user, matching the rest of
    # its /configs tree) — fast_check.py writes its log + JSON state files here,
    # and the container does not run as root, so a root-owned directory (what
    # Ansible/become would create by default) fails with a permission error the
    # moment the script actually tries to write anything.
    - name: Ensure platform state directory exists
      become: true
      ansible.builtin.file:
        path: "{{ metube_appdata_dir }}/{{ platform_cfg.state_dir_name }}"
        state: directory
        mode: "0755"
        owner: "99"
        group: "100"

    # Same rules the real download uses (cookies/extractor-args/reject-title/
    # quality/live-filter/playlist-end/dateafter) — re-rendered on every
    # deploy, so it can never silently drift from the profile it mirrors.
    - name: Render probe config for channel enumeration/quality checks
      become: true
      ansible.builtin.template:
        src: "{{ platform_cfg.probe_template }}"
        dest: "{{ metube_appdata_dir }}/{{ platform_cfg.state_dir_name }}/probe.conf"
        mode: "0644"

    - name: Ensure User Scripts entry directory exists
      become: true
      ansible.builtin.file:
        path: "/boot/config/plugins/user.scripts/scripts/{{ platform_cfg.user_scripts_name }}"
        state: directory
        mode: "0700"

    # Matches the file layout/permissions of existing User Scripts entries (e.g.
    # "Fix RealIP") exactly: 0600, not executable — the plugin's startCustom.php
    # bash-execs the content itself rather than relying on the execute bit.
    - name: Set User Scripts display name
      become: true
      ansible.builtin.copy:
        content: "{{ platform_cfg.user_scripts_name }}"
        dest: "/boot/config/plugins/user.scripts/scripts/{{ platform_cfg.user_scripts_name }}/name"
        mode: "0600"

    # User Scripts overwrites log.txt fresh on every run, so it can only ever show
    # the latest invocation. The persistent, size-capped log fast_check.py writes
    # under the platform's state dir lives inside the metube container, which
    # log.txt (on the unRAID host) has no visibility into — so after each run we
    # tail that file into this run's own output, making recent history show up in
    # the User Scripts GUI's "View Log" without needing a separate viewer.
    # 2000 lines ~= 1-2 weeks at typical activity (see fast_check.py's
    # LOG_MAX_BYTES comment for the line-rate math) — well within a single
    # un-rotated log file, so this window is always backed by real data.
    - name: Deploy User Scripts wrapper
      become: true
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          docker exec metube python3 /configs/scripts/fast_check.py --platform {{ platform }}
          echo "--- recent history (fast_check.log, last 2000 lines) ---"
          docker exec metube tail -n 2000 /configs/{{ platform_cfg.state_dir_name }}/fast_check.log
        dest: "/boot/config/plugins/user.scripts/scripts/{{ platform_cfg.user_scripts_name }}/script"
        mode: "0600"

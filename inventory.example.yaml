# inventory.example.yaml — copy to inventory.yaml and replace hostnames with your own
#
# inventory.yaml is the single source of truth for all Semaphore inventories.
# All 6 Semaphore inventories are type: "file" pointing to this file; they differ
# only by ssh_key_id (which credential Semaphore uses to connect).
# Vault-encrypt inventory.yaml before committing.
#
# Replace home.local / example.com with your own domain(s).
# Replace hostnames with your actual host names.

# Individual host groups — one per physical/virtual host
[pikvm]
pikvm.home.local

[ubuntu01]
ubuntu01.home.local

[ubuntu02]
ubuntu02.home.local

[vps]
vps.example.com

[gameserver]
gameserver.home.local

[pve01]
pve01.home.local

[pve02]
pve02.home.local

[pve03]
pve03.home.local

[pbs01]
pbs01.home.local

[udmp]
udmp.home.local

[unvr]
unvr.home.local

[nas01]
nas01.home.local

[nas02]
nas02.home.local

[local]
localhost ansible_connection=local

# Functional groups — used by hosts_variable in Semaphore variable groups.
# hosts_variable selects which hosts to target; config_file (set separately
# in the Semaphore variable group) selects which vars/configs/*.yaml to load.
# When both values match (e.g., docker_stacks), a single variable suffices.
# When they differ (e.g., hosts_variable=unraid + config_file=unraid_plugins),
# the same hosts can run different operations.
[ubuntu]
ubuntu01.home.local
ubuntu02.home.local
gameserver.home.local
vps.example.com

[pve]
pve01.home.local
pve02.home.local
pve03.home.local

[pve_standalone]
pve04.home.local

[pbs]
pbs01.home.local

[proxmox:children]
pve
pve_standalone
pbs

[docker_stacks]
vps.example.com
ubuntu02.home.local
ubuntu01.home.local

[docker_run]
nas02.home.local
nas01.home.local

[docker:children]
docker_stacks
docker_run

[unifi_network]
udmp.home.local

[unifi_protect]
unvr.home.local

[unraid]
nas02.home.local
nas01.home.local

[amp]
gameserver.home.local

# NOTE: db_* groups (db_primary_mariadb, db_primary_postgres, db_secondary_postgres)
# are NOT inventory groups. They are created dynamically at runtime by the resolver
# play prepended to backup_databases, restore_databases, and verify_backups playbooks.
# The resolver loads vars/db_*.yaml, reads db_host, and creates an in-memory group.

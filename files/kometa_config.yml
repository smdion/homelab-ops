# Kometa config -- safe to commit. Contains no secrets: Plex token and TMDb
# API key/MDBList key are injected at container start via KOMETA_PLEXTOKEN/
# KOMETA_TMDBKEY/KOMETA_MDBLISTKEY env vars (rendered from vault in
# container_definitions.yaml), which Kometa substitutes into the
# <<plextoken>>/<<tmdbkey>>/<<mdblistkey>> placeholders below itself --
# see https://kometa.wiki/en/latest/kometa/environmental/
#
# Scope: Movies + TV Shows only. YouTube/Twitch libraries are personal
# content with no TMDb/IMDb/Trakt match -- Kometa's default collection/
# overlay files would find nothing there. Those get a separate local-assets
# setup later, not the default collection files used here.

plex:
  url: http://10.10.10.19:32400
  token: <<plextoken>>

tmdb:
  apikey: <<tmdbkey>>
  language: en

mdblist:
  apikey: <<mdblistkey>>
  cache_expiration: 60

settings:
  cache: true
  asset_directory: /config/assets
  sync_mode: append
  run_again_delay: 2
  missing_only_released: true
  show_missing_season_assets: false

# collection_mode: hide_items keeps every collection generated and browsable
# from Plex's Collections tab, but stops its member items from also showing
# as separate tiles in the main library grid -- avoids doubling up every
# movie/show across dozens of collections when just browsing the library.
libraries:
  Movies:
    collection_files:
      - default: imdb
        template_variables:
          collection_mode: hide_items
      - default: genre
        template_variables:
          collection_mode: hide_items
      - default: studio
        template_variables:
          collection_mode: hide_items
      - default: year
        template_variables:
          collection_mode: hide_items
      - default: decade
        template_variables:
          collection_mode: hide_items
    overlay_files:
      - default: resolution
      - default: ribbon

  TV Shows:
    collection_files:
      - default: imdb
        template_variables:
          collection_mode: hide_items
      - default: genre
        template_variables:
          collection_mode: hide_items
      - default: network
        template_variables:
          collection_mode: hide_items
      - default: year
        template_variables:
          collection_mode: hide_items
      - default: decade
        template_variables:
          collection_mode: hide_items
    overlay_files:
      - default: resolution
      - default: ribbon
      - default: status

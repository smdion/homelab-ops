---
# Category: Utilities
# Schedule: none
# Seeds Kometa's config.yml onto core. Self-contained like download_series.yaml
# -- no secrets in this file (Plex token / TMDb key are injected at container
# start via KOMETA_PLEXTOKEN/KOMETA_TMDBKEY env vars, rendered from vault by
# container_definitions.yaml, and substituted by Kometa itself into the
# <<plextoken>>/<<tmdbkey>> placeholders in files/kometa_config.yml -- see
# https://kometa.wiki/en/latest/kometa/environmental/). Re-run any time
# files/kometa_config.yml changes; the media stack deploy (template 67)
# handles the container itself and does not touch this file.
#
# Usage:
#   ansible-playbook deploy_kometa_config.yaml

- name: Deploy Kometa config
  hosts: core
  gather_facts: false

  vars:
    kometa_dir: "/opt/kometa"

  tasks:
    - name: Ensure Kometa config directory exists
      become: true
      ansible.builtin.file:
        path: "{{ kometa_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Kometa config.yml
      become: true
      ansible.builtin.copy:
        src: files/kometa_config.yml
        dest: "{{ kometa_dir }}/config.yml"
        mode: "0644"

    - name: Deploy Kometa per-show metadata files
      become: true
      ansible.builtin.copy:
        src: files/kometa_metadata/
        dest: "{{ kometa_dir }}/metadata/"
        mode: "0644"

    - name: Deploy Kometa overlay files (jmxd media_info/audience_rating)
      become: true
      ansible.builtin.copy:
        src: files/kometa_overlays/
        dest: "{{ kometa_dir }}/overlays/"
        mode: "0644"

# ═══════════════════════════════════════════════════════════════════
# Monitoring — register / clean up in Beszel + Dozzle (best effort, see tasks/monitoring_hook.yaml)
# ═══════════════════════════════════════════════════════════════════
- name: "Sync monitoring (Beszel + Dozzle)"
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/host_definitions.yaml
    - vars/definitions/vip_definitions.yaml
    - vars/configs/beszel.yaml
  vars:
    playbook_name: "deploy_kometa_config.yaml"
    beszel_hook_prune: false
  tasks:
    - name: Resolve Semaphore task URL for notifications
      ansible.builtin.include_tasks: tasks/resolve_semaphore_task.yaml

    - name: Register / clean up monitoring
      ansible.builtin.include_tasks: tasks/monitoring_hook.yaml

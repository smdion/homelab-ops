semaphore_url: "{{ vault_semaphore_host_url | regex_replace('/$', '') }}"
semaphore_ext_url: "https://{{ controller_fqdn.split('.')[0] }}.{{ vault_domain_ext }}"

# Health check thresholds, Semaphore controller settings, and stale detection windows
semaphore_project_id: 1
controller_fqdn: "{{ vault_semaphore_controller_hostname }}.{{ vault_domain_local }}"
semaphore_db_name: semaphore

# Groups with ansible-user SSH access — used by maintain_health Play 2/3
# Appliances (pikvm, unifi_network, unifi_protect) covered via stale backup detection
health_check_groups:
  - ubuntu
  - unraid
  - pve
  - pve_standalone
  - pbs

# Health check thresholds
health_disk_warn_pct: 80
health_disk_crit_pct: 90
health_mem_warn_pct: 85
health_cpu_load_multiplier: 1.5       # alert if 5m load avg > vcpus * this
health_journal_errors_max: 50
health_oom_kills_max: 1               # any OOM kill triggers alert
health_backup_stale_days: 10          # alerts if weekly backup has been missed by 3+ days
health_ssl_warn_days: 30              # warn if SSL cert expires within 30 days
health_ssl_crit_days: 14              # critical if SSL cert expires within 14 days
health_maintenance_stale_days: 3      # alert if no successful maintenance run in N days
health_db_connections_warn_pct: 80    # warn if connection count exceeds this % of max
health_wan_url: "https://cloudflare.com/cdn-cgi/trace"  # WAN connectivity check target
health_ntp_max_offset_ms: 500         # max acceptable NTP offset in milliseconds
health_dns_hostname: "google.com"     # DNS resolution test target
health_backup_size_min_pct: 50        # alert if latest backup < this % of 30-day average
health_backup_size_exclude:            # application names to skip in size anomaly check (e.g. recently migrated apps)
  - "Docker"                           # host-level archive shrank after DB data dirs excluded from stacks
  - "ansible-logging-db"               # DB dump now tracked separately (previously inside Docker archive)
  - "nextcloud-db"                     # DB dump now tracked separately (previously inside Docker archive)
  - "semaphore-db"                     # DB dump now tracked separately (previously inside Docker archive)
health_update_stale_days: 14          # Grafana panel: flag updates older than N days as stale
# Docker image-update check (maintain_health CHECK 14b) — warns when a version-pinned
# container has a newer stable release upstream. Auto-derives pins from running
# containers; rolling tags (latest/nightly/branch) and local images are skipped.
health_image_check_enabled: true
health_image_skopeo_image: "quay.io/skopeo/stable"  # skopeo run as a throwaway container
health_image_check_exclude: []        # container names or image substrings to skip
rightsize_cpu_threshold: 0.10         # flag if 1-month avg CPU < 10%
rightsize_mem_threshold: 0.30         # flag if 1-month avg mem < 30% of configured max
health_keyscan_timeout: 5             # ssh-keyscan timeout in seconds per host

# Appliance reachability check — tested via TCP connect (port 443)
# CUSTOMIZE: list your network appliances that lack SSH access
# These hosts are NOT covered by Play 2 SSH checks, only by stale backup detection.
# This check provides faster detection of appliance outages.
appliance_check_hosts:
  - "pikvm.{{ vault_domain_local }}"
  - "udmp.{{ vault_domain_local }}"
  - "unvr.{{ vault_domain_local }}"
appliance_check_port: 443

# UniFi Network device health check — queries UDMP API for device status
# Requires vault_unifi_network_api_key (auto-skipped if missing)
health_unifi_network_url: "https://udmp.{{ vault_domain_local }}"

# Ansible health check (maintain_ansible.yaml)
ansible_health_stuck_task_hours: 2
ansible_health_semaphore_docker_host: "redemption.{{ vault_domain_local }}"
ansible_health_semaphore_container_name: semaphore
ansible_health_collections_check:
  - community.general
  - community.proxmox
  - community.docker
  - ansible.posix
  - ansible.mysql

# Schedule exemption marker — playbooks with "# Schedule: none" in their header
# are excluded from CHECK 28 schedule coverage validation. Used for ad-hoc,
# manual, one-time, and on-demand playbooks that intentionally have no schedule.
schedule_exempt_marker: "# Schedule: none"
schedule_exempt_pattern: "# Schedule-exempt:"

# Directories always expected in /opt on docker_stacks hosts (not container mounts).
# These are system-level dirs that no container owns but are always present.
opt_always_expected:
  - stacks
  - containerd

# Display timezone (used in Discord alerts for human-readable timestamps)
display_timezone: "America/Chicago"

# Reporting windows (used in SQL queries for summaries and anomaly detection)
summary_report_days: 7            # weekly summary report window (check_logging_db)
backup_trend_days: 30             # backup size anomaly trending window (maintain_health)

# Data retention
retention_days: 365               # delete rows older than this from ansible_logging tables
download_task_retention_days: 7   # delete successful Download tasks older than this from Semaphore DB

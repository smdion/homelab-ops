---
# Beszel monitoring — config for deploy_beszel_monitoring.yaml / tasks/beszel_sync.yaml.
# How it works: homelab-docs infrastructure/monitoring.md. Per-host tuning lives on the definition, in its
# `beszel:` block (name, address, alerts).

# The hub runs on the VPS behind WireGuard; the controller (Semaphore on redemption) reaches its API here.
beszel_hub_url: "http://10.253.100.1:8090"

# Alerts every monitored system gets. value = threshold (percent); min = minutes it must persist. "Status"
# fires when the agent is unreachable for `min` minutes (5 rides out reboots and backup stop/start windows).
# Names are the hub's own (Status, CPU, Memory, Disk, Bandwidth, Temperature, LoadAvg1/5/15, GPU, Battery,
# ContainerHealth, SystemdFailed, CPUIOWait, CPUSteal, NetworkMonitorLoss).
# Override or disable per host in its definition, e.g.  beszel: { agent: binary, alerts: { CPU: 95, Disk: false } }
# — a number replaces the threshold (keeping `min`), false removes that alert.
beszel_alert_defaults:
  Status: { value: 0, min: 5 }
  CPU: { value: 90, min: 10 }
  Memory: { value: 90, min: 10 }
  Disk: { value: 85, min: 10 }
  # A container whose health check reports unhealthy (not stopped ones; the container watcher covers those).
  # value is unused by the hub; min = minutes it must stay unhealthy (autoheal usually fixes it within one).
  ContainerHealth: { value: 0, min: 5 }
  # Any failed systemd unit. Only binary-agent hosts report systemd; the hub ignores min for this alert.
  SystemdFailed: { value: 0, min: 10 }
  # CPU I/O wait / steal percent. Baseline 2026-10-22: iowait peaked at 11.5% (PBS), steal at 1%.
  CPUIOWait: { value: 25, min: 10 }
  CPUSteal: { value: 10, min: 10 }
  # Highest sensor, Celsius. The Ryzen mini PCs run ~80 under load (Tjmax 105).
  Temperature: { value: 90, min: 10 }

# Drift check thresholds (maintain_health CHECK 32, and the report from deploy_beszel_monitoring):
# a matched system down at least this many hours is flagged (the hub's own Status alert covers the first minutes) ...
beszel_down_alert_hours: 24
# ... and an agent this many minor releases behind the hub is flagged. 1 is deliberately NOT flagged: update_systems
# refreshes latest weekly, so a one-release lag right after a hub release is normal.
beszel_agent_max_minor_lag: 2

# SSO: label of the Authentik login button on the hub's login page (the provider itself is reconciled from
# vault_docker_beszel_oidc_client_id / _secret by tasks/beszel_sync.yaml).
beszel_oidc_name: "Authentik"

# Headers the hub trusts for the real client IP (its PocketBase trustedProxy setting, reconciled by beszel_sync). SWAG sends
# X-Forwarded-For (see the beszel proxy definition); without this the hub logs the connection's source (WireGuard's UDM address).
beszel_trusted_proxy_headers:
  - X-Forwarded-For
# Network monitors — probes the agent on a system runs against a target (ICMP / TCP / HTTP / DNS), keyed by the
# definition key of the system that probes. Reconciled by beszel_sync (created / updated; extras on the hub are
# reported and only deleted with beszel_prune). Every system with a monitor also gets the NetworkMonitorLoss alert
# below (loss over the last hour above `value` percent). HTTP: a status >= 400 counts as loss; https targets also
# carry the certificate's expiry. Targets must use vault vars — this repo is public.
beszel_network_monitor_interval: 60      # seconds between probes (hub range 1-3600)
beszel_network_monitor_loss: { value: 5, min: 0 }   # the hub stores min=0 for this alert (it judges the last hour itself)
beszel_network_monitors:
  vps:        # VPS NPM -> WireGuard -> SWAG -> Authentik. auth.<domain> resolves to 127.0.0.1 inside the wireguard
              # netns (extra_hosts); any other public name would hairpin to the VPS's own IP and always fail here.
    - { protocol: http, target: "https://auth.{{ vault_domain_ext }}/-/health/live/" }
  apps:       # the databases most apps services depend on (core VIP), and SWAG itself + its certificate: internal DNS
              # sends www straight to SWAG (its own static page), so this checks SWAG, not the public chain (the VPS
              # probe above does that)
    - { protocol: http, target: "https://www.{{ vault_domain_ext }}/" }
    - { protocol: tcp, target: "{{ vault_core_vip }}", port: 5432 }
    - { protocol: tcp, target: "{{ vault_core_vip }}", port: 3306 }
  core:       # WAN from inside, and the mail relay Authentik sends through
    - { protocol: icmp, target: "1.1.1.1" }
    - { protocol: tcp, target: "{{ vault_apps_vip }}", port: 2525 }
  liberty:    # the Semaphore API the MeTube download trigger calls
    - { protocol: http, target: "{{ vault_semaphore_host_url }}/api/ping" }

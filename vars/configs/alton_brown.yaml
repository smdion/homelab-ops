# Profile for download_series.yaml -- Alton Brown "Cooks Food" YouTube series
# mirrored into Sonarr. A second series-to-Sonarr sync would be a new
# vars/configs/<name>.yaml profile here, not a new copy of the playbook or
# script -- matching download_videos.yaml's own multi-profile design (only
# one profile, "download", exists there today for the same reason).

series_sonarr_url: "http://localhost:8989/sonarr"
series_id: 238
series_folder: "Alton Brown Cooks Food (2025)"
# Full channel uploads, not the curated "Cooks Food" playlist -- the playlist
# lags new uploads by up to a day or two, which delayed picking up episode 41
# (2026-09-12). The channel also carries an unrelated "QQ" series that reuses
# "Episode N" titles, so alton_brown_sync.py's title regex requires the
# "Alton Brown Cooks Food |" prefix to avoid colliding with it.
series_source_url: "https://www.youtube.com/@AltonBrown/videos"
series_tv_root: "/mnt/remotes/REDEMPTION.SEANDION_TV"

# Specials with no episode number to auto-match against the channel listing --
# add an entry here by hand the rare time one shows up.
series_manual_overrides:
  - url: "https://www.youtube.com/watch?v=CRglbaevJkQ"
    season: 0
    episode: 1
  - url: "https://www.youtube.com/watch?v=H3XN-jHzUp0"
    season: 0
    episode: 2
  - url: "https://www.youtube.com/watch?v=0CcNxTkwrxE"
    season: 1
    episode: 19
  - url: "https://www.youtube.com/watch?v=SiI0GX2VhYM"
    season: 0
    episode: 3
  - url: "https://www.youtube.com/watch?v=pBBhKfpe820"
    season: 0
    episode: 4

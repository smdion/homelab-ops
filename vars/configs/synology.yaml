# Synology NAS offline backup — share definitions and sync config
#
# Mount strategy: single NFS share with subfolders per source.
# Synology exports /volume1/<synology_share_name> via NFS.
# Each item in synology_shares becomes a subfolder under the mount point.
synology_share_name: "Offline"
synology_shares:
  - "Backup"
  - "Data"
  - "Photography"
  - "Photos"
  - "NextCloudData"
synology_skip_shutdown: false
nfs_port: 2049
umount_timeout: 45
synology_cleanup_age: 31d
synology_boot_timeout: 90
synology_nfs_timeout: 300
synology_mount_settle: 5
synology_post_sync_delay: 60
synology_umount_retry_delay: 5
synology_mount_path: "/volume1/{{ synology_share_name }}"
synology_src_base_path: "/mnt/user/"
synology_backup_path: "/mnt/user/Backup"
backup_url: "https://synology.{{ vault_domain_ext }}"
backup_name: "Synology"
backup_subtype: "Offline"
backup_description: "Automatic Synology Backup"

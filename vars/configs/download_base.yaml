---
# Shared infrastructure for all download profiles.
# Loaded by download_videos.yaml before the profile-specific vars file.
# Per-user preferences (quality, filters, channels) live in the profile files.

# MeTube deployment — container name and host paths
metube_container: "metube"
metube_config_host_dir: "/mnt/user/appdata/youtube-dl"
metube_temp_dir: "/mnt/user/temp"
metube_temp_max_age_days: 15

# Config file path inside metube container (profile-specific)
metube_config_path: "/configs/{{ config_name }}/{{ config_name }}.conf"
# Manifest file for tracking download results (container /tmp)
metube_manifest: "/tmp/downloads_{{ config_name }}.jsonl"
# yt-dlp exit-status file (container /tmp) — written by the detached download
# wrapper so the next dispatcher run can detect success/failure of a finished run.
ytdlp_status_file: "/tmp/ytdlp_status_{{ config_name }}"
# Detached-download PID marker (container /tmp). The wrapper writes its PID at
# launch and removes it on exit; the dispatcher guard validates it against /proc
# (alive = a download is in flight). Doubles as the source for the HA tracker.
ytdlp_state_file: "/tmp/ytdlp_state_{{ config_name }}"

# MQTT publish target for the Home Assistant download-in-progress tracker.
# The dispatcher publishes the guard's running/idle truth (retained) to the
# mosquitto container on the apps host, so HA always has the last-known state
# without HA needing any access into the metube container.
metube_mqtt_publish_host: "apps.{{ vault_vm_search_domain }}"
metube_mqtt_container: "mosquitto"
metube_mqtt_topic: "homelab/metube/{{ config_name }}"

# Paths (inside metube container)
ytdlp_download_path: "/downloads/"
ytdlp_temp_path: "/tempvideo"
ytdlp_output: "%(extractor_key)s/%(uploader)s - %(title)s - %(id)s.%(ext)s"

# Extractor configuration
ytdlp_extractor_args: "youtube:player-client=default,-tv,web_safari,web_embedded"

# Cookies file (inside metube container) — required for YouTube bot-check bypass
ytdlp_cookies: "/configs/default/www.youtube.com_cookies.txt"

# Download defaults — profiles override per-user preferences
ytdlp_quality: "res"
ytdlp_format: "mp4"
ytdlp_rate_limit: "100M"
ytdlp_playlist_end: 5
ytdlp_reject_title: "TMS|The Morning Stream|TWBD|Be Dungeons"
ytdlp_archive: "/configs/default/downloaded"

# Fragment / retry handling.
# yt-dlp records a video in the download archive once it considers the download
# "successful" (YoutubeDL.process_info). With the default --skip-unavailable-fragments,
# fragmented downloads (all Twitch VODs, YouTube HLS) treat skipped 403 fragments as
# success — so an incomplete file gets archived and is never retried. Twitch CDN tokens
# commonly expire mid-download on long VODs, causing exactly this.
# Aborting on a missing fragment keeps the run a failure, so it is NOT archived and
# retries on the NEXT scheduled run (which re-extracts a fresh token).
# Set ytdlp_abort_on_missing_fragments to false on a profile to revert to skip behavior.
#
# Retries must stay BOUNDED: --abort-on-unavailable-fragments only triggers once a
# fragment's retries are exhausted. "infinite" would never exhaust, so a permanently
# dead fragment would loop forever and hang the run instead of aborting. The bounded
# values below absorb transient blips, then give up so the next run can retry cleanly.
ytdlp_abort_on_missing_fragments: true
ytdlp_fragment_retries: 25
ytdlp_retries: 10

# Discord notification URLs — used by download_videos.yaml
metube_avatar: "https://github.com/alexta69/metube/blob/master/ui/src/assets/icons/android-chrome-384x384.png?raw=true"
default_platform_icon: "https://raw.githubusercontent.com/imagegenius/templates/main/unraid/img/semaphore.png"
platform_icons:
  Youtube: "https://raw.githubusercontent.com/github/explore/d744245de144b89f3e3462949e08bfc91eda7fcf/topics/youtube/youtube.png"
  TwitchVod: "https://cdn0.iconfinder.com/data/icons/social-network-7/50/16-512.png"
platform_names:
  Youtube: "YouTube"
  TwitchVod: "Twitch"

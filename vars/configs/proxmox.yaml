# Proxmox infrastructure defaults — shared across all VMs.
# Moved from vars/definitions/vm_definitions.yaml per variable placement conventions.
# vault_pve_api_user, vault_pve_api_token_id, vault_pve_api_token_secret, vault_pve_vm_password
# are secrets — defined in vars/secrets.yaml.
vault_pve_api_host: "{{ vault_pve_vip }}"
pve_storage: "local-lvm"
pve_bridge: "vmbr0"
vm_user: "ansible"
vm_gateway: "{{ vault_vm_gateway }}"
vm_dns: "{{ vault_vm_dns }}"
vm_search_domain: "{{ vault_vm_search_domain }}"
vm_cidr: 24

# Cloud-init template — created automatically on first build.
# Storage is local-lvm (not shared), so the template must exist on pve_template_node.
pve_template_vmid: 9000
pve_template_node: "{{ vault_pve_template_node }}"
pve_template_name: "ubuntu-cloud-template"
pve_cloud_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
vm_template_memory: 2048
vm_template_cores: 2

# Local hosted desktop VM pool — permanent VMs with offset-based VMID and IP addressing.
# VMIDs: vm_hosted_slot_base + per-VM offset (VMID 8xx = IP .8x on prod VLAN)
vm_hosted_slot_base: 800

# Test VM slot pool — used by test-vm (and any future slot-based VMs).
# VMIDs: vm_test_slot_base .. vm_test_slot_base + vm_test_slot_count - 1
vm_test_slot_base: 1300
vm_test_slot_count: 10

# Keepalived VRRP config for the Proxmox management VIP (setup_pve_vip.yaml, maintain_pve.yaml).
# vault vars required: vault_pve_vip, vault_pve_vrrp_password,
#   vault_pve_vrrp_priorities (dict: short node name → priority; highest = MASTER — domain stripped automatically)
pve_vrrp_interface: "vmbr0"
pve_vrrp_router_id: 51
pve_vrrp_instance: "PVE_MGMT"
pve_vip_cidr: 24
pve_api_port: 8006

src_raw_files:
  - "/etc"
backup_name: "{{ 'PBS' if inventory_hostname in groups['pbs'] else ('PVE' if inventory_hostname in groups['pve'] else 'Proxmox') }}"
backup_description: "Automatic Proxmox Backup"
backup_type: "Appliances"
backup_subtype: "Config"
update_name: "Proxmox"
update_description: "Automatic Proxmox Update"
update_type: "Appliances"
update_subtype: "{{ 'PBS' if inventory_hostname in groups['pbs'] else 'PVE' }}"

pve_pool_production: "production"        # Docker VMs, game servers, manual VMs (no VLAN tag, VMID outside 800-899)
pve_pool_hosted: "hosted"                # local hosted VMs (no VLAN tag, VMID 800-899)
pve_pool_hosted_vmid_min: 800
pve_pool_hosted_vmid_max: 899
pve_pool_public_hosted: "public_hosted"  # public hosted VMs (VLAN 1682 / 192.168.12.x)
pve_pool_public_hosted_vlan: 1682
pve_pool_test: "test"                    # test VMs (VLAN 1683 / 192.168.13.x)
# test VLAN uses vault_test_vlan_id (already in secrets.yaml)

# VMIDs to exclude from the production pool even if they match the no-VLAN rule.
# Use this for VMs that sit on the default VLAN but should not be backed up via PBS pool jobs.
pve_pool_exclude_vmids: []

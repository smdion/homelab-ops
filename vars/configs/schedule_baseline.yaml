# Schedule Drift Baseline
# -----------------------
# Git-tracked expected schedule state for drift detection.
# Used by maintain_health.yaml CHECK 28b (schedule_drift).
#
# Format: list of { template_name, cron_expression } entries.
# The health check compares live Semaphore schedules against this baseline
# and alerts on any additions, removals, or cron expression changes.
#
# To update after an intentional schedule change:
#   1. Make the change in Semaphore
#   2. Update this file to match
#   3. Commit and push
#
# Source: Semaphore project__schedule + project__template (active=1)

schedule_baseline:
  - template_name: "Backup — Database [Primary MariaDB]"
    cron_expression: "0 1 * * 3"
  - template_name: "Backup — Database [Primary PostgreSQL]"
    cron_expression: "0 2 * * 3"
  - template_name: "Backup — Database [Secondary PostgreSQL]"
    cron_expression: "0 4 * * 3"
  - template_name: "Backup — AMP [Config]"
    cron_expression: "0 3 * * 4"
  - template_name: "Backup — Docker Run [Appdata]"
    cron_expression: "0 3 * * 0"
  - template_name: "Backup — Docker Stacks [Combined]"
    cron_expression: "0 1 * * 0"
  - template_name: "Backup — PiKVM [Config]"
    cron_expression: "0 23 * * 1"
  - template_name: "Backup — Proxmox [Config]"
    cron_expression: "0 23 * * 0"
  - template_name: "Backup — Unifi Network [Config]"
    cron_expression: "0 3 * * 5"
  - template_name: "Backup — Unifi Protect [Config]"
    cron_expression: "0 4 * * 5"
  - template_name: "Backup — unRAID [Config]"
    cron_expression: "0 2 1 * *"
  - template_name: "Backup — unRAID [Config]"
    cron_expression: "0 1 * * 4"
  - template_name: "Backup — unRAID [Offline]"
    cron_expression: "0 5 * * 3"
  - template_name: "Backup — B2 [Offsite]"
    cron_expression: "0 2 * * 0"
  - template_name: "Maintain — Ansible [Health]"
    cron_expression: "0 8 * * 0"
  - template_name: "Maintain — CrowdSec Bouncer [Restart]"
    cron_expression: "0 3 * * *"
  - template_name: "Maintain — Logging DB [Summary]"
    cron_expression: "0 8 * * 0"
  # "Download — Videos" is intentionally UNscheduled — it is event-driven (MeTube
  # Exec → Semaphore → self re-trigger), so it has no baseline cron. The playbook
  # header carries "# Schedule-exempt: Download — Videos" so the coverage check
  # skips it too. There used to be a second, separately-scheduled "[Channels]"
  # template here (periodic channel_list scan) — retired now that fast_check.py
  # covers discovery for both YouTube and Twitch.
  - template_name: "Maintain — AMP [Cleanup]"
    cron_expression: "0 8 * * 1"
  - template_name: "Maintain — Docker [Cleanup]"
    cron_expression: "0 5 * * *"
  - template_name: "Maintain — Guacamole [Connections]"
    cron_expression: "0 6 * * *"
  - template_name: "Maintain — Health [Check]"
    cron_expression: "00 07,19 * * *"
  - template_name: "Maintain — Logging DB [Cleanup]"
    cron_expression: "0 5 1 * *"
  - template_name: "Maintain — SSH [Known Hosts]"
    cron_expression: "0 3 * * 0"
  - template_name: "Maintain — PVE [Config]"
    cron_expression: "0 2 * * 0"
  - template_name: "Maintain — Unifi [Restart]"
    cron_expression: "0 1 * * *"
  - template_name: "Update — AMP [Instances]"
    cron_expression: "0 3 * * 6"
  - template_name: "Update — Docker Run [Containers]"
    cron_expression: "0 3 * * 2"
  - template_name: "Update — Docker Stacks [Containers]"
    cron_expression: "0 4 * * 2"
  - template_name: "Update — PiKVM [Appliance]"
    cron_expression: "0 3 * * 4"
  - template_name: "Update — Proxmox [Appliance]"
    cron_expression: "0 3 * * 1"
  - template_name: "Update — Ubuntu [OS]"
    cron_expression: "0 3 * * 3"
  - template_name: "Update — unRAID [Plugins]"
    cron_expression: "0 4 * * 2"
  - template_name: "Verify — AMP [Backup]"
    cron_expression: "0 4 * * 1"
  - template_name: "Verify — AMP [Backup]"
    cron_expression: "0 5 * * 4"
  - template_name: "Verify — Database [Primary MariaDB]"
    cron_expression: "0 4 * * 6"
  - template_name: "Verify — Database [Primary PostgreSQL]"
    cron_expression: "0 6 * * 6"
  - template_name: "Verify — Database [Secondary PostgreSQL]"
    cron_expression: "0 4 * * 1"
  - template_name: "Verify — Docker Run [Appdata]"
    cron_expression: "0 6 * * 0"
  - template_name: "Verify — Docker Stacks [Appdata]"
    cron_expression: "0 4 * * 0"
  - template_name: "Verify — Proxmox [Config]"
    cron_expression: "0 1 * * 1"
  - template_name: "Verify — unRAID [Config]"
    cron_expression: "0 4 * * 4"

---
# Semaphore template registry — the single, git-tracked source for EVERY Semaphore template.
#
# Semaphore keeps templates in its own database, so anything created or edited there by hand (UI, CLI, raw API) is
# invisible to git and lost on a rebuild. This file is the source of truth instead:
#   * deploy_semaphore_templates.yaml (template "Deploy — Semaphore [Templates]") makes Semaphore match it —
#     report-only by default, `-e semaphore_apply=true` creates/updates, `-e semaphore_prune=true` deletes extras.
#   * maintain_health CHECK 34 (`semaphore_templates`) alerts when a live template is missing here, absent live, or differs
#     — i.e. whenever something bypassed this file.
#   * scripts/check_semaphore_templates.py fails when a playbook (with a `# Category:` header) has no entry.
#
# To add or change a template: edit THIS file, commit, push to main, run the deploy template. Never use the Semaphore UI,
# `semaphore_cli.py template create/update` or the API for that. The same goes for schedules (below).
#
# Fields (names, not ids — the sync resolves them):
#   name, playbook, view, inventory, environment   required
#   arguments             optional JSON-array string of extra CLI args, e.g. '["-e","confirm=yes"]'
#   description           optional OVERRIDE — normally omitted: the description is derived from the playbook header
#                         (summary + Required/Optional extra vars), the same text the docs pages show
#   suppress_success_alerts / allow_debug          optional booleans (default false)
#   limit                 optional list of host patterns (the template-level Limit, which overrides a per-run --limit)
#   schedule              optional list of { cron, name } — the ONLY schedules this template has (none listed = none live).
#                         A playbook marked `# Schedule: none` (ad-hoc/manual) simply has no schedule here.
# Every template also gets the settings in semaphore_template_defaults.

semaphore_template_defaults:
  vault_key: ansible-vault                 # the vault password key attached to every template (without it secrets.yaml cannot be read)
  allow_override_args_in_task: true        # docs/runbooks/common-changes.md: both overrides on for every template
  allow_override_branch_in_task: true

semaphore_templates:


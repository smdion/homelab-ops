    tag: "latest"
  homebox:
    image: "ghcr.io/sysadminsmedia/homebox"
    tag: "latest"
  homepage:
    image: "ghcr.io/gethomepage/homepage"
    tag: "latest"
  jellyseerr:
    image: "fallenbagel/jellyseerr"
    tag: "preview-OIDC"
  mariadb:
    image: "lscr.io/linuxserver/mariadb"
    tag: "latest"
  netbootxyz:
    image: "netbootxyz/netbootxyz"
    tag: "latest"
  nfs:
    image: "itsthenetwork/nfs-server-alpine"
    tag: "latest"
  npm:
    image: "docker.io/jc21/nginx-proxy-manager"
    tag: "latest"
  postgres:

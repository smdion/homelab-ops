    stack: monitoring
    proxy:
      subdomain: grafana
      auth: true
      locations:
        - path: /
          port: 3000
          auth: true
          includes: [proxy]
        - path: "~ (/grafana)?/api"
          port: 3000
          auth: false
          includes: [proxy]
    env:
      GRAFANA_SERVER_ROOT_URL: "https://grafana.{{ vault_domain_ext }}"
      GRAFANA_SECURITY_ADMIN_PASSWORD: "{{ vault_docker_grafana_admin_password }}"
      GRAFANA_OAUTH_ENABLED: "true"
      GRAFANA_OAUTH_AUTO_LOGIN: "true"
      GRAFANA_OAUTH_CLIENT_ID: "{{ vault_docker_grafana_oauth_client_id }}"
      GRAFANA_OAUTH_CLIENT_SECRET: "{{ vault_docker_grafana_oauth_client_secret }}"
      GRAFANA_OAUTH_SCOPES: "openid profile email groups"
      GRAFANA_SIGNOUT_REDIRECT_URL: "https://auth.{{ vault_domain_ext }}/application/o/grafana/end-session/"
      GRAFANA_ROLE_ATTRIBUTE_PATH: "contains(groups, 'Grafana-Admin') && 'Admin' || contains(groups, 'Grafana-Editor') && 'Editor' || 'Viewer'"
      GRAFANA_GROUPS_ATTRIBUTE_PATH: "groups"
      OAUTH_NAME: "authentik"
      OAUTH_AUTH_URL: "https://auth.{{ vault_domain_ext }}/application/o/authorize/"
      OAUTH_TOKEN_URL: "https://auth.{{ vault_domain_ext }}/application/o/token/"
      OAUTH_API_URL: "https://auth.{{ vault_domain_ext }}/application/o/userinfo/"
      # Quiet grafana's plugin update-checker logger — it emits routine INFO every cycle
      # ("Update check succeeded" + a very verbose "flag evaluation succeeded" dump). This
      # only raises that one logger's threshold to warn; genuine warn/error still log.
      GRAFANA_LOG_FILTERS: "plugins.update.checker:warn"
    compose:
      base: base
      ports: ["3000:3000"]
      labels:
        homelab.backup.paths: "/opt/grafana"
        homelab.health_timeout: "150"
      environment:
        GF_SERVER_ROOT_URL: "${GRAFANA_SERVER_ROOT_URL}"
        GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_SECURITY_ADMIN_PASSWORD}"
        GF_AUTH_GENERIC_OAUTH_ENABLED: "${GRAFANA_OAUTH_ENABLED}"
        GF_AUTH_GENERIC_OAUTH_NAME: "${OAUTH_NAME}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${GRAFANA_OAUTH_CLIENT_ID}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_CLIENT_SECRET}"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "${GRAFANA_OAUTH_SCOPES}"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${OAUTH_AUTH_URL}"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "${OAUTH_TOKEN_URL}"
        GF_AUTH_GENERIC_OAUTH_API_URL: "${OAUTH_API_URL}"
        GF_AUTH_SIGNOUT_REDIRECT_URL: "${GRAFANA_SIGNOUT_REDIRECT_URL}"
        # Provider-scoped auto_login. The old [auth] oauth_auto_login (GF_AUTH_OAUTH_AUTO_LOGIN)
        # is deprecated — Grafana warns and wants auto_login inside the provider section.
        GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "${GRAFANA_OAUTH_AUTO_LOGIN}"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "${GRAFANA_ROLE_ATTRIBUTE_PATH}"
        GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: "${GRAFANA_GROUPS_ATTRIBUTE_PATH}"
        GF_LOG_FILTERS: "${GRAFANA_LOG_FILTERS}"
      volumes:

        homelab.backup.paths: "/opt/profilarr"
        homelab.proxy.subdomain: "profilarr"
        homelab.proxy.port: "6868"
        homelab.proxy.complex: "true"
    proxy:
      subdomain: profilarr
      external: false
      auth: true
      buffer_size:
        proxy_buffers: "8 16k"
        proxy_buffer_size: "32k"
      locations:
        - path: /
          port: 6868
          auth: true
          websocket: true
          includes: [proxy]
      volumes:
        - "${APPSDIR}/profilarr:/app/data"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:6868/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  restic:
    image: "restic/restic"
    tag: "latest"
  rickroll:
    image: "modem7/docker-rickroll"
    tag: "latest"
    stack: apps
    compose:
      base: baseenv
      ports: ["7344:8080"]
  swag:
    image: "lscr.io/linuxserver/swag"
    tag: "latest"
    stack: auth
    env:
      SWAG_URL: "{{ vault_domain_ext }}"
      SWAG_AUTH_ALIAS: "auth.{{ vault_domain_ext }}"
      SWAG_VALIDATION: "dns"
      SWAG_SUBDOMAINS: "wildcard"
      SWAG_ONLY_SUBDOMAINS: "false"
      SWAG_DNSPLUGIN: "cloudflare"
      SWAG_EXTRA_DOMAINS: "*.{{ vault_domain_ext_secondary }}"
      SWAG_STAGING: "false"
      SWAG_AUTORELOAD: "true"
      SWAG_DOCKER_MODS: "linuxserver/mods:swag-dashboard|linuxserver/mods:swag-maxmind|ghcr.io/linuxserver/mods:swag-crowdsec"
      SWAG_NGINX_LOG_PATH: "/config/log/nginx/access.log"
      SWAG_GEO_MEASUREMENT: "geoip2influx"
      SWAG_LOG_MEASUREMENT: "nginx_access_logs"
      SWAG_GEOIP2INFLUX_LOG_LEVEL: "error"
      SWAG_GEOIP2_SEND_NGINX_LOGS: "true"
      SWAG_INFLUX_DATABASE: "geoip2influx-{{ vault_domain_ext }}"
      SWAG_DISABLE_F2B: "true"
      SWAG_CROWDSEC_API_KEY: "{{ vault_docker_crowdsec_api_key }}"
      # Bouncer in STREAM mode: the bouncer caches the full decision list locally and
      # refreshes every UPDATE_FREQUENCY seconds, instead of querying LAPI per request
      # (live mode). Removes ~68ms/request and makes SWAG immune to CrowdSec LAPI blips.
      # The swag-crowdsec mod injects these into crowdsec-nginx-bouncer.conf on start.
      SWAG_CROWDSEC_MODE: "stream"
      SWAG_CROWDSEC_UPDATE_FREQUENCY: "10"
      MAXMINDDB_LICENSE_KEY: "{{ vault_docker_maxmind_license_key }}"
      MAXMINDDB_USER_ID: "{{ vault_docker_maxmind_user_id }}"
      INFLUX_HOST: "{{ vault_vm_core_ip }}"
      INFLUX_HOST_PORT: "8086"
      INFLUX_RETENTION: "30d"
      INFLUX_SHARD: "7d"
    compose:
      base: base
      network_aliases: ["${SWAG_AUTH_ALIAS}"]
      labels:
        homelab.backup.paths: "/opt/swag"
      ports: ["443:443", "8081:8081", "81:81"]
      environment:
        URL: "${SWAG_URL}"
        VALIDATION: "${SWAG_VALIDATION}"
        SUBDOMAINS: "${SWAG_SUBDOMAINS}"
        ONLY_SUBDOMAINS: "${SWAG_ONLY_SUBDOMAINS}"
        DNSPLUGIN: "${SWAG_DNSPLUGIN}"
        EMAIL: "${EMAIL}"
        EXTRA_DOMAINS: "${SWAG_EXTRA_DOMAINS}"
        STAGING: "${SWAG_STAGING}"
        SWAG_AUTORELOAD: "${SWAG_AUTORELOAD}"
        DOCKER_MODS: "${SWAG_DOCKER_MODS}"
        MAXMINDDB_LICENSE_KEY: "${MAXMINDDB_LICENSE_KEY}"
        MAXMINDDB_USER_ID: "${MAXMINDDB_USER_ID}"
        NGINX_LOG_PATH: "${SWAG_NGINX_LOG_PATH}"
        GEO_MEASUREMENT: "${SWAG_GEO_MEASUREMENT}"
        LOG_MEASUREMENT: "${SWAG_LOG_MEASUREMENT}"
        SEND_NGINX_LOGS: "${SWAG_GEOIP2_SEND_NGINX_LOGS}"
        GEOIP2INFLUX_LOG_LEVEL: "${SWAG_GEOIP2INFLUX_LOG_LEVEL}"
        INFLUX_HOST: "${INFLUX_HOST}"
        INFLUX_HOST_PORT: "${INFLUX_HOST_PORT}"
        INFLUX_DATABASE: "${SWAG_INFLUX_DATABASE}"
        INFLUX_RETENTION: "${INFLUX_RETENTION}"
        INFLUX_SHARD: "${INFLUX_SHARD}"
        CROWDSEC_API_KEY: "${SWAG_CROWDSEC_API_KEY}"
        CROWDSEC_LAPI_URL: "${CROWDSEC_LAPI_URL}"
        CROWDSEC_MODE: "${SWAG_CROWDSEC_MODE}"
        CROWDSEC_UPDATE_FREQUENCY: "${SWAG_CROWDSEC_UPDATE_FREQUENCY}"
        DISABLE_F2B: "${SWAG_DISABLE_F2B}"
      volumes:
        - "${APPSDIR}/swag:/config"
      cap_add:
        - NET_ADMIN
      # Cap the docker json-file log. nginx access_log also writes /dev/stdout so
      # CrowdSec can tail `docker logs swag` (docker acquisition); without a cap this
      # grows unbounded (observed 38MB). Rotation keeps it bounded.
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsk https://localhost:443 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  tautulli:
    image: "lscr.io/linuxserver/tautulli"
    tag: "latest"
    stack: media
    env:
      # Config for files/tautulli_watched_cleanup.py — deletes YouTube/Twitch
      # library files (+ Plex metadata) once Tautulli's "Watched" notification
      # agent reports them watched for at least this many hours. Tautulli
      # itself injects TAUTULLI_URL/APIKEY/PLEX_URL/PLEX_TOKEN into the
      # script's environment automatically, so only the script-specific
      # settings need to be defined here.
      TAUTULLI_CLEANUP_SECTION_IDS: "6,3"
      TAUTULLI_CLEANUP_MIN_HOURS: "3"
      TAUTULLI_CLEANUP_LOG_FILE: "/config/scripts/tautulli_watched_cleanup.log"
    compose:
      base: baseuid
      ports: ["8181:8181"]
      labels:
        homelab.backup.paths: "/opt/tautulli"
      environment:
        TAUTULLI_CLEANUP_SECTION_IDS: "${TAUTULLI_CLEANUP_SECTION_IDS}"
        TAUTULLI_CLEANUP_MIN_HOURS: "${TAUTULLI_CLEANUP_MIN_HOURS}"
        TAUTULLI_CLEANUP_LOG_FILE: "${TAUTULLI_CLEANUP_LOG_FILE}"
      volumes:
        - "${APPSDIR}/tautulli:/config"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:8181/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  wireguard:
    image: "lscr.io/linuxserver/wireguard"
    tag: "latest"
    stack: vpn
    env:
      WG_SERVERURL: "{{ vault_vps_fqdn }}"
      WG_SERVERPORT: "51820"
      WG_PEERS: "3"
      WG_INTERNAL_SUBNET: "{{ vault_wg_internal_subnet }}"
    compose:
      image_var: WG
      base: base
      ports: ["51820:51820/udp", "443:443"]
      # Pinned to its own current dynamically-assigned IP (confirmed live, 2026-07-28) —
      # not a new value. Makes the gateway IP other hosts route through this tunnel
      # (e.g. vps's own host-level route to core's LAPI) a declared fact instead of
      # something only discoverable via `docker inspect`. Recreation is a no-op for
      # networking since the IP doesn't actually change.
      static_ip: "172.21.0.2"
      labels:
        homelab.backup.paths: "/opt/wireguard"
      environment:
        SERVERURL: "${WG_SERVERURL}"
        SERVERPORT: "${WG_SERVERPORT}"
        PEERS: "${WG_PEERS}"
        INTERNAL_SUBNET: "${WG_INTERNAL_SUBNET}"
      volumes:
        - "${APPSDIR}/wireguard:/config"
      sysctls:
        - "net.ipv4.conf.all.src_valid_mark=1"
      cap_add:
        - NET_ADMIN
      healthcheck:
        test: ["CMD-SHELL", "wg show wg0 > /dev/null 2>&1 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  vpn_beszel_agent:
    image: "henrygd/beszel-agent"
    tag: "latest"
    stack: vpn
    env:
      BESZEL_LISTEN: "45876"
      BESZEL_KEY: "{{ vault_docker_beszel_key }}"
    compose:
      image_var: BESZEL_AGENT
      service_name: beszel-agent
      container_name: beszel-agent
      base: base
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      environment:
        LISTEN: "${BESZEL_LISTEN}"
        KEY: "${BESZEL_KEY}"
      volumes:
        - "${APPSDIR}/beszel_socket:/beszel_socket"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
  vpn_dozzle_agent:
    image: "amir20/dozzle"
    tag: "latest"
    stack: vpn
    compose:
      image_var: DOZZLE
      service_name: dozzle-agent
      container_name: dozzle-agent
      base: baseenv
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      command: agent
  xbackbone:
    image: "lscr.io/linuxserver/xbackbone"
    tag: "latest"
    stack: apps
    proxy:
      subdomain: img
      aliases: [images, image, i]
      auth: false
      locations:
        - path: /
          port: 8444
          proto: https
          auth: false
          includes: [proxy]
          add_headers:
            Strict-Transport-Security: '"max-age=15768000; includeSubDomains; preload;"'
          headers:
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: '"SAMEORIGIN"'
          directives:
            - "proxy_max_temp_file_size 5096m"
    compose:
      base: baseuid
      ports: ["8088:80", "8444:443"]
      labels:
        homelab.backup.paths: "/opt/xbackbone"
      volumes:
        - "${APPSDIR}/xbackbone:/config"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:80 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  zigbee2mqtt:
    image: "koenkk/zigbee2mqtt"
    tag: "latest"
    stack: apps
    proxy:
      subdomain: zigbee
      external: false
      auth: true
      locations:
        - path: /
          port: 8080
          websocket: true
    compose:
      base: baseenv
      ports: ["8080:8080"]
      labels:
        homelab.backup.paths: "/opt/zigbee2mqtt"
        homelab.backup.exclude: "log,*.db.backup"
        homelab.proxy.subdomain: "zigbee"
        homelab.proxy.external: "false"
      volumes:
        - "${APPSDIR}/zigbee2mqtt:/app/data"
        - "/run/dbus:/run/dbus:ro"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"

---
# Container image definitions — single source of truth for all deployed images.
# Every service's image and tag is defined here, referenced via env.j2 templates,
# and consumed by docker-compose.yaml through ${IMAGE}:${TAG} substitution.
#
# To update an image version: change the tag here, then redeploy the stack.
# Pinned images (non-latest) require manual version bumps — do not auto-update.
#
# To add a new container:
#   1. Add an entry below (image + tag), alphabetically by key
#   2. Add IMAGE/TAG env vars to the stack's env.j2:
#        MY_IMAGE={{ container_definitions.myapp.image }}
#        MY_TAG={{ container_definitions.myapp.tag }}
#   3. Update docker-compose.yaml image line: image: ${MY_IMAGE}:${MY_TAG}
#   4. If the service has a database, add an entry in vars/definitions/app_definitions.yaml
#
# Optional fields:
#   stack      — compose stack this container runs in (required if guacamole: is set)
#   guacamole  — Guacamole connection metadata (auto-derived by sync_guacamole_connections.yaml)
#     name           — display name in Guacamole UI
#     group          — connection group (Proxmox, Docker, Tools, etc.)
#     protocol       — ssh (default) or vnc
#     port           — VNC port on the host (e.g., 7914)
#     command        — SSH exec command (e.g., "sudo docker exec -it foo /bin/bash")
#     user_groups    — Authentik groups granted READ access (omit for admin-only)
#
# Compose generation fields (optional — stacks with these generate compose from definitions):
#   compose        — dict of compose-level service configuration
#     container_name — container name (defaults to service_name, which defaults to key with _ → -)
#     service_name   — compose service name (defaults to key with underscores converted to dashes)
#     image_var      — env var prefix for image/tag (defaults to KEY_UPPER; e.g., "CSUI" → ${CSUI_IMAGE})
#     base           — anchor pattern: base, baseenv, baseuid (controls mem/restart/env/uid injection)
#     networks       — list of networks (default: [homelab])
#     ports          — list of port mappings ("host:container" or "host:container/udp")
#     volumes        — list of volume mounts
#     environment    — dict of environment variables (values use ${VAR} for .env substitution)
#     labels         — dict of container labels
#     healthcheck    — dict with test, interval, timeout, retries, start_period
#     depends_on     — list of service dependencies
#     command        — override command
#     profiles       — list of compose profiles
#     privileged     — bool
#     cap_add        — list of capabilities
#     sysctls        — list of sysctl settings
#     network_mode   — override network mode (e.g., "host", "service:wireguard")
#     security_opt   — list of security options
#     shm_size       — shared memory size (e.g., "2g")
#     network_aliases — list of network aliases on the default network

container_definitions:
  adminer:
    image: "adminer"
    tag: "latest"
    stack: databases
    env:
      ADMINER_DESIGN: "{{ docker_adminer_design }}"
    compose:
      base: base
      ports: ["8087:8080"]
      labels:
        homelab.backup.paths: "/opt/adminer"
      environment:
        ADMINER_DESIGN: "${ADMINER_DESIGN}"
      volumes:
        - "${APPSDIR}/adminer/hydra.css:/var/www/html/designs/hydra/adminer.css"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "15s"
  authentik:
    image: "ghcr.io/goauthentik/server"
    tag: "2025.12.4"
    stack: auth
    compose:
      base: base
      ports: ["9001:9000", "9443:9443"]
      labels:
        homelab.backup.paths: "/opt/authentik_worker"
        homelab.health_timeout: "420"
        homelab.restore.app: "authentik"
        homelab.restore.db_config: "db_primary_postgres"
        homelab.restore.db_names: "authentik"
        homelab.restore.health_url: "http://localhost:9001/-/health/ready/"
        homelab.restore.health_status: "204"
      environment:
        AUTHENTIK_POSTGRESQL__HOST: "${POSTGRES_HOST}"
        AUTHENTIK_POSTGRESQL__USER: "${POSTGRES_USER}"
        AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
        AUTHENTIK_ERROR_REPORTING__ENABLED: "${AUTHENTIK_ERROR_REPORTING_ENABLED}"
        AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
        AUTHENTIK_EMAIL__HOST: "${EMAIL_HOST}"
        AUTHENTIK_EMAIL__PORT: "${EMAIL_PORT}"
        AUTHENTIK_EMAIL__USERNAME: "${EMAIL_USERNAME}"
        AUTHENTIK_EMAIL__PASSWORD: "${EMAIL_PASSWORD}"
        AUTHENTIK_EMAIL__FROM: "${AUTHENTIK_EMAIL_FROM}"
        AUTHENTIK_EMAIL__USE_TLS: "${AUTHENTIK_EMAIL_USE_TLS}"
        AUTHENTIK_EMAIL__TIMEOUT: "${AUTHENTIK_EMAIL_TIMEOUT}"
        AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "${AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS}"
        AUTHENTIK_WORKERS: "${AUTHENTIK_WORKERS}"
      volumes:
        - "${APPSDIR}/authentik_worker/data:/data"
        - "${APPSDIR}/authentik_worker/templates:/templates"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      command: server
      healthcheck:
        test: ["CMD", "ak", "healthcheck"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  authentik_worker:
    image: "ghcr.io/goauthentik/server"
    tag: "2025.12.4"
    stack: auth
    compose:
      image_var: AUTHENTIK
      service_name: authentik_worker
      container_name: authentik_worker
      base: base
      environment:
        AUTHENTIK_POSTGRESQL__HOST: "${POSTGRES_HOST}"
        AUTHENTIK_POSTGRESQL__USER: "${POSTGRES_USER}"
        AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
        AUTHENTIK_ERROR_REPORTING__ENABLED: "${AUTHENTIK_ERROR_REPORTING_ENABLED}"
        AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
        AUTHENTIK_WORKER_CONCURRENCY: "${AUTHENTIK_WORKER_CONCURRENCY}"
        AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "${AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS}"
      volumes:
        - "${APPSDIR}/authentik_worker/backups:/backups"
        - "${APPSDIR}/authentik_worker/data:/data"
        - "${APPSDIR}/authentik_worker/certs:/certs"
        - "${APPSDIR}/authentik_worker/templates:/templates"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      command: worker
      healthcheck:
        test: ["CMD", "ak", "healthcheck"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  beszel:
    image: "henrygd/beszel"
    tag: "latest"
    stack: vpn
    compose:
      base: baseenv
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      labels:
        homelab.backup.paths: "/opt/beszel"
        homelab.health_timeout: "90"
      volumes:
        - "${APPSDIR}/beszel:/beszel_data"
        - "${APPSDIR}/beszel_socket:/beszel_socket"
  beszel_agent:
    image: "henrygd/beszel-agent"
    tag: "latest"
    stack: infra
    compose:
      base: base
      network_mode: host
      labels:
        homelab.backup.paths: "/opt/beszel_socket"
        homelab.test.skip_health: "true"
      environment:
        LISTEN: "${BESZEL_LISTEN}"
        KEY: "${BESZEL_KEY}"
      volumes:
        - "${APPSDIR}/beszel_socket:/beszel_socket"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
  cloudflareddns:
    image: "ghcr.io/hotio/cloudflareddns"
    tag: "latest"
    stack: apps
    compose:
      image_var: DDNS
      base: base
      labels:
        homelab.backup.paths: "/opt/cloudflareddns"
      environment:
        INTERVAL: "${DDNS_INTERVAL}"
        DETECTION_MODE: "${DDNS_DETECTION_MODE}"
        LOG_LEVEL: "${DDNS_LOG_LEVEL}"
        CF_USER: "${EMAIL}"
        CF_APIKEY: "${DDNS_CF_APIKEY}"
        CF_HOSTS: "${DDNS_CF_HOSTS}"
        CF_ZONES: "${DDNS_CF_ZONES}"
        CF_RECORDTYPES: "${DDNS_CF_RECORDTYPES}"
      volumes:
        - "${APPSDIR}/cloudflareddns:/config"
  code_server:
    image: "lscr.io/linuxserver/code-server"
    tag: "latest"
    stack: dev
    compose:
      image_var: CODESERVER
      base: baseuid
      ports: ["8443:8443"]
      labels:
        homelab.backup.paths: "/opt/code-server,/opt/homelab-ops,/opt/homelab-docs,/opt/freshjams-ops"
        homelab.health_timeout: "90"
      environment:
        PROXY_DOMAIN: "${CODESERVER_PROXY_DOMAIN}"
        DEFAULT_WORKSPACE: "${CODESERVER_DEFAULT_WORKSPACE}"
      volumes:
        - "core:/workspace/core"
        - "apps:/workspace/apps"
        - "dev:/workspace/dev"
        - "vps:/workspace/vps"
        - "homelab-ops:/workspace/homelab-ops"
        - "homelab-docs:/workspace/homelab-docs"
        - "freshjams-ops:/workspace/freshjams-ops"
        - "/opt/CLAUDE.md:/workspace/CLAUDE.md:ro"
        - "${APPSDIR}/code-server:/config"
        - "./custom-cont-init.d:/custom-cont-init.d:ro"
      healthcheck:
        test: ["CMD-SHELL", "ls /workspace/core /workspace/apps /workspace/dev /workspace/vps /workspace/homelab-ops /workspace/homelab-docs /workspace/freshjams-ops > /dev/null 2>&1 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  crowdsec:
    image: "docker.io/crowdsecurity/crowdsec"
    tag: "latest"
    stack: auth
    guacamole:
      name: Crowdsec
      group: Tools
      command: "sudo docker exec -it crowdsec /bin/bash"
    compose:
      base: base
      ports: ["8080:8080", "6060:6060"]
      labels:
        homelab.backup.paths: "/opt/crowdsec"
      environment:
        COLLECTIONS: "${CROWDSEC_COLLECTIONS}"
        CUSTOM_HOSTNAME: "${CROWDSEC_CUSTOM_HOSTNAME}"
      volumes:
        - "${APPSDIR}/crowdsec/config:/etc/crowdsec"
        - "${APPSDIR}/crowdsec/data:/var/lib/crowdsec/data"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      security_opt:
        - "no-new-privileges=true"
      healthcheck:
        test: ["CMD", "cscli", "version"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  crowdsec_web_ui:
    image: "ghcr.io/theduffman85/crowdsec-web-ui"
    tag: "latest"
    stack: monitoring
    compose:
      image_var: CSUI
      base: base
      ports: ["3001:3000"]
      labels:
        homelab.backup.paths: "/opt/crowdsec-web-ui"
      environment:
        CROWDSEC_URL: "${CSUI_CROWDSEC_URL}"
        CROWDSEC_USER: "${CSUI_CROWDSEC_USER}"
        CROWDSEC_PASSWORD: "${CSUI_CROWDSEC_PASSWORD}"
      volumes:
        - "${APPSDIR}/crowdsec-web-ui:/app/data"
      healthcheck:
        test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "15s"
  docs:
    image: "nginx"
    tag: "alpine"
    stack: dev
    compose:
      base: base
      ports: ["8084:80"]
      labels:
        homelab.backup.paths: "/opt/homelab-docs"
        homelab.test.skip_health: "true"
      volumes:
        - "${APPSDIR}/homelab-docs/site:/usr/share/nginx/html:ro"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsk http://localhost:80 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "10s"
  dozzle:
    image: "amir20/dozzle"
    tag: "latest"
    stack: infra
    compose:
      base: base
      ports: ["8081:8080"]
      environment:
        DOZZLE_LEVEL: "${DOZZLE_LEVEL}"
        DOZZLE_REMOTE_AGENT: "${DOZZLE_REMOTE_AGENT}"
        DOZZLE_HOSTNAME: "${DOZZLE_HOSTNAME}"
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      profiles: ["hub"]
  dozzle_agent:
    image: "amir20/dozzle"
    tag: "latest"
    stack: infra
    compose:
      image_var: DOZZLE
      base: baseenv
      ports: ["7007:7007"]
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      command: agent
      profiles: ["agent"]
  firefox:
    image: "jlesage/firefox"
    tag: "latest"
    stack: apps
    guacamole:
      name: Firefox
      group: Tools
      protocol: vnc
      port: 7914
      user_groups: [Guac-Firefox]
    compose:
      base: base
      ports: ["7814:5800", "7914:5900"]
      labels:
        homelab.backup.paths: "/opt/firefox"
      environment:
        DISPLAY_WIDTH: "${FF_DISPLAY_WIDTH}"
        DISPLAY_HEIGHT: "${FF_DISPLAY_HEIGHT}"
        SECURE_CONNECTION: "${FF_SECURE_CONNECTION}"
        DARK_MODE: "${FF_DARK_MODE}"
        WEB_AUDIO: "${FF_WEB_AUDIO}"
      volumes:
        - "${APPSDIR}/firefox:/config"
      shm_size: "2g"
  grafana:
    image: "grafana/grafana"
    tag: "latest"
    stack: monitoring
    compose:
      base: base
      ports: ["3000:3000"]
      labels:
        homelab.backup.paths: "/opt/grafana"
        homelab.health_timeout: "150"
      environment:
        GF_SERVER_ROOT_URL: "${GRAFANA_SERVER_ROOT_URL}"
        GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_SECURITY_ADMIN_PASSWORD}"
        GF_AUTH_GENERIC_OAUTH_ENABLED: "${GRAFANA_OAUTH_ENABLED}"
        GF_AUTH_GENERIC_OAUTH_NAME: "${OAUTH_NAME}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${GRAFANA_OAUTH_CLIENT_ID}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_CLIENT_SECRET}"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "${GRAFANA_OAUTH_SCOPES}"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${OAUTH_AUTH_URL}"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "${OAUTH_TOKEN_URL}"
        GF_AUTH_GENERIC_OAUTH_API_URL: "${OAUTH_API_URL}"
        GF_AUTH_SIGNOUT_REDIRECT_URL: "${GRAFANA_SIGNOUT_REDIRECT_URL}"
        GF_AUTH_OAUTH_AUTO_LOGIN: "${GRAFANA_OAUTH_AUTO_LOGIN}"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "${GRAFANA_ROLE_ATTRIBUTE_PATH}"
        GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: "${GRAFANA_GROUPS_ATTRIBUTE_PATH}"
      volumes:
        - "${APPSDIR}/grafana:/var/lib/grafana"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  guacamole:
    image: "abesnier/guacamole"
    tag: "latest"
    stack: apps
    compose:
      image_var: GUAC
      base: base
      ports: ["8084:8080"]
      labels:
        homelab.backup.paths: "/opt/guacamole"
      environment:
        EXTENSIONS: "${GUAC_EXTENSIONS}"
      volumes:
        - "${APPSDIR}/guacamole:/config"
        - "${APPSDIR}/guacamole/server.xml:/usr/local/tomcat/conf/server.xml"
      privileged: true
  homeassistant:
    image: "lscr.io/linuxserver/homeassistant"
    tag: "latest"
    stack: apps
    compose:
      image_var: HA
      base: baseuid
      ports: ["8123:8123"]
      labels:
        homelab.backup.paths: "/opt/home_assistant"
        homelab.backup.exclude: ".cache,deps,__pycache__,*.pyc"
        homelab.health_timeout: "150"
      volumes:
        - "${APPSDIR}/home_assistant/:/config"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:8123/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "120s"
  homebox:
    image: "ghcr.io/sysadminsmedia/homebox"
    tag: "latest"
    stack: apps
    compose:
      base: baseenv
      ports: ["3100:7745"]
      labels:
        homelab.backup.paths: "/opt/homebox"
      volumes:
        - "${APPSDIR}/homebox:/data/"
  homepage:
    image: "ghcr.io/gethomepage/homepage"
    tag: "latest"
    stack: apps
    compose:
      base: base
      ports: ["3003:3000"]
      labels:
        homelab.backup.paths: "/opt/homepage"
      environment:
        HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS}"
      volumes:
        - "${APPSDIR}/homepage:/app/config"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  jellyseerr:
    image: "fallenbagel/jellyseerr"
    tag: "preview-OIDC"
    stack: media
    env:
      JELLYSEERR_DB_TYPE: "postgres"
      JELLYSEERR_POSTGRES_DB: "jellyseerr"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "{{ docker_postgres_user }}"
      POSTGRES_PASSWORD: "{{ vault_docker_postgres_password }}"
    compose:
      base: base
      ports: ["5055:5055"]
      labels:
        homelab.backup.paths: "/opt/jellyseerr"
        homelab.restore.app: "jellyseerr"
        homelab.restore.db_config: "db_primary_postgres"
        homelab.restore.db_names: "jellyseerr"
        homelab.restore.health_url: "http://localhost:5055/"
      environment:
        DB_TYPE: "${JELLYSEERR_DB_TYPE}"
        DB_HOST: "${POSTGRES_HOST}"
        DB_PORT: "${POSTGRES_PORT}"
        DB_USER: "${POSTGRES_USER}"
        DB_PASS: "${POSTGRES_PASSWORD}"
        DB_NAME: "${JELLYSEERR_POSTGRES_DB}"
      volumes:
        - "${APPSDIR}/jellyseerr:/app/config"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  mariadb:
    image: "lscr.io/linuxserver/mariadb"
    tag: "latest"
    stack: databases
    env:
      MARIA_PASSWORD: "{{ vault_docker_mariadb_password }}"
    compose:
      image_var: MARIA
      base: baseuid
      ports: ["3306:3306"]
      labels:
        homelab.wait_port: "3306"
        homelab.health_timeout: "180"
      environment:
        MYSQL_ROOT_PASSWORD: "${MARIA_PASSWORD}"
      volumes:
        - "${APPSDIR}/mariadb:/config"
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: "15s"
        timeout: "5s"
        retries: 3
        start_period: "30s"
  netbootxyz:
    image: "netbootxyz/netbootxyz"
    tag: "latest"
    stack: dev
    compose:
      image_var: NETBOOT
      base: baseuid
      labels:
        homelab.backup.paths: "/opt/netboot"
      ports: ["3002:3000", "69:69/udp", "8082:80"]
      volumes:
        - "${APPSDIR}/netboot/config:/config"
        - "${APPSDIR}/netboot/assets:/assets"
  nfs:
    image: "itsthenetwork/nfs-server-alpine"
    tag: "latest"
    stack: vpn
    compose:
      base: base
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      environment:
        SHARED_DIRECTORY: "${NFS_SHARED_DIRECTORY}"
        SYNC: "${NFS_SYNC}"
      volumes:
        - "${APPSDIR}:/nfsshare"
      privileged: true
  npm:
    image: "docker.io/jc21/nginx-proxy-manager"
    tag: "latest"
    stack: vpn
    compose:
      base: baseuid
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      labels:
        homelab.backup.paths: "/opt/npm,/opt/npm-le"
      volumes:
        - "${APPSDIR}/npm:/data:rw"
        - "${APPSDIR}/npm-le:/etc/letsencrypt"
      privileged: true
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:81 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  postgres:
    image: "postgres"
    tag: "16-alpine"
    stack: databases
    env:
      POSTGRES_PASSWORD: "{{ vault_docker_postgres_password }}"
      POSTGRES_USER: "{{ docker_postgres_user }}"
      POSTGRES_DEFAULT_DB: "{{ docker_postgres_default_db }}"
    compose:
      base: baseuid
      ports: ["5432:5432"]
      labels:
        homelab.wait_port: "5432"
        homelab.health_timeout: "180"
      environment:
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_DB: "${POSTGRES_DEFAULT_DB}"
      volumes:
        - "${APPSDIR}/postgres:/var/lib/postgresql/data/"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: "15s"
        timeout: "5s"
        retries: 3
        start_period: "30s"
  restic:
    image: "restic/restic"
    tag: "latest"
    stack: backups
    compose:
      container_name: restic
      volumes:
        - "${BACKUP_SOURCE}:/data:ro"
        - "${CACHE_DIR}:/root/.cache/restic"
      environment:
        AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
        AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
        RESTIC_REPOSITORY: "${RESTIC_REPOSITORY}"
        RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  rickroll:
    image: "modem7/docker-rickroll"
    tag: "latest"
    stack: apps
    compose:
      base: baseenv
      ports: ["7344:8080"]
  socket_proxy:
    image: "lscr.io/linuxserver/socket-proxy"
    tag: "latest"
    stack: infra
    compose:
      service_name: dockerproxy
      container_name: dockerproxy
      base: base
      ports: ["2375:2375"]
      environment:
        CONTAINERS: "${DP_CONTAINERS}"
        POST: "${DP_POST}"
        INFO: "${DP_INFO}"
        VOLUMES: "${DP_VOLUMES}"
        SECRETS: "${DP_SECRETS}"
        IMAGES: "${DP_IMAGES}"
        NETWORKS: "${DP_NETWORKS}"
        ALLOW_RESTARTS: "${DP_ALLOW_RESTARTS}"
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      privileged: true
  swag:
    image: "lscr.io/linuxserver/swag"
    tag: "latest"
    stack: auth
    compose:
      base: base
      network_aliases: ["${SWAG_AUTH_ALIAS}"]
      labels:
        homelab.backup.paths: "/opt/swag"
      ports: ["443:443", "8081:8081", "81:81"]
      environment:
        URL: "${SWAG_URL}"
        VALIDATION: "${SWAG_VALIDATION}"
        SUBDOMAINS: "${SWAG_SUBDOMAINS}"
        ONLY_SUBDOMAINS: "${SWAG_ONLY_SUBDOMAINS}"
        DNSPLUGIN: "${SWAG_DNSPLUGIN}"
        EMAIL: "${EMAIL}"
        EXTRA_DOMAINS: "${SWAG_EXTRA_DOMAINS}"
        STAGING: "${SWAG_STAGING}"
        SWAG_AUTORELOAD: "${SWAG_AUTORELOAD}"
        DOCKER_MODS: "${SWAG_DOCKER_MODS}"
        MAXMINDDB_LICENSE_KEY: "${MAXMINDDB_LICENSE_KEY}"
        MAXMINDDB_USER_ID: "${MAXMINDDB_USER_ID}"
        NGINX_LOG_PATH: "${SWAG_NGINX_LOG_PATH}"
        GEO_MEASUREMENT: "${SWAG_GEO_MEASUREMENT}"
        LOG_MEASUREMENT: "${SWAG_LOG_MEASUREMENT}"
        SEND_NGINX_LOGS: "${SWAG_GEOIP2_SEND_NGINX_LOGS}"
        GEOIP2INFLUX_LOG_LEVEL: "${SWAG_GEOIP2INFLUX_LOG_LEVEL}"
        INFLUX_HOST: "${INFLUX_HOST}"
        INFLUX_HOST_PORT: "${INFLUX_HOST_PORT}"
        INFLUX_DATABASE: "${SWAG_INFLUX_DATABASE}"
        INFLUX_RETENTION: "${INFLUX_RETENTION}"
        INFLUX_SHARD: "${INFLUX_SHARD}"
        CROWDSEC_API_KEY: "${SWAG_CROWDSEC_API_KEY}"
        CROWDSEC_LAPI_URL: "${CROWDSEC_LAPI_URL}"
        DISABLE_F2B: "${SWAG_DISABLE_F2B}"
      volumes:
        - "${APPSDIR}/swag:/config"
      cap_add:
        - NET_ADMIN
      healthcheck:
        test: ["CMD-SHELL", "curl -fsk https://localhost:443 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  tautulli:
    image: "lscr.io/linuxserver/tautulli"
    tag: "latest"
    stack: media
    compose:
      base: baseuid
      ports: ["8181:8181"]
      labels:
        homelab.backup.paths: "/opt/tautulli"
      volumes:
        - "${APPSDIR}/tautulli:/config"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:8181/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  wireguard:
    image: "lscr.io/linuxserver/wireguard"
    tag: "latest"
    stack: vpn
    compose:
      image_var: WG
      base: base
      ports: ["51820:51820/udp", "443:443"]
      labels:
        homelab.backup.paths: "/opt/wireguard"
      environment:
        SERVERURL: "${WG_SERVERURL}"
        SERVERPORT: "${WG_SERVERPORT}"
        PEERS: "${WG_PEERS}"
        INTERNAL_SUBNET: "${WG_INTERNAL_SUBNET}"
      volumes:
        - "${APPSDIR}/wireguard:/config"
      sysctls:
        - "net.ipv4.conf.all.src_valid_mark=1"
      cap_add:
        - NET_ADMIN
      healthcheck:
        test: ["CMD-SHELL", "wg show wg0 > /dev/null 2>&1 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  vpn_beszel_agent:
    image: "henrygd/beszel-agent"
    tag: "latest"
    stack: vpn
    compose:
      image_var: BESZEL_AGENT
      service_name: beszel-agent
      container_name: beszel-agent
      base: base
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      environment:
        LISTEN: "${BESZEL_LISTEN}"
        KEY: "${BESZEL_KEY}"
      volumes:
        - "${APPSDIR}/beszel_socket:/beszel_socket"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
  vpn_dockerproxy:
    image: "lscr.io/linuxserver/socket-proxy"
    tag: "latest"
    stack: vpn
    compose:
      image_var: SOCKET_PROXY
      service_name: dockerproxy
      container_name: dockerproxy
      base: base
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      environment:
        CONTAINERS: "${DP_CONTAINERS}"
        POST: "${DP_POST}"
        INFO: "${DP_INFO}"
        VOLUMES: "${DP_VOLUMES}"
        SECRETS: "${DP_SECRETS}"
        IMAGES: "${DP_IMAGES}"
        NETWORKS: "${DP_NETWORKS}"
        ALLOW_RESTARTS: "${DP_ALLOW_RESTARTS}"
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      privileged: true
  vpn_dozzle_agent:
    image: "amir20/dozzle"
    tag: "latest"

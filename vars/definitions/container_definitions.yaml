      labels:
        homelab.backup.paths: "/opt/xbackbone"
      volumes:
        - "${APPSDIR}/xbackbone:/config"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:80 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"

---
# Container image definitions — single source of truth for all deployed images.
# Every service's image and tag is defined here, referenced via env.j2 templates,
# and consumed by docker-compose.yaml through ${IMAGE}:${TAG} substitution.
#
# To update an image version: change the tag here, then redeploy the stack.
# Pinned images (non-latest) require manual version bumps — do not auto-update.
#
# To add a new container:
#   1. Add an entry below (image + tag), alphabetically by key
#   2. Add IMAGE/TAG env vars to the stack's env.j2:
#        MY_IMAGE={{ container_definitions.myapp.image }}
#        MY_TAG={{ container_definitions.myapp.tag }}
#   3. Update docker-compose.yaml image line: image: ${MY_IMAGE}:${MY_TAG}
#   4. If the service has a database, add an entry in vars/definitions/app_definitions.yaml
#
# Optional fields:
#   stack      — compose stack this container runs in (required if guacamole: is set)
#   guacamole  — Guacamole connection metadata (auto-derived by sync_guacamole_connections.yaml)
#     name           — display name in Guacamole UI
#     group          — connection group (Proxmox, Docker, Tools, etc.)
#     protocol       — ssh (default) or vnc
#     port           — VNC port on the host (e.g., 7914)
#     command        — SSH exec command (e.g., "sudo docker exec -it foo /bin/bash")
#     user_groups    — Authentik groups granted READ access (omit for admin-only)
#
# Compose generation fields (optional — stacks with these generate compose from definitions):
#   compose        — dict of compose-level service configuration
#     container_name — container name (defaults to service_name, which defaults to key with _ → -)
#     service_name   — compose service name (defaults to key with underscores converted to dashes)
#     image_var      — env var prefix for image/tag (defaults to KEY_UPPER; e.g., "CSUI" → ${CSUI_IMAGE})
#     base           — anchor pattern: base, baseenv, baseuid (controls mem/restart/env/uid injection)
#     networks       — list of networks (default: [homelab])
#     ports          — list of port mappings ("host:container" or "host:container/udp")
#     volumes        — list of volume mounts
#     environment    — dict of environment variables (values use ${VAR} for .env substitution)
#     labels         — dict of container labels
#     healthcheck    — dict with test, interval, timeout, retries, start_period
#     depends_on     — list of service dependencies
#     command        — override command
#     profiles       — list of compose profiles
#     privileged     — bool
#     cap_add        — list of capabilities
#     sysctls        — list of sysctl settings
#     network_mode   — override network mode (e.g., "host", "service:wireguard")
#     security_opt   — list of security options

container_definitions:
  adminer:
    image: "adminer"
    tag: "latest"
  authentik:
    image: "ghcr.io/goauthentik/server"
    tag: "2025.12.4"
  beszel:
    image: "henrygd/beszel"
    tag: "latest"
  beszel_agent:
    image: "henrygd/beszel-agent"
    tag: "latest"
  cloudflareddns:
    image: "ghcr.io/hotio/cloudflareddns"
    tag: "latest"
  code_server:
    image: "lscr.io/linuxserver/code-server"
    tag: "latest"
  crowdsec:
    image: "docker.io/crowdsecurity/crowdsec"
    tag: "latest"
    stack: auth
    guacamole:
      name: Crowdsec
      group: Tools
      command: "sudo docker exec -it crowdsec /bin/bash"
  crowdsec_web_ui:
    image: "ghcr.io/theduffman85/crowdsec-web-ui"
    tag: "latest"
    stack: monitoring
    compose:
      image_var: CSUI
      base: base
      ports: ["3001:3000"]
      labels:
        homelab.backup.paths: "/opt/crowdsec-web-ui"
      environment:
        CROWDSEC_URL: "${CSUI_CROWDSEC_URL}"
        CROWDSEC_USER: "${CSUI_CROWDSEC_USER}"
        CROWDSEC_PASSWORD: "${CSUI_CROWDSEC_PASSWORD}"
      volumes:
        - "${APPSDIR}/crowdsec-web-ui:/app/data"
      healthcheck:
        test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "15s"
  docs:
    image: "nginx"
    tag: "alpine"
  dozzle:
    image: "amir20/dozzle"
    tag: "latest"
  firefox:
    image: "jlesage/firefox"
    tag: "latest"
    stack: apps
    guacamole:
      name: Firefox
      group: Tools
      protocol: vnc
      port: 7914
      user_groups: [Guac-Firefox]
  grafana:
    image: "grafana/grafana"
    tag: "latest"
    stack: monitoring
    compose:
      base: base
      ports: ["3000:3000"]
      labels:
        homelab.backup.paths: "/opt/grafana"
        homelab.health_timeout: "150"
      environment:
        GF_SERVER_ROOT_URL: "${GRAFANA_SERVER_ROOT_URL}"
        GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_SECURITY_ADMIN_PASSWORD}"
        GF_AUTH_GENERIC_OAUTH_ENABLED: "${GRAFANA_OAUTH_ENABLED}"
        GF_AUTH_GENERIC_OAUTH_NAME: "${OAUTH_NAME}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${GRAFANA_OAUTH_CLIENT_ID}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_CLIENT_SECRET}"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "${GRAFANA_OAUTH_SCOPES}"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${OAUTH_AUTH_URL}"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "${OAUTH_TOKEN_URL}"
        GF_AUTH_GENERIC_OAUTH_API_URL: "${OAUTH_API_URL}"
        GF_AUTH_SIGNOUT_REDIRECT_URL: "${GRAFANA_SIGNOUT_REDIRECT_URL}"
        GF_AUTH_OAUTH_AUTO_LOGIN: "${GRAFANA_OAUTH_AUTO_LOGIN}"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "${GRAFANA_ROLE_ATTRIBUTE_PATH}"
        GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: "${GRAFANA_GROUPS_ATTRIBUTE_PATH}"
      volumes:
        - "${APPSDIR}/grafana:/var/lib/grafana"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  guacamole:
    image: "abesnier/guacamole"
    tag: "latest"
  homeassistant:
    image: "lscr.io/linuxserver/homeassistant"
    tag: "latest"
  homebox:
    image: "ghcr.io/sysadminsmedia/homebox"
    tag: "latest"
  homepage:
    image: "ghcr.io/gethomepage/homepage"
    tag: "latest"
  jellyseerr:
    image: "fallenbagel/jellyseerr"
    tag: "preview-OIDC"
    stack: media
    compose:
      base: base
      ports: ["5055:5055"]
      labels:
        homelab.backup.paths: "/opt/jellyseerr"
        homelab.restore.app: "jellyseerr"
        homelab.restore.db_config: "db_primary_postgres"
        homelab.restore.db_names: "jellyseerr"
        homelab.restore.health_url: "http://localhost:5055/"
      environment:
        DB_TYPE: "${JELLYSEERR_DB_TYPE}"
        DB_HOST: "${POSTGRES_HOST}"
        DB_PORT: "${POSTGRES_PORT}"
        DB_USER: "${POSTGRES_USER}"
        DB_PASS: "${POSTGRES_PASSWORD}"
        DB_NAME: "${JELLYSEERR_POSTGRES_DB}"
      volumes:
        - "${APPSDIR}/jellyseerr:/app/config"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  mariadb:
    image: "lscr.io/linuxserver/mariadb"
    tag: "latest"
  netbootxyz:
    image: "netbootxyz/netbootxyz"
    tag: "latest"
  nfs:
    image: "itsthenetwork/nfs-server-alpine"
    tag: "latest"
  npm:
    image: "docker.io/jc21/nginx-proxy-manager"
    tag: "latest"
  postgres:
    image: "postgres"
    tag: "16-alpine"
  restic:
    image: "restic/restic"
    tag: "latest"
    stack: backups
    compose:
      container_name: restic
      volumes:
        - "${BACKUP_SOURCE}:/data:ro"
        - "${CACHE_DIR}:/root/.cache/restic"
      environment:
        AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
        AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
        RESTIC_REPOSITORY: "${RESTIC_REPOSITORY}"
        RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  rickroll:
    image: "modem7/docker-rickroll"
    tag: "latest"
  socket_proxy:
    image: "lscr.io/linuxserver/socket-proxy"
    tag: "latest"
  swag:
    image: "lscr.io/linuxserver/swag"
    tag: "latest"
  tautulli:
    image: "lscr.io/linuxserver/tautulli"
    tag: "latest"
    stack: media
    compose:
      base: baseuid
      ports: ["8181:8181"]
      labels:
        homelab.backup.paths: "/opt/tautulli"
      volumes:
        - "${APPSDIR}/tautulli:/config"
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:8181/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  wireguard:
    image: "lscr.io/linuxserver/wireguard"
    tag: "latest"
  xbackbone:
    image: "lscr.io/linuxserver/xbackbone"
    tag: "latest"

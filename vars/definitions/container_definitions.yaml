---
# Container image definitions — single source of truth for all deployed images.
# Every service's image and tag is defined here, referenced via env.j2 templates,
# and consumed by docker-compose.yaml through ${IMAGE}:${TAG} substitution.
#
# To update an image version: change the tag here, then redeploy the stack.
# Pinned images (non-latest) require manual version bumps — do not auto-update.
#
# To add a new container:
#   1. Add an entry below (image + tag + stack + env + compose), alphabetically by key
#   2. If the stack has generate_env: true, add env: field with all non-secret config values
#      and vault refs (e.g., "{{ vault_docker_foo }}")
#   3. If the stack has generate_compose: true, add compose: block
#   4. If the service has a database, add an entry in vars/definitions/app_definitions.yaml
#   For stacks WITHOUT generate_env, manually add IMAGE/TAG to stacks/<name>/env.j2
#
# Optional fields:
#   stack      — compose stack this container runs in (required if guacamole: is set)
#   guacamole  — Guacamole connection metadata (auto-derived by sync_guacamole_connections.yaml)
#     name           — display name in Guacamole UI
#     group          — connection group (Proxmox, Docker, Tools, etc.)
#     protocol       — ssh (default) or vnc
#     port           — VNC port on the host (e.g., 7914)
#     command        — SSH exec command (e.g., "sudo docker exec -it foo /bin/bash")
#     user_groups    — Authentik groups granted READ access (omit for admin-only)
#
# Env generation fields (optional — stacks with generate_env: true auto-generate .env):
#   env            — dict of env var name → value (literals, {{ ansible_var }}, or {{ vault_* }})
#                    Values are resolved by Ansible at deploy time. The .env is flat per-stack,
#                    so vars are deduplicated (first definition wins).
#
# Compose generation fields (optional — stacks with these generate compose from definitions):
#   compose        — dict of compose-level service configuration
#     container_name — container name (defaults to service_name, which defaults to key with _ → -)
#     service_name   — compose service name (defaults to key with underscores converted to dashes)
#     image_var      — env var prefix for image/tag (defaults to KEY_UPPER; e.g., "CSUI" → ${CSUI_IMAGE})
#     base           — anchor pattern: base, baseenv, baseuid (controls mem/restart/env/uid injection)
#     networks       — list of networks (default: [homelab])
#     ports          — list of port mappings ("host:container" or "host:container/udp")
#     volumes        — list of volume mounts
#     environment    — dict of environment variables (values use ${VAR} for .env substitution)
#     labels         — dict of container labels
#     healthcheck    — dict with test, interval, timeout, retries, start_period
#     depends_on     — list of service dependencies
#     command        — override command
#     profiles       — list of compose profiles
#     privileged     — bool
#     cap_add        — list of capabilities
#     sysctls        — list of sysctl settings
#     network_mode   — override network mode (e.g., "host", "service:wireguard")
#     security_opt   — list of security options
#     shm_size       — shared memory size (e.g., "2g")
#     network_aliases — list of network aliases on the default network
#
# Proxy generation fields (optional — used by deploy_swag_configs.yaml):
#   proxy          — dict of complex proxy config (subdomain, locations, upstream_ip, etc.)
#                    Used for multi-location configs, custom headers, or IP overrides.
#                    See deploy_swag_configs.yaml for full schema.
#   Simple proxy configs use homelab.proxy.* labels in compose.labels instead:
#     homelab.proxy.subdomain  — primary subdomain (required for proxy generation)
#     homelab.proxy.port       — override upstream port (default: host port from compose.ports)
#     homelab.proxy.proto      — http or https (default: http)
#     homelab.proxy.auth       — include Authentik auth (default: true)
#     homelab.proxy.external   — allow external access on port 8081 (default: true)
#     homelab.proxy.websocket  — add WebSocket upgrade headers (default: false)
#     homelab.proxy.buffering  — off to disable proxy buffering
#     homelab.proxy.aliases    — comma-separated additional subdomains
#     homelab.proxy.error_pages — include custom error pages (default: false)
#     homelab.proxy.complex    — signals "use proxy: key for full config" (default: false)

container_definitions:
  adminer:
    image: "adminer"
    tag: "latest"
    stack: databases
    env:
      ADMINER_DESIGN: "{{ docker_adminer_design }}"
    compose:
      base: base
      ports: ["8087:8080"]
      labels:
        homelab.backup.paths: "/opt/adminer"
        homelab.proxy.subdomain: "sql"
        homelab.proxy.port: "8080"
        homelab.proxy.external: "false"
        homelab.proxy.websocket: "true"
        homelab.proxy.buffering: "off"
      environment:
        ADMINER_DESIGN: "${ADMINER_DESIGN}"
      volumes:
        - "${APPSDIR}/adminer/hydra.css:/var/www/html/designs/hydra/adminer.css"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "15s"
  authentik:
    image: "ghcr.io/goauthentik/server"
    tag: "2026.5.6"
    stack: auth
    proxy:
      subdomain: auth
      auth: false
      buffer_size:
        proxy_buffers: "8 16k"
        proxy_buffer_size: "32k"
      locations:
        - path: /
          port: 9000
          upstream_name: authentik
          includes: [proxy]
        - path: "~ (/authentik)?/api"
          port: 9000
          upstream_name: authentik
          includes: [proxy]
          auth: false
    env:
      AUTHENTIK_SECRET_KEY: "{{ vault_docker_authentik_secret_key }}"
      AUTHENTIK_POSTGRES_DB: "authentik"
      AUTHENTIK_ERROR_REPORTING_ENABLED: "true"
      AUTHENTIK_WORKER_CONCURRENCY: "2"
      AUTHENTIK_WORKERS: "2"
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "{{ vault_docker_trusted_proxy_cidrs }}"
      AUTHENTIK_EMAIL_FROM: "sso@{{ vault_domain_ext }}"
      AUTHENTIK_EMAIL_USE_TLS: "true"
      AUTHENTIK_EMAIL_TIMEOUT: "10"
      # Auto-creation of Authentik-managed outposts (unused here — outposts aren't used) is
      # the only reason authentik/authentik_worker needed docker.sock; disabling it lets us
      # drop the mount entirely.
      AUTHENTIK_OUTPOSTS__DISCOVER: "false"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: "{{ docker_postgres_user }}"
      POSTGRES_PASSWORD: "{{ vault_docker_postgres_password }}"
      EMAIL_HOST: "{{ docker_email_host }}"
      EMAIL_PORT: "{{ docker_email_port }}"
      EMAIL_USERNAME: "{{ vault_docker_email_username }}"
      EMAIL_PASSWORD: "{{ vault_docker_email_password }}"
      EMAIL: "{{ vault_docker_email }}"
    compose:
      base: base
      ports: ["9001:9000", "9443:9443"]
      # Ship logs to CrowdSec via the docker syslog driver (rfc5424, tag=authentik) so
      # crowdsecurity/syslog-logs sets program=authentik and the STOCK firix parser +
      # firix/authentik-bf scenario fire (docker acquisition can't set program). UDP →
      # non-blocking: a crowdsec outage can't block authentik. Docker dual-logging keeps a
      # local cache, so `docker logs authentik` / Dozzle still work despite the syslog driver.
      logging:
        driver: syslog
        options:
          syslog-address: "udp://127.0.0.1:514"
          tag: "authentik"
          syslog-format: "rfc5424"
      labels:
        homelab.backup.paths: "/opt/authentik_worker"
        homelab.health_timeout: "420"
        homelab.restore.app: "authentik"
        homelab.restore.db_config: "db_primary_postgres"
        homelab.restore.db_names: "authentik"
        homelab.restore.health_url: "http://localhost:9001/-/health/ready/"
        homelab.restore.health_status: "204"
      environment:
        AUTHENTIK_POSTGRESQL__HOST: "${POSTGRES_HOST}"
        AUTHENTIK_POSTGRESQL__USER: "${POSTGRES_USER}"
        AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
        # Legacy alias authentik's config loader probes on boot; without it authentik logs a
        # benign "POSTGRES_PASSWORD ... not found, using fallback" warning. Same vault value.
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        AUTHENTIK_ERROR_REPORTING__ENABLED: "${AUTHENTIK_ERROR_REPORTING_ENABLED}"
        AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
        AUTHENTIK_EMAIL__HOST: "${EMAIL_HOST}"
        AUTHENTIK_EMAIL__PORT: "${EMAIL_PORT}"
        AUTHENTIK_EMAIL__USERNAME: "${EMAIL_USERNAME}"
        AUTHENTIK_EMAIL__PASSWORD: "${EMAIL_PASSWORD}"
        AUTHENTIK_EMAIL__FROM: "${AUTHENTIK_EMAIL_FROM}"
        AUTHENTIK_EMAIL__USE_TLS: "${AUTHENTIK_EMAIL_USE_TLS}"
        AUTHENTIK_EMAIL__TIMEOUT: "${AUTHENTIK_EMAIL_TIMEOUT}"
        AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "${AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS}"
        AUTHENTIK_WORKERS: "${AUTHENTIK_WORKERS}"
        AUTHENTIK_OUTPOSTS__DISCOVER: "${AUTHENTIK_OUTPOSTS__DISCOVER}"
      volumes:
        - "${APPSDIR}/authentik_worker/data:/data"
        - "${APPSDIR}/authentik_worker/templates:/templates"
      command: server
      healthcheck:
        test: ["CMD", "ak", "healthcheck"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  authentik_worker:
    # No image/tag here on purpose: compose.image_var (AUTHENTIK) below makes this service
    # render ${AUTHENTIK_IMAGE}:${AUTHENTIK_TAG}, so it always tracks the authentik (server)
    # tag from a single IaC source. Re-adding a tag here would be dead config (env.j2 dedups
    # the shared prefix to the server's value) and risks version drift — don't.
    stack: auth
    compose:
      image_var: AUTHENTIK
      service_name: authentik_worker
      container_name: authentik_worker
      base: base
      environment:
        AUTHENTIK_POSTGRESQL__HOST: "${POSTGRES_HOST}"
        AUTHENTIK_POSTGRESQL__USER: "${POSTGRES_USER}"
        AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
        # Legacy alias authentik's config loader probes on boot; without it authentik logs a
        # benign "POSTGRES_PASSWORD ... not found, using fallback" warning. Same vault value.
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        AUTHENTIK_ERROR_REPORTING__ENABLED: "${AUTHENTIK_ERROR_REPORTING_ENABLED}"
        AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
        AUTHENTIK_WORKER_CONCURRENCY: "${AUTHENTIK_WORKER_CONCURRENCY}"
        AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "${AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS}"
        AUTHENTIK_OUTPOSTS__DISCOVER: "${AUTHENTIK_OUTPOSTS__DISCOVER}"
      volumes:
        - "${APPSDIR}/authentik_worker/backups:/backups"
        - "${APPSDIR}/authentik_worker/data:/data"
        - "${APPSDIR}/authentik_worker/certs:/certs"
        - "${APPSDIR}/authentik_worker/templates:/templates"
      command: worker
      healthcheck:
        test: ["CMD", "ak", "healthcheck"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  autoheal:
    image: "willfarrell/autoheal"
    tag: "latest"
    stack: infra
    compose:
      base: base
      environment:
        # all = watch every container with a healthcheck (homelab-wide safety net).
        # Docker restart:always only fires on process exit; autoheal covers the
        # up-but-unhealthy case (e.g. z2m hanging after a TCP-coordinator drop).
        AUTOHEAL_CONTAINER_LABEL: "all"
        AUTOHEAL_INTERVAL: "5"
        AUTOHEAL_START_PERIOD: "0"
        # z2m shutdown can hang, so give SIGTERM room before SIGKILL.
        AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
        DOCKER_SOCK: "/var/run/docker.sock"
      volumes:
        # RW: autoheal POSTs container restarts through the socket.
        - "/var/run/docker.sock:/var/run/docker.sock"
  beszel:
    image: "henrygd/beszel"
    tag: "latest"
    stack: vpn
    proxy:
      subdomain: monitor
      upstream_ip: "10.253.100.1"
      locations:
        - path: /
          port: 8090
          auth: true
          includes: []
    compose:
      base: baseenv
      network_mode: "service:wireguard"
      depends_on: ["wireguard"]
      labels:
        homelab.backup.paths: "/opt/beszel"
        homelab.health_timeout: "90"
        homelab.proxy.subdomain: "monitor"
        homelab.proxy.complex: "true"
      volumes:
        - "${APPSDIR}/beszel:/beszel_data"
        - "${APPSDIR}/beszel_socket:/beszel_socket"
      healthcheck:
        test: ["CMD", "/beszel", "health"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  beszel_agent:
    image: "henrygd/beszel-agent"
    tag: "latest"
    stack: infra
    env:
      BESZEL_LISTEN: "45876"
      BESZEL_KEY: "{{ vault_docker_beszel_key }}"
    compose:
      base: base
      network_mode: host
      labels:
        homelab.backup.paths: "/opt/beszel_socket"
        homelab.test.skip_health: "true"
      environment:
        LISTEN: "${BESZEL_LISTEN}"
        KEY: "${BESZEL_KEY}"
      volumes:
        - "${APPSDIR}/beszel_socket:/beszel_socket"
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
  birdnet_go:
    image: "ghcr.io/tphakala/birdnet-go"
    tag: "nightly"
    stack: apps
    compose:
      image_var: BIRDNET
      base: base
      ports: ["8090:8080"]
      labels:
        homelab.backup.paths: "/opt/birdnet_go"
        homelab.proxy.subdomain: "birdnet"
      environment:
        BIRDNET_UID: "${PUID}"
        BIRDNET_GID: "${PGID}"
      volumes:
        - "${APPSDIR}/birdnet_go/config:/config"
        - "${APPSDIR}/birdnet_go/data:/data"
      tmpfs:
        - "/config/hls:exec,size=50M,uid=${PUID},gid=${PGID},mode=0755"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  cloudflareddns:
    image: "ghcr.io/hotio/cloudflareddns"
    tag: "latest"
    stack: apps
    env:
      DDNS_INTERVAL: "300"
      DDNS_DETECTION_MODE: "dig-whoami.cloudflare"
      DDNS_LOG_LEVEL: "1"
      DDNS_CF_APIKEY: "{{ vault_docker_cloudflare_api_key }}"
      DDNS_CF_HOSTS: "vpn.{{ vault_domain_ext }}"
      DDNS_CF_ZONES: "{{ vault_domain_ext }}"
      DDNS_CF_RECORDTYPES: "'A;A'"
      # No IPv6 on this network — disable IPv6 detection so it stops erroring every cycle
      # ("Detected IPv6 is not valid!"). Only A records are updated anyway.
      DDNS_UPDATE_IPV6: "false"
      EMAIL: "{{ vault_docker_email }}"
    compose:
      image_var: DDNS
      base: base
      labels:
        homelab.backup.paths: "/opt/cloudflareddns"
      environment:
        INTERVAL: "${DDNS_INTERVAL}"
        DETECTION_MODE: "${DDNS_DETECTION_MODE}"
        LOG_LEVEL: "${DDNS_LOG_LEVEL}"
        CF_USER: "${EMAIL}"
        CF_APIKEY: "${DDNS_CF_APIKEY}"
        CF_HOSTS: "${DDNS_CF_HOSTS}"
        CF_ZONES: "${DDNS_CF_ZONES}"
        CF_RECORDTYPES: "${DDNS_CF_RECORDTYPES}"
        UPDATE_IPV6: "${DDNS_UPDATE_IPV6}"
      volumes:
        - "${APPSDIR}/cloudflareddns:/config"
  code_server:
    image: "lscr.io/linuxserver/code-server"
    tag: "latest"
    stack: dev
    env:
      CODESERVER_PROXY_DOMAIN: "code.{{ vault_domain_ext }}"
      CODESERVER_DEFAULT_WORKSPACE: "/config/workspace.code-workspace"
    compose:
      image_var: CODESERVER
      base: baseuid
      ports: ["8443:8443", "3001:3001"]
      labels:
        homelab.backup.paths: "/opt/code-server,/opt/homelab-ops,/opt/homelab-docs,/opt/freshjams-ops,/opt/personalfinance,/opt/gaggiuino-barista,/opt/docker-guacamole,/opt/unraid-diagnostics-analyzer"
        homelab.health_timeout: "90"
        homelab.proxy.subdomain: "code"
        homelab.proxy.websocket: "true"
      environment:
        PROXY_DOMAIN: "${CODESERVER_PROXY_DOMAIN}"
        DEFAULT_WORKSPACE: "${CODESERVER_DEFAULT_WORKSPACE}"
      volumes:
        - "core:/workspace/core"
        - "apps:/workspace/apps"
        - "dev:/workspace/dev"
        - "vps:/workspace/vps"
        - "/opt/CLAUDE.md:/workspace/CLAUDE.md:ro"
        - "${APPSDIR}/code-server:/config"
        - "./custom-cont-init.d:/custom-cont-init.d:ro"
      healthcheck:
        test: ["CMD-SHELL", "ls /workspace/core /workspace/apps /workspace/dev /workspace/vps /workspace/dev/homelab-ops /workspace/dev/homelab-docs /workspace/dev/freshjams-ops > /dev/null 2>&1 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "30s"
  crowdsec:
    image: "docker.io/crowdsecurity/crowdsec"
    tag: "latest"
    stack: auth
    env:
      CROWDSEC_COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/whitelist-good-actors firix/authentik crowdsecurity/wordpress crowdsecurity/sshd"
      CROWDSEC_CUSTOM_HOSTNAME: "crowdsec"
      CROWDSEC_LAPI_URL: "http://crowdsec:8080"
    guacamole:
      name: Crowdsec
      group: Tools
      command: "sudo docker exec -it crowdsec /bin/bash"
    compose:
      base: base
      ports: ["8080:8080", "6060:6060", "514:514/udp"]
      labels:
        homelab.backup.paths: "/opt/crowdsec"
        homelab.restore.app: "crowdsec"
        homelab.restore.db_config: "db_primary_postgres"
        homelab.restore.db_names: "crowdsec"
      environment:
        COLLECTIONS: "${CROWDSEC_COLLECTIONS}"
        CUSTOM_HOSTNAME: "${CROWDSEC_CUSTOM_HOSTNAME}"
      volumes:
        - "${APPSDIR}/crowdsec/config:/etc/crowdsec"
        - "${APPSDIR}/crowdsec/data:/var/lib/crowdsec/data"
        # SWAG nginx logs, read-only — CrowdSec file-acquires /var/log/swag/crowdsec.log
        # (dedicated combined-format log) instead of reading SWAG's stdout over the socket.
        - "${APPSDIR}/swag/log/nginx:/var/log/swag:ro"
        # docker.sock removed: SWAG uses file acquisition and Authentik uses syslog, so
        # nothing needs docker acquisition. Least-privilege — CrowdSec no longer has the
        # docker socket (and this also eliminates the docker-events "fatal on failure"
        # crashloop class entirely).
      security_opt:
        - "no-new-privileges=true"
      healthcheck:
        test: ["CMD", "cscli", "version"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "60s"
  crowdsec_web_ui:
    image: "ghcr.io/theduffman85/crowdsec-web-ui"
    tag: "latest"
    stack: monitoring
    env:
      # CONFIG_INSTANCE_* is the current (non-deprecated) scheme — the legacy
      # CROWDSEC_URL/USER/PASSWORD vars this used to use only apply during the
      # app's one-time first-boot config.yaml migration (long since done here)
      # and were logged every start as "deprecated ... can be removed".
      CSUI_LAPI_URL: "http://{{ vault_vm_core_ip }}:8080"
      CSUI_LAPI_USER: "{{ vault_docker_crowdsec_web_ui_user }}"
      CSUI_LAPI_PASSWORD: "{{ vault_docker_crowdsec_web_ui_password }}"
      # CrowdSec's prometheus metrics endpoint (already enabled at level:full on 6060 —
      # see crowdsec container's ports).
      CSUI_METRICS_URL: "http://{{ vault_vm_core_ip }}:6060/metrics"
    compose:
      image_var: CSUI
      base: base
      ports: ["3001:3000"]
      labels:
        homelab.backup.paths: "/opt/crowdsec-web-ui"
        homelab.proxy.subdomain: "security"
      environment:
        CONFIG_INSTANCE_LAPI_URL: "${CSUI_LAPI_URL}"
        CONFIG_INSTANCE_LAPI_AUTH_USERNAME: "${CSUI_LAPI_USER}"
        CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: "${CSUI_LAPI_PASSWORD}"
        CONFIG_INSTANCE_METRICS_URL: "${CSUI_METRICS_URL}"
      volumes:
        - "${APPSDIR}/crowdsec-web-ui:/app/data"
      healthcheck:
        test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "15s"
  docs:
    image: "nginx"
    tag: "alpine"
    stack: dev
    compose:
      base: base
      ports: ["8084:80"]
      labels:
        homelab.backup.paths: "/opt/homelab-docs"
        homelab.test.skip_health: "true"
        homelab.proxy.subdomain: "docs"
        homelab.proxy.error_pages: "true"
      volumes:
        - "${APPSDIR}/homelab-docs/site:/usr/share/nginx/html:ro"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsk http://localhost:80 || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "10s"
  dozzle:
    image: "amir20/dozzle"
    tag: "latest"
    stack: infra
    proxy:
      subdomain: logs
      # infra stack is on both core and apps — hub runs only on apps (profile: hub)
      # so we must explicitly set upstream_role to avoid picking core (where SWAG lives)
      upstream_role: apps
      locations:
        - path: /
          port: 8081
          auth: true
          websocket: true
          buffering: "off"
          directives:
            - "proxy_cache off"
            - "chunked_transfer_encoding off"
    compose:
      base: base
      ports: ["8081:8080"]
      environment:
        DOZZLE_LEVEL: "${DOZZLE_LEVEL}"
        DOZZLE_REMOTE_AGENT: "${DOZZLE_REMOTE_AGENT}"
        DOZZLE_HOSTNAME: "${DOZZLE_HOSTNAME}"
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      profiles: ["hub"]
      healthcheck:
        test: ["CMD", "/dozzle", "healthcheck"]
        interval: "30s"
        timeout: "10s"
        retries: 3
        start_period: "15s"
  dozzle_agent:
    image: "amir20/dozzle"
    tag: "latest"
    stack: infra
    compose:
      image_var: DOZZLE
      base: baseenv
      ports: ["7007:7007"]
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock:ro"
      command: agent
      profiles: ["agent"]
      healthcheck:
        test: ["NONE"]
  firefox:
    image: "jlesage/firefox"
    tag: "latest"
    stack: apps
    env:
      FF_DISPLAY_WIDTH: "{{ docker_firefox_display_width }}"
      FF_DISPLAY_HEIGHT: "{{ docker_firefox_display_height }}"
      FF_SECURE_CONNECTION: "{{ docker_firefox_secure_connection }}"
      FF_DARK_MODE: "{{ docker_firefox_dark_mode }}"
      FF_WEB_AUDIO: "{{ docker_firefox_web_audio }}"
    guacamole:
      name: Firefox
      group: Tools
      protocol: vnc
      port: 7914
      user_groups: [Guac-Firefox]
    compose:
      base: base
      ports: ["7814:5800", "7914:5900"]
      labels:
        homelab.backup.paths: "/opt/firefox"
      environment:
        DISPLAY_WIDTH: "${FF_DISPLAY_WIDTH}"
        DISPLAY_HEIGHT: "${FF_DISPLAY_HEIGHT}"
        SECURE_CONNECTION: "${FF_SECURE_CONNECTION}"
        DARK_MODE: "${FF_DARK_MODE}"

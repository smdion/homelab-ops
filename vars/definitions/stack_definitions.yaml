---
# Stack definitions — single source of truth for all Docker Compose stacks.
# Each key is a stack name (matches directory under stacks/) and maps to a
# description used in documentation and the auto-generated Stack Definitions page.
#
# To add a new stack:
#   1. Add an entry below (alphabetically by key)
#   2. Create stacks/<name>/ with docker-compose.yaml and env.j2
#      (or set generate_compose/generate_env: true and define in container_definitions.yaml)
#   3. Add the stack name to the host's `stacks:` list in vm_definitions.yaml
#      or host_definitions.yaml
#
# Optional fields:
#   generate_compose  — generate docker-compose.yaml from container_definitions (default: false)
#   generate_env      — generate .env from container_definitions env: fields (default: false)
#   globals           — list of global env vars to emit (default: all 7)
#                       choices: mem_limit, restart, tz, puid, pgid, umask, appsdir
#   env_extra         — raw Jinja2 block appended to generated .env (for dynamic per-host logic)
#   network           — external network name (default: homelab; omit for stacks without networks)
#   compose_volumes   — list of named volumes to declare at top level (e.g., NFS mounts)

stack_definitions:
  apps:
    description: "Application services — Home Assistant, Guacamole, Homepage, etc."
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, puid, pgid, umask, appsdir]
  auth:
    description: "Authentication and reverse proxy — Authentik, SWAG, CrowdSec"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, puid, pgid, umask, appsdir]
  databases:
    description: "Database services — MariaDB, PostgreSQL, Adminer"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, puid, pgid, umask, appsdir]
  dev:
    description: "Development tools — code-server, netbootxyz"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, puid, pgid, umask, appsdir]
    compose_volumes:
      - core
      - apps
      - dev
      - vps
  infra:
    description: "Core infrastructure — Docker proxy, monitoring agents, log aggregation"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, appsdir]
    # Static mirror of the COMPOSE_PROFILES branch below, keyed by host_roles value.
    # Consumed by scripts/validate_port_conflicts.py to know which profile is active
    # per role — keep in sync if the env_extra Jinja logic changes.
    role_profiles:
      apps: [hub]
      core: [agent]
      dev: [agent]
    env_extra: |-
      ## Dozzle — profiles select agent vs hub per host role
      ## Hub/agent role per host comes from its `dozzle:` block in vm_definitions/host_definitions.
      ## DOZZLE_REMOTE_AGENT is generated from those blocks (VIPs for VM roles — stable across reprovisions).
      DOZZLE_LEVEL=
      DOZZLE_REMOTE_AGENT=
      DOZZLE_HOSTNAME=
      {% set _role = host_roles.get(inventory_hostname, '') -%}
      {% set _dz = ((all_definitions.get(_role, {})).dozzle | default({})) -%}
      {% if _dz.role | default('') == 'hub' -%}
      COMPOSE_PROFILES=hub
      DOZZLE_LEVEL={{ docker_dozzle_level }}
      {% if _role_injected | default(false) -%}
      {% set _subnet = ansible_facts.default_ipv4.address.rsplit('.', 1)[0] -%}
      DOZZLE_REMOTE_AGENT={{ _subnet }}.{{ docker_test_vip_offsets['core'] }}:7007,{{ _subnet }}.{{ docker_test_vip_offsets['dev'] }}:7007
      {% else -%}
      {# The agent list is generated from the `dozzle:` blocks in vm_definitions / host_definitions
         (dozzle_remote_agent_env in vm_definitions.yaml): VM roles use their keepalived VIP (stable
         across reprovisions), unRAID hosts their LAN IP, and vps the WG server IP 10.253.100.1 (its
         agent is vpn_dozzle_agent inside the wireguard netns, reached via the UDM WG client). #}
      DOZZLE_REMOTE_AGENT={{ dozzle_remote_agent_env }}
      {% endif -%}
      DOZZLE_HOSTNAME={{ _dz.name | default(_role | title) }}
      {% elif _dz.role | default('agent') == 'none' -%}
      COMPOSE_PROFILES=
      {% else -%}
      COMPOSE_PROFILES=agent
      {% endif -%}
  media:
    description: "Media services — Tautulli, Seerr"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, puid, pgid, umask, appsdir]
  monitoring:
    description: "Monitoring — Grafana, CrowdSec Web UI"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, appsdir]
  vpn:
    description: "VPN and NPM — WireGuard, Nginx Proxy Manager"
    generate_compose: true
    generate_env: true
    globals: [mem_limit, restart, tz, puid, pgid, umask, appsdir]
    network: false

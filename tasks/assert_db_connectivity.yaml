---
# Pre-task assertion: verify MariaDB logging database is reachable.
# No vars needed — inherits logging_db_* from playbook scope (vars/secrets.yaml).

- name: Verify MariaDB logging database connectivity
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  connection: local
  ansible.mysql.mysql_query:
    login_host: "{{ vault_logging_db_host }}"
    login_port: "{{ vault_logging_db_port }}"
    login_user: "{{ vault_logging_db_user }}"
    login_password: "{{ vault_logging_db_password }}"
    login_db: "{{ vault_logging_db_name }}"
    query: "SELECT 1"
  register: _db_connectivity
  failed_when: false  # pre-flight probe — optional state check; downstream handles missing case
  changed_when: false
  check_mode: false
  no_log: "{{ _no_log | default(true) }}"

- name: Assert MariaDB logging database is reachable
  ansible.builtin.assert:
    that: not _db_connectivity.failed
    fail_msg: >-
      Cannot reach MariaDB logging database at {{ vault_logging_db_host }}:{{ vault_logging_db_port }} —
      verify the database is running, credentials are correct, and PyMySQL is installed.
      Pass -e skip_db=yes to bypass during outages.
  when: not (skip_db | default(false) | bool)

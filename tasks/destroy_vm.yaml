---
# Destroy a VM on Proxmox: stop → pause → delete.
# Reusable task — called from build_ubuntu, bootstrap_amp, verify_isolation,
# cleanup_test_vms, and any future playbook that needs to remove a VM.
#
# Expects (set as vars by caller):
#   _destroy_vmid  — VMID to destroy
#   _destroy_node  — PVE node where VM resides
#   _destroy_name  — VM name for task labels (optional, default: 'VM')
#
# Requires in scope:
#   _pve — dict from resolve_pve_api.yaml (api_host, api_user, api_token_id, api_token_secret, template_node)

- name: Stop {{ _destroy_name | default('VM') }} (VMID {{ _destroy_vmid }})
  community.general.proxmox_kvm:
    api_host: "{{ _pve.api_host }}"
    api_user: "{{ _pve.api_user }}"
    api_token_id: "{{ _pve.api_token_id }}"
    api_token_secret: "{{ _pve.api_token_secret }}"
    node: "{{ _destroy_node }}"
    vmid: "{{ _destroy_vmid }}"
    state: stopped
    force: true
  ignore_errors: true
  no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"

- name: Wait for VM to stop
  ansible.builtin.pause:
    seconds: 5

- name: Remove {{ _destroy_name | default('VM') }} (VMID {{ _destroy_vmid }})
  community.general.proxmox_kvm:
    api_host: "{{ _pve.api_host }}"
    api_user: "{{ _pve.api_user }}"
    api_token_id: "{{ _pve.api_token_id }}"
    api_token_secret: "{{ _pve.api_token_secret }}"
    node: "{{ _destroy_node }}"
    vmid: "{{ _destroy_vmid }}"
    state: absent
  no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"

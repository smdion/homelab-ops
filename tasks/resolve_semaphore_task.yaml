---
# Resolve the current Semaphore task URL for inclusion in Discord notifications.
# Sets _semaphore_task_url fact. Silently skipped if API unavailable or vars missing.
#
# Requires (from vars/semaphore_check.yaml + vars/secrets.yaml):
#   semaphore_url, semaphore_api_token, semaphore_ext_url, semaphore_project_id

- name: Query Semaphore API for current task
  become: false
  connection: local
  ansible.builtin.uri:
    url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/tasks/last?count=1"
    method: GET
    headers:
      Authorization: "Bearer {{ semaphore_api_token }}"
      Accept: "application/json"
    return_content: true
    status_code: 200
  register: _semaphore_task_response
  failed_when: false
  when:
    - semaphore_url is defined
    - semaphore_api_token is defined
    - semaphore_ext_url is defined
    - _semaphore_task_url is not defined
    - not ansible_check_mode
  no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"

- name: Set Semaphore task URL fact
  ansible.builtin.set_fact:
    _semaphore_task_url: "{{ semaphore_ext_url }}/project/{{ semaphore_project_id }}/history/{{ (_semaphore_task_response.content | from_json)[0].id }}"
  when:
    - _semaphore_task_response is defined
    - _semaphore_task_response is succeeded
    - (_semaphore_task_response.content | default('[]') | from_json) | length > 0
  failed_when: false

---
# Delete old successful Semaphore task runs for the currently running template.
# Uses direct SQL against the Semaphore DB for atomic, reliable cleanup.
# Prevents task-ID inflation from frequently scheduled playbooks.
#
# Optional variables:
#   clean_keep: number of recent successful runs to retain (default: 1)
#
# Requires (from vars/secrets.yaml):
#   logging_db_host, logging_db_port, logging_db_user, logging_db_password

- name: Resolve current template ID from Semaphore DB
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  delegate_to: localhost
  connection: local
  community.mysql.mysql_query:
    login_host: "{{ logging_db_host }}"
    login_port: "{{ logging_db_port }}"
    login_user: "{{ logging_db_user }}"
    login_password: "{{ logging_db_password }}"
    login_db: "{{ semaphore_db_name | default('semaphore') }}"
    query: "SELECT template_id FROM task ORDER BY id DESC LIMIT 1"
  register: _clean_tpl_result
  failed_when: false
  no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"
  when:
    - not ansible_check_mode
    - logging_db_host is defined
    - logging_db_password is defined

- name: Delete old successful task runs from Semaphore DB
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _tpl_id: "{{ _clean_tpl_result.query_result[0][0].template_id }}"
    _keep: "{{ clean_keep | default(1) | int }}"
  become: false
  delegate_to: localhost
  connection: local
  community.mysql.mysql_query:
    login_host: "{{ logging_db_host }}"
    login_port: "{{ logging_db_port }}"
    login_user: "{{ logging_db_user }}"
    login_password: "{{ logging_db_password }}"
    login_db: "{{ semaphore_db_name | default('semaphore') }}"
    query: >-
      DELETE FROM task
      WHERE template_id = %s
      AND status = 'success'
      AND id NOT IN (
        SELECT id FROM (
          SELECT id FROM task
          WHERE template_id = %s AND status = 'success'
          ORDER BY id DESC
          LIMIT %s
        ) AS keep
      )
    positional_args:
      - "{{ _tpl_id }}"
      - "{{ _tpl_id }}"
      - "{{ _keep }}"
  register: _clean_delete_result
  failed_when: false
  no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"
  when:
    - not ansible_check_mode
    - _clean_tpl_result is defined
    - _clean_tpl_result is succeeded
    - _clean_tpl_result.query_result | default([]) | flatten | length > 0

- name: "Clean Semaphore history: {{ _clean_delete_result.rowcount[0] | default(0) }} old successful run(s) deleted"
  ansible.builtin.debug:
    msg: "Deleted {{ _clean_delete_result.rowcount[0] | default(0) }} old successful task run(s) for template {{ _clean_tpl_result.query_result[0][0].template_id | default('unknown') }}"
  when:
    - _clean_delete_result is defined
    - _clean_delete_result is succeeded

---
# Monitoring lifecycle hook — the last step of every build, deploy, retire and restore playbook.
# Keeps BOTH monitoring systems in step with the definitions as part of the same run:
#   * Beszel  — registers/renames systems and their alerts; retire playbooks also prune (tasks/beszel_sync.yaml)
#   * Dozzle  — makes the log-viewer hub list exactly the Docker hosts that declare `dozzle: {role: agent}`
#               (tasks/dozzle_sync.yaml; edits the hub's own agent list and recreates only that container)
#
# BEST EFFORT, LOUDLY: each sync is independent (one failing never skips the other) and a monitoring failure never
# fails the playbook that included it — but it always reaches Discord so the drift is not silent. Skipped in
# dry-run / check mode.
#
# Included from a final `hosts: localhost` play (see the "Monitoring" play at the end of each playbook). That play
# must load: vars/secrets.yaml, vm_definitions, host_definitions, vip_definitions, vars/configs/beszel.yaml.
#
# Inputs:
#   beszel_hook_prune  true for retire playbooks: also delete Beszel systems that match no definition (never one the
#                      hub still reports "up" — an orphan that was only just retired is cleaned by the next run)
# Note: a run limited with --limit that excludes localhost skips this hook; maintain_health (CHECK 32 / 33) is the
# safety net for that case.

- name: Sync Beszel monitoring (best effort)
  when:
    - not (dry_run | default(false) | bool)
    - not ansible_check_mode
  block:
    - name: Reconcile Beszel with the definitions
      ansible.builtin.include_tasks: beszel_sync.yaml
      vars:
        beszel_apply: true
        beszel_prune: "{{ beszel_hook_prune | default(false) | bool }}"
  rescue:
    - name: Warn on Discord that the Beszel sync did not complete
      ansible.builtin.include_tasks: notify.yaml
      vars:
        discord_name: "Monitoring"
        discord_operation: "Beszel sync"
        discord_status: "partial"
        discord_detail: >-
          Sync did not complete after {{ playbook_name | default('a playbook') }}:
          {{ ansible_failed_result.msg | default('see the task log') }}
        discord_color: "{{ discord_color_warning }}"
        discord_url: "{{ semaphore_ext_url | default('') }}"
        discord_author: "{{ controller_fqdn | default('controller') }}"
      when: _is_semaphore | default(false)
    - name: Note the Beszel failure in the log (the playbook itself continues)
      ansible.builtin.debug:
        msg: "Beszel sync failed — monitoring may be out of date: {{ ansible_failed_result.msg | default('unknown') }}"

- name: Sync Dozzle log-viewer hub (best effort)
  when:
    - not (dry_run | default(false) | bool)
    - not ansible_check_mode
  block:
    - name: Reconcile the Dozzle hub's agent list with the definitions
      ansible.builtin.include_tasks: dozzle_sync.yaml
      vars:
        dozzle_apply: true
  rescue:
    - name: Warn on Discord that the Dozzle sync did not complete
      ansible.builtin.include_tasks: notify.yaml
      vars:
        discord_name: "Monitoring"
        discord_operation: "Dozzle sync"
        discord_status: "partial"
        discord_detail: >-
          Sync did not complete after {{ playbook_name | default('a playbook') }}:
          {{ ansible_failed_result.msg | default('see the task log') }}
        discord_color: "{{ discord_color_warning }}"
        discord_url: "{{ semaphore_ext_url | default('') }}"
        discord_author: "{{ controller_fqdn | default('controller') }}"
      when: _is_semaphore | default(false)
    - name: Note the Dozzle failure in the log (the playbook itself continues)
      ansible.builtin.debug:
        msg: "Dozzle sync failed — the log viewer may be out of date: {{ ansible_failed_result.msg | default('unknown') }}"

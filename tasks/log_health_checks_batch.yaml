---
# Batch health check logging — inserts all results in a single multi-row INSERT.
# Replaces individual per-row include_tasks loops for efficiency (~150 INSERTs → 1).
#
# Required var:
#   _all_results — list of dicts, each with keys:
#     hostname, check_name, status, value, detail
#
# Inherited from playbook scope (no need to pass):
#   vault_logging_db_host, vault_logging_db_port, vault_logging_db_user,
#   vault_logging_db_password, vault_logging_db_name

- name: Batch log health checks to MariaDB
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  connection: local
  ansible.mysql.mysql_query:
    login_host: "{{ vault_logging_db_host }}"
    login_port: "{{ vault_logging_db_port }}"
    login_user: "{{ vault_logging_db_user }}"
    login_password: "{{ vault_logging_db_password }}"
    login_db: "{{ vault_logging_db_name }}"
    query: >-
      INSERT INTO health_checks
      (hostname, check_name, check_status, check_value, check_detail, timestamp)
      VALUES {% for _ in _all_results %}(%s, %s, %s, %s, %s, UTC_TIMESTAMP()){% if not loop.last %}, {% endif %}{% endfor %}
      ON DUPLICATE KEY UPDATE
        check_status = VALUES(check_status), check_value = VALUES(check_value),
        check_detail = VALUES(check_detail), timestamp = UTC_TIMESTAMP()
    positional_args: >-
      {{ _all_results | map(attribute='hostname')
         | zip(
             _all_results | map(attribute='check_name'),
             _all_results | map(attribute='status'),
             _all_results | map(attribute='value'),
             _all_results | map(attribute='detail'))
         | map('list') | sum(start=[]) }}
  register: _log_health_batch_result
  retries: 3
  delay: 5
  until: _log_health_batch_result is succeeded
  when: not (skip_db | default(false) | bool) and not ansible_check_mode
  no_log: "{{ _no_log }}"

---
# Harden SSH and configure passwordless sudo for a given user.
# Shared by build_ubuntu.yaml (bootstrap) and setup_ansible_user.yaml.
#
# Expects:
#   _ssh_user           — user to grant passwordless sudo
# Optional:
#   _ssh_service_name   — SSH service name (default: 'ssh' for Ubuntu Noble;
#                         pass 'sshd' for PVE/PBS/Debian)
#
# Also forwards this host's SSH auth log to CrowdSec's existing syslog listener
# (same UDP:514 listener Authentik already uses, see crowdsec_definitions.yaml)
# so the crowdsecurity/sshd collection — already loaded, previously fed nothing —
# has something to actually detect. Requires vault_vm_core_ip.

- name: "Grant passwordless sudo to {{ _ssh_user }}"
  ansible.builtin.copy:
    content: |
      # Passwordless sudo for Ansible automation — required for playbooks to
      # execute privileged tasks (apt, docker, systemctl, etc.) without prompts.
      {{ _ssh_user }} ALL=(ALL) NOPASSWD: ALL
    dest: "/etc/sudoers.d/{{ _ssh_user }}"
    mode: "0440"
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

- name: Harden SSH configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    # Required for Apache Guacamole — guacd uses libssh2 which only supports
    # ssh-rsa host key algorithm (GUACAMOLE-1497). Applied to all managed hosts
    # since Guacamole connects to all of them. Remove when guacd adds rsa-sha2 support.
    - { regexp: '^#?PubkeyAcceptedAlgorithms', line: 'PubkeyAcceptedAlgorithms +ssh-rsa' }
  register: _ssh_config

- name: "Restart {{ _ssh_service_name | default('ssh') }}"
  ansible.builtin.systemd:
    name: "{{ _ssh_service_name | default('ssh') }}"
    state: restarted
  when: _ssh_config is changed

- name: Ensure rsyslog is installed
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Forward SSH auth log to CrowdSec's syslog listener
  ansible.builtin.copy:
    content: |
      # Forwards auth/authpriv (sshd) messages to CrowdSec's syslog acquisition
      # listener, same UDP:514 listener Authentik already feeds — see
      # crowdsec_definitions.yaml. UDP so a CrowdSec/network outage can never
      # block or slow down local SSH authentication.
      auth,authpriv.*    @{{ vault_vm_core_ip }}:514;RSYSLOG_SyslogProtocol23Format
    dest: /etc/rsyslog.d/60-crowdsec-ssh-forward.conf
    mode: "0644"
    owner: root
    group: root
  register: _rsyslog_config

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: _rsyslog_config is changed

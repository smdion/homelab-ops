---
# Shared PVE APT repository management — disable enterprise repos, add no-subscription repo,
# install nag removal script with APT hook.
#
# Required variables:
#   pve_debian_release  — Debian release codename (e.g. bookworm, trixie)
#
# Included by: build_pve.yaml, maintain_pve.yaml

# === Disable enterprise repos ===
# PVE 8 (Bookworm) uses .list format, PVE 9 (Trixie) uses .sources (DEB822).
# Only disable files with active enterprise stanzas — skip files that are
# already fully commented out or that contain no-subscription content.
- name: Find potential enterprise repo files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "pve-enterprise.*"
      - "ceph.*"
    file_type: file
  register: _enterprise_files

- name: Read DEB822 repo file content
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ _enterprise_files.files | selectattr('path', 'search', '\\.sources$') | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: _sources_content

- name: Disable enterprise repos (.sources — DEB822 format)
  ansible.builtin.lineinfile:
    path: "{{ item.item.path }}"
    regexp: '^Enabled:'
    line: "Enabled: false"
    insertafter: '^Components:'
    state: present
  loop: "{{ _sources_content.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - (item.content | b64decode) is search('(?m)^Types:')
    - (item.content | b64decode) is search('enterprise')

- name: Disable enterprise repos (.list — legacy format)
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(deb\s.*enterprise)'
    replace: '# \1'
  loop: "{{ _enterprise_files.files | selectattr('path', 'search', '\\.list$') | list }}"
  loop_control:
    label: "{{ item.path | basename }}"

# === Replace enterprise ceph with no-subscription ===
# PVE installs ceph packages as dependencies even on standalone nodes.
# Cluster nodes get a no-subscription ceph source during install, but
# standalone nodes only get the enterprise source. Replace it so ceph
# packages can receive updates on all PVE hosts.
- name: Set ceph release name for current PVE version
  ansible.builtin.set_fact:
    _ceph_release: "{{ 'ceph-squid' if pve_debian_release == 'trixie' else 'ceph-reef' }}"

- name: Ensure ceph no-subscription repo (replace enterprise if present)
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/{{ _ceph_release }}
      Suites: {{ pve_debian_release }}
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    dest: /etc/apt/sources.list.d/ceph.sources
    owner: root
    group: root
    mode: "0644"

# === Add no-subscription repo ===
# Nodes upgraded from PVE 8→9 may already have a DEB822 .sources file
# (e.g. proxmox.sources) providing the no-subscription repo. If so, remove
# the legacy .list file to avoid duplicate source warnings. Otherwise,
# template the .list file for fresh installs that don't have one yet.
- name: Check for existing PVE no-subscription DEB822 source
  ansible.builtin.shell:
    cmd: grep -rl 'pve-no-subscription' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
  register: _nosub_deb822_raw
  changed_when: false

- name: Set DEB822 no-subscription fact
  ansible.builtin.set_fact:
    _nosub_deb822_exists: "{{ _nosub_deb822_raw.stdout | trim | length > 0 }}"

- name: Remove duplicate pve-no-subscription.list (DEB822 source exists)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-no-subscription.list
    state: absent
  when: _nosub_deb822_exists

- name: Template no-subscription repo (no DEB822 source found)
  ansible.builtin.template:
    src: templates/pve-no-subscription.list.j2
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    owner: root
    group: root
    mode: "0644"
  when: not _nosub_deb822_exists

# === Clean up stale repo files from PVE 8→9 upgrade ===
# .bak and .disabled extensions are ignored by apt but are clutter.
# Disabled .sources files pointing to the previous Debian release are stale.
- name: Find stale repo files (.bak, .disabled, .dpkg-dist, pve-test)
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*.bak"
      - "*.disabled"
      - "*.dpkg-dist"
      - "pve-test.*"
    file_type: file
  register: _stale_repo_files

- name: Remove stale repo files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _stale_repo_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Find disabled .sources files for previous release
  ansible.builtin.shell:
    cmd: >-
      grep -rlP '^Enabled:\s*(false|no|0)' /etc/apt/sources.list.d/*.sources 2>/dev/null
      | xargs -r grep -l 'Suites:.*{{ _previous_release }}'
      || true
  vars:
    _previous_release: "{{ 'bookworm' if pve_debian_release == 'trixie' else '' }}"
  register: _stale_sources_raw
  changed_when: false
  when: pve_debian_release != 'bookworm'

- name: Remove disabled sources for previous release
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (_stale_sources_raw.stdout_lines | default([])) }}"
  loop_control:
    label: "{{ item | basename }}"
  when: pve_debian_release != 'bookworm'

# Multi-stanza DEB822 files (e.g. ceph.sources) may contain a stale stanza
# for the previous release alongside the current one. Remove the old stanza
# block (blank-line delimited) that references the previous release.
- name: Remove stale release stanzas from DEB822 files
  ansible.builtin.shell:
    cmd: |
      prev="{{ _previous_release }}"
      for f in /etc/apt/sources.list.d/ceph.sources; do
        [ -f "$f" ] || continue
        if grep -q "Suites:.*$prev" "$f"; then
          python3 -c "
      import re, sys
      text = open('$f').read()
      # Split on blank lines into stanzas, keep only current release
      stanzas = re.split(r'\n\n+', text.strip())
      kept = [s for s in stanzas if 'Suites: $prev' not in s and 'Suites:  $prev' not in s]
      open('$f', 'w').write('\n\n'.join(kept) + '\n')
      "
          echo "cleaned $f"
        fi
      done
  vars:
    _previous_release: "{{ 'bookworm' if pve_debian_release == 'trixie' else '' }}"
  register: _stanza_cleanup
  changed_when: "'cleaned' in (_stanza_cleanup.stdout | default(''))"
  when: pve_debian_release != 'bookworm'

# === Remove subscription nag ===
- name: Template nag removal script
  ansible.builtin.template:
    src: templates/pve-remove-nag.sh.j2
    dest: /usr/local/bin/pve-remove-nag.sh
    owner: root
    group: root
    mode: "0755"

- name: Run nag removal script
  ansible.builtin.command: /usr/local/bin/pve-remove-nag.sh
  changed_when: false

- name: Install APT hook for nag removal after updates
  ansible.builtin.copy:
    content: |
      DPkg::Post-Invoke { "/usr/local/bin/pve-remove-nag.sh"; };
    dest: /etc/apt/apt.conf.d/no-nag-script
    owner: root
    group: root
    mode: "0644"

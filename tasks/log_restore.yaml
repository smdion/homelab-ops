---
# Structured MariaDB logging task for restore/verify operations.
# Pass all variables via vars: on the include_tasks call.
#
# Required vars:
#   log_hostname          — hostname (pass inventory_hostname — already a proper FQDN)
#   restore_application   — application name (e.g., "authentik-db", "Docker")
#   restore_source_file   — backup filename that was restored/verified
#   restore_type          — "Servers" or "Appliances"
#   restore_subtype       — "Database", "Appdata", or "Config"
#   restore_operation     — "verify", "restore", or "rollback"
#   restore_status        — "success" or "failed"
#   restore_detail        — free-text context (e.g., "15 tables verified")
#
# Inherited from playbook scope (no need to pass):
#   vault_logging_db_host, vault_logging_db_port, vault_logging_db_user,
#   vault_logging_db_password, vault_logging_db_name  (from vars/secrets.yaml)

- name: Log restore to MariaDB
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  connection: local
  ansible.mysql.mysql_query:
    login_host: "{{ vault_logging_db_host }}"
    login_port: "{{ vault_logging_db_port }}"
    login_user: "{{ vault_logging_db_user }}"
    login_password: "{{ vault_logging_db_password }}"
    login_db: "{{ vault_logging_db_name }}"
    query: >-
      INSERT INTO restores
      (application, hostname, source_file, restore_type, restore_subtype, operation, status, detail, timestamp)
      VALUES (%s, %s, %s, %s, %s, %s, %s, %s, UTC_TIMESTAMP())
      ON DUPLICATE KEY UPDATE
        source_file = VALUES(source_file), status = VALUES(status),
        detail = VALUES(detail), timestamp = UTC_TIMESTAMP()
    positional_args:
      - "{{ restore_application }}"
      - "{{ log_hostname }}"
      - "{{ restore_source_file }}"
      - "{{ restore_type }}"
      - "{{ restore_subtype }}"
      - "{{ restore_operation }}"
      - "{{ restore_status }}"
      - "{{ restore_detail }}"
  register: _log_restore_result
  retries: 40
  delay: 10
  until: _log_restore_result is succeeded
  when: not (skip_db | default(false) | bool) and not ansible_check_mode
  no_log: "{{ _no_log }}"

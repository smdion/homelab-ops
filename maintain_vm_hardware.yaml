---
# Category: Maintain
# Schedule: none
# Make existing cluster VMs match the hardware in vars/definitions/vm_definitions.yaml: vm_cores, vm_sockets (default 1)
# and vm_memory_mb, plus the CPU type (vm_cpu_type) on VMs whose definition sets it. Report-only by default (prints drift,
# changes nothing). Runs through the Proxmox API.
#
# CPU type: optional. A VM whose definition has no vm_cpu_type keeps whatever CPU type it runs with (shown in the report,
# never changed). With vm_cpu_type set (e.g. `host`), a different live type is drift and is written as `cpu=<type>`,
# which replaces the whole Proxmox `cpu` option (any extra flags on it are dropped). A VM with no `cpu` in its config
# runs Proxmox's default, reported as kvm64.
#
# Covers cluster VMs and VMs on standalone nodes (pve_definitions standalone: true, e.g. Sentinel): a vm_definitions entry
# whose pve_target_node is a standalone node is read and changed through that node's own API.
#
# A changed value is written to the VM config as a PENDING change; the guest only sees it after a restart. With
# hw_restart the running VM is restarted through the API `status/reboot` call (graceful shutdown, then start; applies
# pending changes) and the play waits until the pending change is gone. HA-managed VMs stay HA resources throughout.
#
# Optional extra vars:
#   hw_vm_names=amp,core   — vm_definitions keys to process (comma list or YAML list). Required with hw_apply.
#   hw_apply=true          — write drifted values to the VM config (pending until restart)
#   hw_restart=true        — with hw_apply: also restart running VMs that have a pending hardware change
#
# Usage:
#   ansible-playbook maintain_vm_hardware.yaml                                        # report drift for every cluster VM
#   ansible-playbook maintain_vm_hardware.yaml -e hw_vm_names=amp -e hw_apply=true     # write, restart later
#   ansible-playbook maintain_vm_hardware.yaml -e hw_vm_names=amp -e hw_apply=true -e hw_restart=true
#
# Required: vars/definitions/vm_definitions.yaml (vm_id, vm_cores, vm_memory_mb per VM; optional vm_sockets, vm_cpu_type)
# and/or a `vm_hardware:` block on a host_definitions entry (vmid, cores, sockets, memory_mb, optional cpu_type) for VMs
# that are hosts, such as PDM.

- name: Maintain VM hardware from definitions
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/configs/proxmox.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/host_definitions.yaml
    - vars/definitions/pve_definitions.yaml
    - vars/configs/semaphore_check.yaml
  vars:
    hw_apply: false
    hw_restart: false
    hw_vm_names: []
    maintenance_name: "VM Hardware"
    maintenance_type: "Appliances"
    maintenance_subtype: "Maintenance"
    maintenance_url: ""
    maintenance_description: "Make existing VM cores/sockets/memory/CPU type match vm_definitions"
    _hw_hw_keys: [cores, sockets, memory, cpu]

  pre_tasks:
    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_playbook: "maintain_vm_hardware.yaml"
        pre_hostname: "{{ controller_fqdn }}"

    - name: Resolve PVE API endpoint
      include_tasks: tasks/resolve_pve_api.yaml
      vars:
        _pve_target_node: ""

    # One API per endpoint: 'cluster' (shared VIP) plus every standalone node, keyed by node name.
    - name: Set API base and auth header per endpoint
      ansible.builtin.set_fact:
        _hw_apis: >-
          {%- set out = {'cluster': {'base': 'https://' ~ _pve.api_host ~ ':' ~ pve_api_port ~ '/api2/json',
                                     'auth': 'PVEAPIToken=' ~ _pve.api_user ~ '!' ~ _pve.api_token_id ~ '=' ~ _pve.api_token_secret}} -%}
          {%- for n, d in pve_definitions.items() if d is mapping and d.standalone | default(false) | bool -%}
            {%- set _ = out.update({n: {'base': 'https://' ~ d.api_host ~ ':' ~ pve_api_port ~ '/api2/json',
                                        'auth': 'PVEAPIToken=' ~ d.api_user ~ '!' ~ d.api_token_id ~ '=' ~ d.api_token_secret}}) -%}
          {%- endfor -%}
          {{ out | to_json }}
      no_log: "{{ _no_log }}"

    - name: Normalise the endpoint map
      ansible.builtin.set_fact:
        _hw_apis: "{{ _hw_apis if _hw_apis is not string else _hw_apis | from_json }}"
      no_log: "{{ _no_log }}"

  tasks:
    - name: Initialize maintenance state
      ansible.builtin.set_fact:
        maintenance_failed: false

    - block:
        - name: Normalise the VM name filter
          ansible.builtin.set_fact:
            _hw_names: "{{ (hw_vm_names.split(',') if hw_vm_names is string else hw_vm_names) | map('trim') | reject('equalto', '') | list }}"

        - name: Refuse to write without an explicit VM list
          ansible.builtin.assert:
            that: _hw_names | length > 0
            fail_msg: "hw_apply needs hw_vm_names (e.g. -e hw_vm_names=amp) so a run never touches every VM"
            quiet: true
          when: hw_apply | bool

        - name: Get VMs from the cluster and each standalone node
          ansible.builtin.uri:
            url: "{{ _hw_apis[item].base }}/cluster/resources?type=vm"
            method: GET
            headers:
              Authorization: "{{ _hw_apis[item].auth }}"
            validate_certs: false
          register: _hw_cluster
          check_mode: false
          loop: "{{ _hw_apis.keys() | list }}"
          no_log: "{{ _no_log }}"

        # Candidates come from vm_definitions (vm_id + vm_cores [+ vm_sockets, vm_memory_mb, vm_cpu_type]) and from host_definitions
        # entries that carry a `vm_hardware: { vmid, cores, sockets, memory_mb [, cpu_type] }` block (VMs that are hosts, e.g. PDM — they must NOT get a
        # top-level vm_id, which apply_role reads as "this role is a provisioned VM"). Only VMs that also exist in the cluster are
        # kept. Each candidate is looked up on one endpoint only: its standalone pve_target_node, else the cluster.
        - name: Select target VMs
          ansible.builtin.set_fact:
            _hw_targets: >-
              {%- set cands = [] -%}
              {%- for name, d in vm_definitions.items() if d is mapping and d.vm_id is defined and d.vm_cores is defined -%}
                {%- set api = d.pve_target_node if (d.pve_target_node | default('')) in _hw_apis and d.pve_target_node != 'cluster' else 'cluster' -%}
                {%- set _ = cands.append({'name': name, 'api': api, 'vmid': d.vm_id, 'cores': d.vm_cores, 'sockets': d.vm_sockets | default(1), 'memory': d.vm_memory_mb, 'cpu': d.vm_cpu_type | default('')}) -%}
              {%- endfor -%}
              {%- for name, d in host_definitions.items() if d is mapping and d.vm_hardware is defined -%}
                {%- set _ = cands.append({'name': name, 'api': 'cluster', 'vmid': d.vm_hardware.vmid, 'cores': d.vm_hardware.cores, 'sockets': d.vm_hardware.sockets | default(1),
                      'memory': d.vm_hardware.memory_mb, 'cpu': d.vm_hardware.cpu_type | default('')}) -%}
              {%- endfor -%}
              {%- set out = [] -%}
              {%- for c in cands if _hw_names | length == 0 or c.name in _hw_names -%}
                {%- set res = (_hw_cluster.results | selectattr('item', 'equalto', c.api) | first).json.data -%}
                {%- for r in res if (r.vmid | string) == (c.vmid | string) -%}
                  {%- set want = {'cores': c.cores | int, 'sockets': c.sockets | int, 'memory': c.memory | int} -%}
                  {#- CPU type is only managed when the definition sets it -#}
                  {%- if c.cpu | string | length > 0 -%}{%- set _ = want.update({'cpu': c.cpu | string}) -%}{%- endif -%}
                  {%- set _ = out.append({'name': c.name, 'api': c.api, 'vmid': r.vmid, 'node': r.node, 'status': r.status, 'want': want}) -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ out | to_json }}

        - name: Normalise the target list
          ansible.builtin.set_fact:
            _hw_targets: "{{ _hw_targets if _hw_targets is not string else _hw_targets | from_json }}"

        - name: Build the config/pending read list
          ansible.builtin.set_fact:
            _hw_reads_loop: >-
              {%- set out = [] -%}
              {%- for t in _hw_targets -%}
                {%- for w in ['config', 'pending'] -%}
                  {%- set _ = out.append(t | combine({'what': w})) -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ out | to_json }}

        - name: Read each VM's config and pending changes
          ansible.builtin.uri:
            url: "{{ _hw_apis[item.api].base }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}/{{ item.what }}"
            method: GET
            headers:
              Authorization: "{{ _hw_apis[item.api].auth }}"
            validate_certs: false
          register: _hw_reads
          check_mode: false
          loop: "{{ _hw_reads_loop if _hw_reads_loop is not string else _hw_reads_loop | from_json }}"
          loop_control:
            label: "{{ item.vmid }} {{ item.what }}"
          no_log: "{{ _no_log }}"

        - name: Compute drift and pending state
          ansible.builtin.set_fact:
            _hw_plan: >-
              {%- set out = [] -%}
              {%- for t in _hw_targets -%}
                {%- set cfg = (_hw_reads.results | selectattr('item.vmid', 'equalto', t.vmid) | selectattr('item.what', 'equalto', 'config') | first).json.data -%}
                {%- set pend = (_hw_reads.results | selectattr('item.vmid', 'equalto', t.vmid) | selectattr('item.what', 'equalto', 'pending') | first).json.data -%}
                {#- cpu option is `[cputype=]<type>[,flags=...]`; compare the type only; absent = Proxmox default kvm64 -#}
                {%- set cpu_type = (cfg.cpu | default('kvm64') | string).split(',')[0] | regex_replace('^cputype=', '') -%}
                {%- set cur = {'cores': cfg.cores | default(1) | int, 'sockets': cfg.sockets | default(1) | int, 'memory': cfg.memory | default(0) | int, 'cpu': cpu_type} -%}
                {%- set diff = {} -%}
                {%- for k, v in t.want.items() -%}
                  {%- if cur[k] != v -%}{%- set _ = diff.update({k: v}) -%}{%- endif -%}
                {%- endfor -%}
                {%- set pending_keys = [] -%}
                {%- for it in pend if it.key in _hw_hw_keys and it.pending is defined -%}{%- set _ = pending_keys.append(it.key) -%}{%- endfor -%}
                {%- set _ = out.append(t | combine({'cur': cur, 'diff': diff, 'pending': pending_keys})) -%}
              {%- endfor -%}
              {{ out | to_json }}

        - name: Normalise the plan
          ansible.builtin.set_fact:
            _hw_plan: "{{ _hw_plan if _hw_plan is not string else _hw_plan | from_json }}"

        - name: List the running VMs that need a restart to pick up a hardware change
          ansible.builtin.set_fact:
            _hw_restart_list: "{{ _hw_plan | selectattr('status', 'equalto', 'running') | selectattr('diff') | list + _hw_plan | selectattr('status', 'equalto', 'running') | rejectattr('diff') | selectattr('pending') | list }}"

        - name: Report
          ansible.builtin.debug:
            msg: |
              === VM HARDWARE — definitions vs live ({{ 'APPLY' if hw_apply | bool else 'report only' }}{{ ', restart' if hw_restart | bool else '' }}) ===
              {{ '%-6s %-12s %-8s %-9s %-26s %-22s %s' | format('VMID', 'Name', 'Node', 'Status', 'Live (cores x sockets, MB)', 'CPU type', 'Drift / pending') }}
              {% for p in _hw_plan %}
              {{ '%-6s %-12s %-8s %-9s %-26s %-22s %s' | format(p.vmid, p.name, p.node, p.status, p.cur.cores ~ ' x ' ~ p.cur.sockets ~ ', ' ~ p.cur.memory, p.cur.cpu ~ ('' if 'cpu' in p.want else ' (unset)'),
                   ('DRIFT -> ' ~ p.diff if p.diff else 'ok') ~ ('; PENDING restart: ' ~ p.pending | join(',') if p.pending else '')) }}
              {% endfor %}
              {% if not (hw_apply | bool) %}
              Report only — nothing written (re-run with -e hw_vm_names=<name> -e hw_apply=true [-e hw_restart=true]).
              {% endif %}

        # ── Disk flags (thin-provisioning reclaim) — report only ──
        - name: Compute disk flag drift
          ansible.builtin.set_fact:
            _hw_disks: >-
              {%- set out = [] -%}
              {%- for t in _hw_targets -%}
                {%- set cfg = (_hw_reads.results | selectattr('item.vmid', 'equalto', t.vmid) | selectattr('item.what', 'equalto', 'config') | first).json.data -%}
                {%- for k, v in cfg.items() if k is match('^(scsi|virtio|sata|ide)[0-9]+$') and 'media=cdrom' not in (v | string) -%}
                  {%- set opts = {} -%}
                  {%- for kv in (v | string).split(',')[1:] if '=' in kv -%}{%- set _ = opts.update({kv.split('=')[0]: kv.split('=')[1]}) -%}{%- endfor -%}
                  {%- set missing = [] -%}
                  {%- for fk, fv in pve_disk_flags.items() if (opts.get(fk) | string) != (fv | string) -%}{%- set _ = missing.append(fk ~ '=' ~ fv) -%}{%- endfor -%}
                  {%- set _ = out.append({'vmid': t.vmid, 'name': t.name, 'disk': k, 'volume': (v | string).split(',')[0], 'missing': missing}) -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ out | to_json }}

        - name: Normalise the disk list
          ansible.builtin.set_fact:
            _hw_disks: "{{ _hw_disks if _hw_disks is not string else _hw_disks | from_json }}"

        - name: Get provisioned/used size of each disk image (best effort)
          ansible.builtin.uri:
            url: "{{ _hw_apis[item.api].base }}/nodes/{{ item.node }}/storage/{{ pve_definitions[item.api].storage | default(pve_storage) if item.api != 'cluster' else pve_storage }}/content?vmid={{ item.vmid }}"
            method: GET
            headers:
              Authorization: "{{ _hw_apis[item.api].auth }}"
            validate_certs: false
          register: _hw_content
          check_mode: false
          ignore_errors: true  # observational — storage content listing needs Datastore.Audit
          loop: "{{ _hw_targets }}"
          loop_control:
            label: "{{ item.vmid }} {{ item.name }}"
          no_log: "{{ _no_log }}"

        - name: Report disk flags
          ansible.builtin.debug:
            msg: |
              === DISK FLAGS — want {{ pve_disk_flags }} on every disk (report only; applied on the next VM restart) ===
              {{ '%-6s %-12s %-8s %-46s %s' | format('VMID', 'Name', 'Disk', 'Volume', 'Missing') }}
              {% for d in _hw_disks %}
              {{ '%-6s %-12s %-8s %-46s %s' | format(d.vmid, d.name, d.disk, d.volume, d.missing | join(', ') if d.missing else 'ok') }}
              {% endfor %}

              Image size (provisioned / used, where the storage reports it):
              {% for r in _hw_content.results | default([]) if r is not failed %}
              {% for c in r.json.data | default([]) if c.format is defined %}
                {{ '%-6s %-12s %-40s provisioned %6.1f GB   used %s' | format(r.item.vmid, r.item.name, c.volid, (c.size | default(0) | float) / 1073741824, ((c.used | float / 1073741824) | round(1) ~ ' GB') if c.used is defined else 'n/a (storage does not report it)') }}
              {% endfor %}
              {% endfor %}

        - name: Write drifted hardware to the VM config (pending until restart)
          ansible.builtin.uri:
            url: "{{ _hw_apis[item.api].base }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}/config"
            method: PUT
            headers:
              Authorization: "{{ _hw_apis[item.api].auth }}"
            body_format: form-urlencoded
            body: "{{ item.diff }}"
            validate_certs: false
          loop: "{{ _hw_plan | selectattr('diff') | list }}"
          loop_control:
            label: "{{ item.vmid }} {{ item.name }} {{ item.diff }}"
          when: hw_apply | bool
          no_log: "{{ _no_log }}"

        - name: Restart running VMs that have a hardware change to apply (graceful, applies pending)
          ansible.builtin.uri:
            url: "{{ _hw_apis[item.api].base }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}/status/reboot"
            method: POST
            headers:
              Authorization: "{{ _hw_apis[item.api].auth }}"
            validate_certs: false
          loop: "{{ _hw_restart_list }}"
          loop_control:
            label: "{{ item.vmid }} {{ item.name }}"
          when: (hw_apply | bool) and (hw_restart | bool)
          no_log: "{{ _no_log }}"

        - name: Wait for the restarted VMs to be running with no pending hardware change
          ansible.builtin.uri:
            url: "{{ _hw_apis[item.api].base }}/nodes/{{ item.node }}/qemu/{{ item.vmid }}/pending"
            method: GET
            headers:
              Authorization: "{{ _hw_apis[item.api].auth }}"
            validate_certs: false
          register: _hw_wait
          until: >-
            _hw_wait.json.data | selectattr('key', 'in', _hw_hw_keys) | selectattr('pending', 'defined') | list | length == 0
          retries: 60
          delay: 5
          loop: "{{ _hw_restart_list }}"
          loop_control:
            label: "{{ item.vmid }} {{ item.name }}"
          when: (hw_apply | bool) and (hw_restart | bool)
          no_log: "{{ _no_log }}"

      rescue:
        - name: Set maintenance failed
          ansible.builtin.set_fact:
            maintenance_failed: true

      always:
        - name: Send alert on failure
          include_tasks: tasks/notify.yaml
          when: maintenance_failed
          vars:
            discord_name: "{{ maintenance_name }}"
            discord_operation: "Maintenance"
            discord_status: "failed"
            discord_detail: "check Semaphore logs"
            discord_color: "{{ discord_color_failure }}"
            discord_url: "{{ maintenance_url }}"

        - name: Log maintenance to MariaDB
          include_tasks: tasks/log_mariadb.yaml
          when: hw_apply | bool
          vars:
            log_table: maintenance
            log_application: "{{ maintenance_name }}"
            log_hostname: "{{ controller_fqdn }}"
            log_type: "{{ maintenance_type }}"
            log_subtype: "{{ maintenance_subtype }}"
            log_status: "{{ 'failed' if maintenance_failed else 'success' }}"

        - name: Fail play if maintenance failed
          ansible.builtin.fail:
            msg: "VM hardware maintenance failed — see notification for details"
          when: maintenance_failed

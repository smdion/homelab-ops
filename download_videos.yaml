---
# Category: Utilities
# Download videos via MeTube / yt-dlp — dispatcher pattern.
#
# Each run is a fast DISPATCHER, not a blocking download:
#   1. Guard   — if a yt-dlp download is already running in the container, end the
#                play immediately. This is why the every-10-min schedule no longer
#                queues up "Waiting" tasks behind a long download (parallel tasks are
#                disabled, so a blocking run used to hold the single slot for the whole
#                download and every tick stacked behind it).
#   2. Sweep   — yt-dlp is idle, so any manifest left by a previously-launched detached
#                download is complete: send per-video notifications and clear it.
#   3. Dispatch— process new bookmarklet captures, then launch yt-dlp DETACHED
#                (docker exec -d) and return in seconds. The detached wrapper writes
#                yt-dlp's exit code to a status file so the next sweep can alert on failure.
#
# Required extra vars:
#   hosts_variable  — inventory group to target (pre-filled by Semaphore environment)
#   config_file     — download profile name, loads vars/<config_file>.yaml (pre-filled by Semaphore environment)
#
# Parameterized on config_file — each Semaphore template passes a different value
# (e.g., "download_default"). Adding a new download profile = add vars/download_<name>.yaml
# with per-user preferences + create a Semaphore template with config_file: download_<name>.
# Shared infrastructure lives in vars/configs/download_base.yaml (loaded automatically).
#
# The concurrency guard is process-based (pgrep) rather than a lock file so a crashed
# download cannot leave a stale lock that wedges all future runs. yt-dlp's own
# --download-archive handles de-duplication, so the on-demand batch file is intentionally
# never truncated — re-running over already-downloaded URLs is a fast no-op.
#
# NOTE: This playbook intentionally does not log to the maintenance table. Downloads
# run frequently (multiple times daily) and would flood the DB with low-value records.
# Per-video notifications provide sufficient visibility. The stale_maintenance
# health check excludes this playbook.
#
# Usage:
#   ansible-playbook download_videos.yaml -e hosts_variable=docker_stacks -e config_file=download_default

- name: Download videos via yt-dlp (dispatcher)
  hosts: "{{ hosts_variable }}"
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/configs/download_base.yaml
    - "vars/configs/{{ config_file }}.yaml"

  pre_tasks:

    - name: Clean old successful Semaphore task runs
      include_tasks: tasks/clean_semaphore_tasks.yaml

    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_assert_config_file: true
        pre_playbook: "download_videos.yaml"

  tasks:
    - name: Initialize download state
      ansible.builtin.set_fact:
        downloaded_videos: []

    # == Guard: bail out fast if a download is in flight OR the container is down =
    # The detached wrapper writes its PID to the state file at launch; here we
    # validate that PID against /proc. Alive = a download is running, so this run
    # exits in a couple of seconds and the 10-min schedule never queues behind it.
    # (The previous pgrep approach was a no-op: pgrep is not installed in the
    # metube image, so `docker exec ... pgrep` exited 127 and always read "idle".)
    # Validating against /proc keeps it process-based — a crashed download leaves
    # a stale PID file that is simply ignored, never a lock that wedges future runs.
    #
    # First, gate the whole thing on `docker ps`: the stack backups stop containers
    # one at a time for a consistent snapshot, so on the every-10-min schedule a run
    # routinely lands inside a backup window with metube briefly stopped. A bare
    # `docker exec` against a stopped container exits non-zero and used to fail the
    # whole play (firing a false Discord alert). When the container is not running we
    # emit "down" and bail cleanly, exactly like the in-progress case.
    # Output: "running <start-epoch>", "idle", or "down".
    - name: Check container state and whether a yt-dlp download is already running
      become: true
      ansible.builtin.shell: >
        if [ -z "$(docker ps -q -f name=^/{{ metube_container }}$ -f status=running)" ];
        then echo down;
        else docker exec {{ metube_container }} sh -c
        'p=$(cat {{ ytdlp_state_file }} 2>/dev/null);
        if [ -n "$p" ] && [ -d /proc/$p ];
        then echo "running $(stat -c %Y {{ ytdlp_state_file }} 2>/dev/null)";
        else echo idle; fi';
        fi
      register: _ytdlp_running
      changed_when: false
      check_mode: false

    # The mosquitto sink lives in its own stack and is briefly stopped while that
    # stack is backed up. The download run must not fail just because the HA state
    # sink is momentarily unavailable — skip the publish when it is down; HA keeps
    # the last retained value until the next cycle.
    - name: Check whether the mosquitto sink is running
      delegate_to: "{{ metube_mqtt_publish_host }}"
      become: true
      ansible.builtin.shell: >
        docker ps -q -f name=^/{{ metube_mqtt_container }}$ -f status=running
      register: _mosq_up
      changed_when: false
      check_mode: false

    # Publish the guard's truth to MQTT (retained) so HA always has the last
    # known state. Done here, before the early end_play, so it runs every cycle —
    # including the runs that bail out because a download is in flight.
    - name: Publish download state to MQTT for HA
      delegate_to: "{{ metube_mqtt_publish_host }}"
      become: true
      when: _mosq_up.stdout | default('') | length > 0
      vars:
        _running: "{{ _ytdlp_running.stdout is search('running') }}"
        _since: "{{ (_ytdlp_running.stdout.split() | last) if (_ytdlp_running.stdout is search('running')) else '' }}"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ metube_mqtt_container }}"
          - sh
          - -c
          - >-
            mosquitto_pub -h 127.0.0.1 -u {{ vault_docker_mqtt_user }}
            -P "{{ vault_docker_mqtt_password }}"
            -t {{ metube_mqtt_topic }}/state -r
            -m {{ 'ON' if (_running | bool) else 'OFF' }} ;
            mosquitto_pub -h 127.0.0.1 -u {{ vault_docker_mqtt_user }}
            -P "{{ vault_docker_mqtt_password }}"
            -t {{ metube_mqtt_topic }}/info -r
            -m '{"profile":"{{ config_name }}","status":"{{ 'downloading' if (_running | bool) else 'idle' }}","since":"{{ _since }}"}'
      changed_when: false
      no_log: true

    # == Down handling: tell an expected stop from an unexpected outage =========
    # The container is down. If a homelab playbook intentionally stopped it (backup,
    # restore, rollback) the host carries a fresh maintenance flag — that is routine,
    # so bail quietly. Without the flag the container is down for some other reason
    # (crash, OOM, a failed restart), which is worth an alert.
    - name: Inspect the docker maintenance flag (container is down)
      become: true
      ansible.builtin.stat:
        path: "{{ docker_maintenance_flag }}"
      register: _maint_flag
      when: _ytdlp_running.stdout is search('down')

    - name: Inspect prior down-alert sentinel (container is down)
      become: true
      ansible.builtin.stat:
        path: "{{ metube_down_alert_flag }}"
      register: _down_alerted
      when: _ytdlp_running.stdout is search('down')

    - name: Classify the outage as unexpected
      ansible.builtin.set_fact:
        _metube_unexpected_down: >-
          {{ not (
               (_maint_flag.stat.exists | default(false))
               and ((ansible_facts.date_time.epoch | int) - (_maint_flag.stat.mtime | default(0) | int)
                     <= (docker_maintenance_flag_max_age | int))
             ) }}
      when: _ytdlp_running.stdout is search('down')

    - name: Alert — metube is down outside any maintenance window
      include_tasks: tasks/notify.yaml
      when:
        - _metube_unexpected_down | default(false) | bool
        - not (_down_alerted.stat.exists | default(false))
      vars:
        discord_name: "MeTube"
        discord_operation: "Container"
        discord_status: "failed"
        discord_detail: "{{ metube_container }} is down with no maintenance in progress"
        discord_color: "{{ discord_color_failure }}"
        discord_url: "{{ backup_url }}"
        discord_fields:
          - name: "Config"
            value: "{{ config_name }}"

    - name: Mark down alert as sent (one alert per outage)
      become: true
      ansible.builtin.file:
        path: "{{ metube_down_alert_flag }}"
        state: touch
        mode: "0644"
      changed_when: false
      when:
        - _metube_unexpected_down | default(false) | bool
        - not (_down_alerted.stat.exists | default(false))

    # Container is up — clear any leftover down sentinel so the next genuine
    # outage alerts again. Runs on the in-progress/idle paths alike.
    - name: Clear the down-alert sentinel (container is up)
      become: true
      ansible.builtin.file:
        path: "{{ metube_down_alert_flag }}"
        state: absent
      changed_when: false
      when: _ytdlp_running.stdout is not search('down')

    - name: End play early — a download is in progress or the container is down
      ansible.builtin.meta: end_play
      when: _ytdlp_running.stdout is search('running|down')

    # == Deploy config ========================================================
    # Rendered immediately before any launch so the detached yt-dlp reads the
    # current template/vars at startup.
    - name: Render and deploy yt-dlp config
      become: true
      ansible.builtin.template:
        src: templates/metube.conf.j2
        dest: "{{ metube_config_host_dir }}/{{ config_name }}/{{ config_name }}.conf"
        mode: "0644"

    # == Completion sweep =====================================================
    # yt-dlp is idle. A manifest with content means a previously-launched
    # detached download has finished — notify on it, then clear it.
    - name: Check manifest file size
      become: true
      ansible.builtin.shell: >
        docker exec {{ metube_container }} stat -c%s {{ metube_manifest }} 2>/dev/null || echo 0
      register: _manifest_size
      changed_when: false
      check_mode: false

    - name: Fail if manifest exceeds 5 MB
      ansible.builtin.fail:
        msg: >-
          Download manifest is {{ (_manifest_size.stdout | int / 1048576) | round(1) }} MB
          (limit 5 MB). Prune {{ metube_manifest }} inside {{ metube_container }}.
      when: _manifest_size.stdout | int > 5242880

    - name: Read download manifest from container
      become: true
      ansible.builtin.shell: >
        docker exec {{ metube_container }} cat {{ metube_manifest }} 2>/dev/null || true
      register: _manifest_raw
      changed_when: false
      check_mode: false

    - name: Parse downloaded video metadata
      become: true
      ansible.builtin.shell: |
        docker exec {{ metube_container }} cat {{ metube_manifest }} 2>/dev/null | \
          python3 -c "
        import sys, json
        result = []
        for line in sys.stdin:
            line = line.strip()
            if line.startswith('{') and line.endswith('}'):
                try:
                    result.append(json.loads(line))
                except json.JSONDecodeError:
                    pass
        print(json.dumps(result))
        "
      register: _parsed_manifest
      changed_when: false
      when: _manifest_raw.stdout | default('') | length > 0

    - name: Set downloaded videos fact
      ansible.builtin.set_fact:
        downloaded_videos: "{{ _parsed_manifest.stdout | default('[]') | from_json }}"
      when: _manifest_raw.stdout | default('') | length > 0

    - name: Send per-video notification
      include_tasks: tasks/notify.yaml
      loop: "{{ downloaded_videos }}"
      loop_control:
        loop_var: _video
        label: "{{ _video.title | default('unknown') }}"
      when: downloaded_videos | length > 0
      vars:
        vault_discord_webhook_id: "{{ vault_discord_download_webhook_id }}"
        vault_discord_webhook_token: "{{ vault_discord_download_webhook_token }}"
        discord_username: "{{ _video.uploader }} - MeTube Bot"
        discord_avatar: "{{ metube_avatar }}"
        discord_title: "{{ _video.title }}"
        discord_description: "{{ _video.description | default('') | truncate(4096, True, '...') }}"
        discord_color: "{{ discord_color_success }}"
        discord_url: "{{ _video.url }}"
        discord_author: "Channel: {{ _video.uploader }}"
        discord_author_url: "{{ _video.channel_url if _video.channel_url | default('') | length > 0 else omit }}"
        discord_author_icon: "{{ platform_icons[_video.extractor] | default(default_platform_icon) }}"
        discord_image: "{{ _video.thumbnail }}"
        discord_fields:
          - name: "Platform"
            value: "{{ platform_names[_video.extractor] | default(_video.extractor) }}"
          - name: "Duration"
            value: "{{ _video.duration }}"
        discord_footer:
          text: "metube.{{ vault_domain_ext }}"
          icon_url: "{{ metube_avatar }}"

    # -- Failure alert: read the exit code the detached wrapper recorded ------
    - name: Read yt-dlp exit status from last detached run
      become: true
      ansible.builtin.shell: >
        docker exec {{ metube_container }} cat {{ ytdlp_status_file }} 2>/dev/null || echo 0
      register: _ytdlp_status
      changed_when: false
      check_mode: false

    - name: Send alert on failure
      include_tasks: tasks/notify.yaml
      # rc 0 = success, 1 = download error handled by -i, 2 = no actionable URLs;
      # only rc > 2 is a genuine yt-dlp failure worth alerting on.
      when: _ytdlp_status.stdout | default('0') | trim | int > 2
      vars:
        discord_name: "Videos"
        discord_operation: "Download"
        discord_status: "failed"
        discord_color: "{{ discord_color_failure }}"
        discord_url: "{{ backup_url }}"
        discord_fields:
          - name: "Config"
            value: "{{ config_name }}"

    - name: Clear swept manifest and status file
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ metube_container }}"
          - rm
          - -f
          - "{{ metube_manifest }}"
          - "{{ ytdlp_status_file }}"
      changed_when: true
      when: >-
        (_manifest_raw.stdout | default('') | length > 0)
        or (_ytdlp_status.stdout | default('0') | trim | int != 0)

    # == Dispatch: process new captures and launch a detached download ========
    - name: Process bookmarklet captures into batch file
      become: true
      ansible.builtin.shell: |
        docker exec {{ metube_container }} python3 -c "
        import os, glob
        capture_dir = '{{ metube_capture_dir }}'
        batch_file = '{{ ytdlp_batch_file }}'
        files = glob.glob(os.path.join(capture_dir, '*.desktop'))
        if not files:
            print('no_captures')
        else:
            urls = []
            for f in files:
                for line in open(f):
                    if line.startswith('URL='):
                        urls.append(line[4:].strip())
            with open(batch_file, 'a') as bf:
                for url in urls:
                    bf.write(url + '\n')
            for f in files:
                os.remove(f)
            print(f'processed {len(urls)} url(s) from {len(files)} capture(s)')
        "
      register: _capture_result
      changed_when: "'processed' in _capture_result.stdout"
      when: metube_capture_dir is defined

    - name: Check batch file for URLs
      become: true
      ansible.builtin.shell: >
        docker exec {{ metube_container }}
        grep -c '^http' {{ ytdlp_batch_file }} 2>/dev/null || echo 0
      register: _batch_url_count
      changed_when: false
      check_mode: false

    # Capture profiles (on-demand) launch only when new captures arrived; static
    # profiles (channels) launch whenever their fixed batch list is non-empty.
    - name: Decide whether to launch a download
      ansible.builtin.set_fact:
        _should_launch: >-
          {{ (_capture_result.stdout | default('') is search('processed'))
             if metube_capture_dir is defined
             else (_batch_url_count.stdout | int > 0) }}

    # The wrapper records its own PID (the state marker the guard validates),
    # runs yt-dlp, writes the exit code for the next sweep, then clears the
    # marker. A crash skips the cleanup, but the guard ignores a dead PID.
    - name: Launch yt-dlp (detached) in the metube container
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -d
          - "{{ metube_container }}"
          - sh
          - -c
          - "echo $$ > {{ ytdlp_state_file }}; yt-dlp --config-location {{ metube_config_path }}; echo $? > {{ ytdlp_status_file }}; rm -f {{ ytdlp_state_file }}"
      changed_when: true
      when: _should_launch | bool

    # == Housekeeping: prune old temp download fragments ======================
    - name: Find old temp download files
      become: true
      ansible.builtin.find:
        paths: "{{ metube_temp_dir }}"
        file_type: file
        recurse: true
        age: "{{ metube_temp_max_age_days }}d"
      register: _old_temp_files

    - name: Delete old temp download files
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _old_temp_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _old_temp_files.matched > 0

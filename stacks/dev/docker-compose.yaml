x-base: &base
  mem_limit: ${MEM_LIMIT}
  restart: ${RESTART}
x-env: &env
  TZ: ${TZ}
x-uid: &uid
  PUID: ${PUID}
  PGID: ${PGID}
  UMASK: ${UMASK}
x-envuid: &envuid
  <<:
  - *env
  - *uid
networks:
  homelab:
    external: true
services:
  code-server:
    <<: *base
    container_name: code-server
    image: ${CODESERVER_IMAGE}:${CODESERVER_TAG}
    networks:
      - homelab
    ports:
    - 8443:8443
    labels:
      homelab.backup.paths: "/opt/code-server,/opt/homelab-ops,/opt/homelab-docs"
      homelab.health_timeout: "90"
    environment:
      <<: *envuid
      PROXY_DOMAIN: ${CODESERVER_PROXY_DOMAIN}
      DEFAULT_WORKSPACE: ${CODESERVER_DEFAULT_WORKSPACE}
    volumes:
    - core:/workspace/core
    - apps:/workspace/apps
    - dev:/workspace/dev
    - vps:/workspace/vps
    - homelab-ops:/workspace/homelab-ops
    - homelab-docs:/workspace/homelab-docs
    - /opt/CLAUDE.md:/workspace/CLAUDE.md:ro
    - ${APPSDIR}/code-server:/config
    - ./custom-cont-init.d:/custom-cont-init.d:ro
    healthcheck:
      test: ["CMD-SHELL", "ls /workspace/core /workspace/apps /workspace/dev /workspace/vps /workspace/homelab-ops /workspace/homelab-docs > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  docs:
    <<: *base
    container_name: docs
    image: ${DOCS_IMAGE}:${DOCS_TAG}
    networks:
      - homelab
    labels:
      homelab.backup.paths: "/opt/homelab-docs"
      homelab.test.skip_health: "true"
    ports:
      - 8084:80
    volumes:
      - ${APPSDIR}/homelab-docs/site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  netbootxyz:
    <<: *base
    container_name: netbootxyz
    image: ${NETBOOT_IMAGE}:${NETBOOT_TAG}
    networks:
      - homelab
    labels:
      homelab.backup.paths: "/opt/netboot"
    ports:
      - 3002:3000
      - 69:69/udp
      - 8082:80
    environment:
      <<: *envuid
    volumes:
      - ${APPSDIR}/netboot/config:/config
      - ${APPSDIR}/netboot/assets:/assets
volumes:
  # NFS mounts (core, apps from other VMs), local bind (dev), and VPS NFS are
  # deployment-specific — defined in docker-compose.override.j2, which deploy_stacks.yaml
  # templates to docker-compose.override.yaml on the host. See the docs site for details.
  core:
  apps:
  dev:
  vps:
  homelab-ops:
  homelab-docs:

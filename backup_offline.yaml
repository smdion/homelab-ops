---
# Sync backups to offline Synology storage.
# Wakes Synology via WOL, mounts shares, rsyncs backup data, unmounts,
# shuts down Synology, verifies shutdown. Sends notification + logs to MariaDB.
#
# Required extra vars:
#   hosts_variable  — inventory group to target (pre-filled by Semaphore environment)
#
# Usage:
#   ansible-playbook backup_offline.yaml -e hosts_variable=unraid

- name: Sync backups to offline Synology storage
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  hosts: "{{ hosts_variable }}"
  vars_files:
    - vars/secrets.yaml
    - "vars/configs/{{ config_file }}.yaml"
    - vars/configs/synology.yaml
  vars:
    config_file: "{{ hosts_variable }}"
  pre_tasks:
    - name: Set offline backup name
      ansible.builtin.set_fact:
        backup_name: "Synology"

    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_assert_config_file: true
        pre_playbook: "backup_offline.yaml"

  tasks:
    - name: Initialize sync state
      ansible.builtin.set_fact:
        sync_failed: false
        backup_status: {results: []}

    - block:
        - name: Check if Synology online
          ansible.builtin.command: ping -c 2 {{ vault_synology_ip }}
          delegate_to: localhost
          failed_when: false
          register: _ping_result
          changed_when: false
          check_mode: false

        - name: Send Wake-On-LAN Magic Packet
          community.general.wakeonlan:
            mac: "{{ vault_synology_mac }}"
          when:
            - _ping_result.rc != 0
            - not ansible_check_mode

        # Do local housekeeping while Synology boots
        - name: Fix unRAID Backup file permissions
          become: true
          ansible.builtin.file:
            path: "{{ synology_backup_path }}"
            owner: nobody
            group: users
            mode: '0770'
            state: directory
            recurse: true

        - name: Find all files older than {{ synology_cleanup_age }}
          become: true
          ansible.builtin.find:
            paths: "{{ synology_backup_path }}"
            age: "{{ synology_cleanup_age }}"
            recurse: true
          register: _old_files

        - name: Remove files older than {{ synology_cleanup_age }}
          become: true
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ _old_files.files }}"

        - name: Wait for boot
          ansible.builtin.wait_for:
            timeout: "{{ synology_boot_timeout }}"
          delegate_to: localhost
          when: _ping_result.rc != 0

        - name: Trigger Home Assistant DSM automation
          ansible.builtin.uri:
            url: "{{ vault_ha_url }}/api/services/automation/trigger"
            method: POST
            headers:
              Authorization: "Bearer {{ vault_ha_bearer_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              entity_id: "{{ vault_ha_dsm_automation }}"
          delegate_to: localhost
          when: not ansible_check_mode
          no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"

        - name: Wait for NFS service on Synology
          ansible.builtin.wait_for:
            host: "{{ vault_synology_ip }}"
            port: "{{ nfs_port }}"
            timeout: "{{ synology_nfs_timeout }}"
          delegate_to: localhost
          when: not ansible_check_mode

        - name: Mount, Rsync, Unmount Share
          loop: "{{ synology_shares }}"
          register: backup_status
          ignore_errors: true
          changed_when: true
          ansible.builtin.shell: |
            if /usr/local/sbin/rc.unassigned mount {{ vault_synology_name }}:{{ synology_mount_path }}; then
              sleep {{ synology_mount_settle }}
            else
              exit 1
            fi
            MOUNT_POINT=$(awk '$1 == "{{ vault_synology_name }}:{{ synology_mount_path }}" { print $2; exit }' /proc/mounts)
            if [ -z "$MOUNT_POINT" ]; then
              exit 2
            fi
            rsync -a --stats {{ synology_src_base_path }}{{ item }}/ "$MOUNT_POINT"/ --delete-after
            sync
            sleep {{ synology_post_sync_delay }}
            let "n = {{ umount_timeout }}"
            while ! /usr/local/sbin/rc.unassigned umount {{ vault_synology_name }}:{{ synology_mount_path }}; do
              if [ "$n" -eq 0 ]; then
                exit 3
              fi
              let "n--"
              sleep {{ synology_umount_retry_delay }}
            done
            exit 0

      rescue:
        - name: Set sync failed flag
          ansible.builtin.set_fact:
            sync_failed: true

      always:
        - name: Shutdown Synology via Home Assistant
          ansible.builtin.uri:
            url: "{{ vault_ha_url }}/api/services/button/press"
            method: POST
            headers:
              Authorization: "Bearer {{ vault_ha_bearer_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              entity_id: "{{ vault_ha_shutdown_button }}"
          delegate_to: localhost
          when: not ansible_check_mode
          no_log: "{{ not (debug_no_log | default(false) | bool) and (ansible_verbosity | default(0) | int < 3) }}"

        - name: Verify Synology has shut down
          ansible.builtin.shell: "ping -c 1 -W 2 {{ vault_synology_ip }}"
          delegate_to: localhost
          register: _shutdown_ping
          until: _shutdown_ping.rc != 0
          retries: 12
          delay: 10
          failed_when: false
          changed_when: false
          when: not ansible_check_mode

        - name: Log Synology shutdown verification
          ansible.builtin.debug:
            msg: >-
              {{ 'Synology confirmed offline' if _shutdown_ping.rc | default(1) != 0
                 else 'WARNING: Synology still responding after shutdown request' }}
          when: not ansible_check_mode

        - name: Send notification for each sync result
          include_tasks: tasks/notify.yaml
          loop: "{{ backup_status.results }}"
          loop_control:
            loop_var: _sync_result
          when: not ansible_check_mode
          vars:
            discord_name: "{{ backup_name }}"
            discord_operation: "Sync"
            discord_status: "{{ 'failed' if _sync_result.rc != 0 else 'successful' }}"
            discord_color: "{{ discord_color_success if _sync_result.rc == 0 else discord_color_failure }}"
            discord_url: "{{ backup_url }}"
            discord_fields:
              - name: "{{ '❌ ' if _sync_result.rc != 0 else '✅ ' }}{{ _sync_result.item }}"
                value: >-
                  {{ 'FAILED' if _sync_result.rc != 0 else
                     (((_sync_result.stdout | default('') |
                        regex_search('Total transferred file size: ([\d,]+)', '\1') |
                        default(['0'], true) | first | replace(',', '')) | float
                        / 1024 / 1024) | round(2) | string + ' MB') }}
                inline: true

        - name: Send notification for pre-sync failure
          include_tasks: tasks/notify.yaml
          when: sync_failed
          vars:
            discord_name: "{{ backup_name }}"
            discord_operation: "Sync"
            discord_status: "failed"
            discord_detail: "check Semaphore logs"
            discord_color: "{{ discord_color_failure }}"
            discord_url: "{{ backup_url }}"

        - name: Log sync results to MariaDB
          include_tasks: tasks/log_mariadb.yaml
          loop: "{{ backup_status.results }}"
          loop_control:
            loop_var: _sync_result
          when: not ansible_check_mode
          vars:
            log_table: backups
            log_application: "{{ backup_name }}"
            log_hostname: "{{ inventory_hostname }}"
            log_file_name: "{{ ('FAILED_' if _sync_result.rc != 0 else '') }}sync_{{ _sync_result.item }}_{{ ansible_date_time.date }}"
            log_file_size: >-
              {{ ((_sync_result.stdout | default('') |
                   regex_search('Total transferred file size: ([\d,]+)', '\1') |
                   default(['0'], true) | first | replace(',', '')) | float
                   / 1024 / 1024) | round(2) }}
            log_backup_level: "offline"

        - name: Log pre-sync failure to MariaDB
          include_tasks: tasks/log_mariadb.yaml
          when: sync_failed and backup_status.results | length == 0
          vars:
            log_table: backups
            log_application: "{{ backup_name }}"
            log_hostname: "{{ inventory_hostname }}"
            log_file_name: "FAILED_sync_{{ ansible_date_time.date }}"
            log_file_size: "0"
            log_backup_level: "offline"

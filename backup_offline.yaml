---
# Category: Backup
# Schedule: weekly (template 26)
# Sync backups to offline Synology storage.
# Wakes Synology via WOL, mounts single NFS share, rsyncs each source
# into a subfolder, unmounts, shuts down Synology, verifies shutdown.
# Sends notification + logs to MariaDB.
#
# Required extra vars:
#   hosts_variable  — inventory group to target (pre-filled by Semaphore environment)
#
# Optional extra vars:
#   synology_skip_shutdown=true  — leave Synology running after sync (for testing)
#   synology_share_name=<name>   — override Synology NFS share name (default: Offline)
#
# Usage:
#   ansible-playbook backup_offline.yaml -e hosts_variable=unraid
#   ansible-playbook backup_offline.yaml -e hosts_variable=unraid -e synology_skip_shutdown=true

- name: Sync backups to offline Synology storage
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  hosts: "{{ hosts_variable }}"
  vars_files:
    - vars/secrets.yaml
    - "vars/configs/{{ config_file }}.yaml"
    - vars/configs/synology.yaml
  vars:
    config_file: "{{ hosts_variable }}"
  pre_tasks:
    - name: Set offline backup name
      ansible.builtin.set_fact:
        backup_name: "Synology"

    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_assert_config_file: true
        pre_playbook: "backup_offline.yaml"

  tasks:
    - name: Initialize sync state
      ansible.builtin.set_fact:
        sync_failed: false
        _sync_results: []
        _nfs_path: "{{ vault_synology_name }}:{{ synology_mount_path }}"

    - block:
        - name: Check if Synology online
          ansible.builtin.command: ping -c 2 {{ vault_synology_ip }}
          delegate_to: localhost
          failed_when: false  # pre-flight probe — Synology may be offline; WoL handles it next
          register: _ping_result
          changed_when: false
          check_mode: false

        - name: Send Wake-On-LAN Magic Packet
          community.general.wakeonlan:
            mac: "{{ vault_synology_mac }}"
          when:
            - _ping_result.rc != 0
            - not ansible_check_mode

        # Do local housekeeping while Synology boots
        - name: Fix unRAID Backup file permissions
          become: true
          ansible.builtin.file:
            path: "{{ synology_backup_path }}"
            owner: nobody
            group: users
            mode: '0770'
            state: directory
            recurse: true

        - name: Find all files older than {{ synology_cleanup_age }}
          become: true
          ansible.builtin.find:
            paths: "{{ synology_backup_path }}"
            age: "{{ synology_cleanup_age }}"
            recurse: true
          register: _old_files

        - name: Remove files older than {{ synology_cleanup_age }}
          become: true
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ _old_files.files }}"

        - name: Wait for boot
          ansible.builtin.wait_for:
            timeout: "{{ synology_boot_timeout }}"
          delegate_to: localhost
          when: _ping_result.rc != 0

        - name: Reload Synology DSM integration in Home Assistant
          ansible.builtin.uri:
            url: "{{ vault_ha_url }}/api/services/homeassistant/reload_config_entry"
            method: POST
            headers:
              Authorization: "Bearer {{ vault_ha_bearer_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              entry_id: "{{ vault_ha_dsm_entry_id }}"
          delegate_to: localhost
          when: not ansible_check_mode
          no_log: "{{ _no_log }}"

        - name: Wait for NFS service on Synology
          ansible.builtin.wait_for:
            host: "{{ vault_synology_ip }}"
            port: "{{ nfs_port }}"
            timeout: "{{ synology_nfs_timeout }}"
          delegate_to: localhost
          when: not ansible_check_mode

        # === Mount single NFS share ===
        - name: Mount NFS share
          become: true
          ansible.builtin.shell: /usr/local/sbin/rc.unassigned mount {{ _nfs_path }}
          register: _mount_result

        - name: Wait for mount to settle
          ansible.builtin.pause:
            seconds: "{{ synology_mount_settle }}"

        - name: Discover mount point
          ansible.builtin.shell: >-
            grep -F "{{ _nfs_path }}" /proc/mounts | awk '{ print $2; exit }'
          register: _mount_point_raw
          changed_when: false
          retries: 3
          delay: 5
          until: _mount_point_raw.stdout | trim | length > 0

        - name: Assert mount point found
          ansible.builtin.assert:
            that: _mount_point_raw.stdout | trim | length > 0
            fail_msg: "NFS share {{ _nfs_path }} mounted but mount point not found in /proc/mounts"

        - name: Set mount point fact
          ansible.builtin.set_fact:
            _mount_point: "{{ _mount_point_raw.stdout | trim }}"

        # === Rsync each share as subfolder ===
        - name: Rsync share to Synology
          become: true
          ansible.builtin.shell: |
            rsync -a --stats {{ synology_src_base_path }}{{ item }}/ "{{ _mount_point }}/{{ item }}/" --delete-after 2>&1
          loop: "{{ synology_shares }}"
          register: _rsync_results
          ignore_errors: true  # best-effort — individual share sync may fail; others continue
          loop_control:
            label: "{{ item }}"

        - name: Collect sync results
          ansible.builtin.set_fact:
            _sync_results: "{{ _rsync_results.results }}"

        - name: Flush writes to disk
          ansible.builtin.command: sync
          changed_when: false

        - name: Wait for writes to settle
          ansible.builtin.pause:
            seconds: "{{ synology_post_sync_delay }}"

        # === Unmount ===
        - name: Unmount NFS share
          become: true
          ansible.builtin.shell: |
            n={{ umount_timeout }}
            while ! /usr/local/sbin/rc.unassigned umount {{ _nfs_path }}; do
              if [ "$n" -eq 0 ]; then exit 1; fi
              n=$((n - 1))
              sleep {{ synology_umount_retry_delay }}
            done
          register: _umount_result

        - name: Set sync_failed if any share failed
          ansible.builtin.set_fact:
            sync_failed: "{{ _sync_results | selectattr('rc', 'ne', 0) | list | length > 0 }}"

      rescue:
        - name: Set sync failed flag
          ansible.builtin.set_fact:
            sync_failed: true

        - name: Best-effort unmount on failure
          become: true
          ansible.builtin.shell: /usr/local/sbin/rc.unassigned umount {{ _nfs_path }}
          ignore_errors: true  # best-effort — cleanup after failure; share may not be mounted
          when: _mount_result is defined and _mount_result is not failed

      always:
        - name: Shutdown Synology via Home Assistant
          ansible.builtin.uri:
            url: "{{ vault_ha_url }}/api/services/button/press"
            method: POST
            headers:
              Authorization: "Bearer {{ vault_ha_bearer_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              entity_id: "{{ vault_ha_shutdown_button }}"
          delegate_to: localhost
          when:
            - not ansible_check_mode
            - not (synology_skip_shutdown | default(false) | bool)
          no_log: "{{ _no_log }}"

        - name: Verify Synology has shut down
          ansible.builtin.shell: "ping -c 1 -W 2 {{ vault_synology_ip }}"
          delegate_to: localhost
          register: _shutdown_ping
          until: _shutdown_ping.rc != 0
          retries: 12
          delay: 10
          changed_when: false
          failed_when: _shutdown_ping.rc == 0
          when:
            - not ansible_check_mode
            - not (synology_skip_shutdown | default(false) | bool)

        - name: Log Synology shutdown verification
          ansible.builtin.debug:
            msg: >-
              {{ 'Synology confirmed offline' if _shutdown_ping.rc | default(1) != 0
                 else 'FAILED: Synology still responding after shutdown request — check HA entity ' ~ vault_ha_shutdown_button }}
          when:
            - not ansible_check_mode
            - not (synology_skip_shutdown | default(false) | bool)

        - name: Log skip-shutdown mode
          ansible.builtin.debug:
            msg: "Synology left running (synology_skip_shutdown=true)"
          when: synology_skip_shutdown | default(false) | bool

        - name: Send notification for each sync result
          include_tasks: tasks/notify.yaml
          loop: "{{ _sync_results }}"
          loop_control:
            loop_var: _sync_result
          when:
            - not ansible_check_mode
            - _sync_results | length > 0
          vars:
            discord_name: "{{ backup_name }}"
            discord_operation: "Sync"
            discord_status: "{{ 'failed' if _sync_result.rc != 0 else 'successful' }}"
            discord_color: "{{ discord_color_success if _sync_result.rc == 0 else discord_color_failure }}"
            discord_url: "{{ backup_url }}"
            discord_fields:
              - name: "{{ '❌ ' if _sync_result.rc != 0 else '✅ ' }}{{ _sync_result.item }}"
                value: >-
                  {{ 'FAILED' if _sync_result.rc != 0 else
                     (((_sync_result.stdout | default('') |
                        regex_search('Total transferred file size: ([\d,]+)', '\1') |
                        default(['0'], true) | first | replace(',', '')) | float
                        / 1024 / 1024) | round(2) | string + ' MB') }}
                inline: true

        - name: Send notification for pre-sync failure
          include_tasks: tasks/notify.yaml
          when: sync_failed and _sync_results | length == 0
          vars:
            discord_name: "{{ backup_name }}"
            discord_operation: "Sync"
            discord_status: "failed"
            discord_detail: "check Semaphore logs"
            discord_color: "{{ discord_color_failure }}"
            discord_url: "{{ backup_url }}"

        - name: Log sync results to MariaDB
          include_tasks: tasks/log_mariadb.yaml
          loop: "{{ _sync_results }}"
          loop_control:
            loop_var: _sync_result
          when:
            - not ansible_check_mode
            - _sync_results | length > 0
          vars:
            log_table: backups
            log_application: "{{ backup_name }}"
            log_hostname: "{{ inventory_hostname }}"
            log_file_name: "{{ ('FAILED_' if _sync_result.rc != 0 else '') }}sync_{{ _sync_result.item }}_{{ ansible_facts.date_time.date }}"
            log_file_size: >-
              {{ ((_sync_result.stdout | default('') |
                   regex_search('Total transferred file size: ([\d,]+)', '\1') |
                   default(['0'], true) | first | replace(',', '')) | float
                   / 1024 / 1024) | round(2) }}
            log_backup_level: "offline"

        - name: Log pre-sync failure to MariaDB
          include_tasks: tasks/log_mariadb.yaml
          when: sync_failed and _sync_results | length == 0
          vars:
            log_table: backups
            log_application: "{{ backup_name }}"
            log_hostname: "{{ inventory_hostname }}"
            log_file_name: "FAILED_sync_{{ ansible_facts.date_time.date }}"
            log_file_size: "0"
            log_backup_level: "offline"

        - name: Fail play if sync failed
          ansible.builtin.fail:
            msg: "Offline sync failed — see notification for details"
          when: sync_failed

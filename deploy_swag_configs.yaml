---
# Category: Deploy
# Schedule: none
# Generate SWAG reverse proxy site-confs from definitions-as-code.
# Reads proxy metadata from container_definitions (homelab.proxy.* labels + proxy: keys)
# and host/vm_definitions (proxy: dicts), resolves upstream IPs via the stack→host→vm_ip
# chain (filter_plugins/service_catalog.py), renders Jinja2 templates, and deploys to the
# SWAG container on the auth stack host. Site-confs it did not generate are removed, except
# swag_unmanaged_keep.
#
# Optional extra vars:
#   dry_run=true  — write to /tmp/swag-generated/ instead of live SWAG dir (default: false)
#
# Usage:
#   ansible-playbook deploy_swag_configs.yaml
#   ansible-playbook deploy_swag_configs.yaml -e dry_run=true
#   ansible-playbook deploy_swag_configs.yaml --diff --check   # show diffs only

- name: Generate SWAG reverse proxy configs
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: ['!all', 'date_time']

  vars_files:
    # NOTE: container_definitions.yaml is NOT listed here — it is loaded raw via
    # a pre_task (Python YAML → JSON) to avoid Ansible templating {{ docker_* }}
    # env values inside it. Those vars come from docker_stacks.yaml, which has
    # derived vars (stack_assignments) that fail on implicit localhost in Ansible
    # ≤2.18 (Semaphore's version as of 2026-03).
    #
    # vm_definitions.yaml and host_definitions.yaml ARE loaded via vars_files
    # because their {{ vault_* }} refs resolve fine. proxmox.yaml provides
    # vm_hosted_slot_base needed by vm_definitions.yaml.
    #
    # If Semaphore upgrades to Ansible ≥2.20, this workaround can be removed:
    # add container_definitions.yaml + docker_stacks.yaml to vars_files and
    # delete the pre_tasks.
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/host_definitions.yaml
    - vars/definitions/stack_definitions.yaml
    - vars/configs/proxmox.yaml
    - vars/configs/semaphore_check.yaml
    - vars/secrets.yaml

  vars:
    swag_config_dir: "{{ _swag_output_dir }}"
    _swag_output_dir: "{{ '/tmp/swag-generated' if (dry_run | default(false) | bool) else '/opt/swag/nginx/site-confs' }}"
    # Resolve the SWAG host dynamically: find which VM role has the 'auth' stack
    # (SWAG lives in the auth stack), then get its VM IP.
    _swag_host: >-
      {%- set ns = namespace(host='') -%}
      {%- for r, rdef in vm_definitions.items() -%}
        {%- if rdef.stacks is defined and 'auth' in rdef.stacks and not ns.host -%}
          {%- set ns.host = rdef.vm_ip -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.host }}
    # Resolve the SWAG host role name so container proxies on the same VM
    # can use Docker container names instead of the VM IP (avoids hairpin NAT).
    _swag_role: >-
      {%- set ns = namespace(role='') -%}
      {%- for r, rdef in vm_definitions.items() -%}
        {%- if rdef.stacks is defined and 'auth' in rdef.stacks and not ns.role -%}
          {%- set ns.role = r -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.role }}
    maintenance_name: "SWAG"
    maintenance_type: "Local"
    maintenance_subtype: "Deploy"
    # site-confs the prune below must never delete. swagdashboard.conf is not a proxy:
    # it is the swag-dashboard mod's own page (port 81 + swagdashboard.*, LAN-only),
    # read by the Homepage SWAG tile.
    swag_unmanaged_keep:
      - swagdashboard.conf

  pre_tasks:
    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_playbook: "deploy_swag_configs.yaml"
        pre_hostname: "{{ controller_fqdn }}"

    # Workaround for Ansible ≤2.18 on Semaphore (see vars_files comment above).
    # Loads container_definitions.yaml as raw YAML so {{ docker_* }} env values
    # stay as literal strings instead of being templated.
    - name: Load container definitions without templating env values
      ansible.builtin.command:
        cmd: "python3 -c \"import yaml,json; print(json.dumps(yaml.safe_load(open('vars/definitions/container_definitions.yaml')).get('container_definitions', {})))\""
      register: _raw_container_defs
      changed_when: false

    # Deliberately NOT named container_definitions: a set_fact outranks a later play's
    # vars_files, so under the canonical name this raw (untemplated) copy leaked into every
    # play chained after it by apply_full.yaml — silently turning {{ vault_* }} in other
    # playbooks' container_definitions fields into literal text (reproduced 2026-09-19).
    - name: Set swag_container_definitions fact
      ansible.builtin.set_fact:
        swag_container_definitions: "{{ _raw_container_defs.stdout | from_json }}"

  tasks:
    - name: Initialize deploy state
      ansible.builtin.set_fact:
        deploy_failed: false
        _deploy_detail: ""

    - block:
        # Upstream resolution lives in filter_plugins/service_catalog.py, shared with
        # the Homepage generator and docs. Order: label, proxy_key, host, vm.
        - name: Build proxy configs from the service catalog
          ansible.builtin.set_fact:
            _all_proxies: "{{ swag_container_definitions | swag_proxies(vm_definitions, host_definitions, _swag_role) }}"

        - name: Show proxy config count
          ansible.builtin.debug:
            msg: >-
              Found {{ _all_proxies | length }} proxy configs
              ({{ _all_proxies | selectattr('source', 'eq', 'label') | list | length }} label,
              {{ _all_proxies | selectattr('source', 'eq', 'proxy_key') | list | length }} complex,
              {{ _all_proxies | selectattr('source', 'eq', 'host_def') | list | length }} host,
              {{ _all_proxies | selectattr('source', 'eq', 'vm_def') | list | length }} vm)

        - name: Validate all proxies have upstream IPs
          ansible.builtin.assert:
            that:
              - item.upstream_ip | default('') | length > 0 or
                (item.locations | map(attribute='upstream_app', default='') | select | list | length > 0)
            fail_msg: "Proxy '{{ item.name }}' ({{ item.subdomain }}) has no upstream IP — check stack/definition mapping"
            quiet: true
          loop: "{{ _all_proxies }}"
          loop_control:
            label: "{{ item.subdomain }}"

        # All file/docker tasks delegate to the SWAG host (core VM) via SSH.
        # With hosts: localhost + connection: local, delegated tasks inherit the
        # local connection — ansible_connection: ssh must be set explicitly.
        # The SSH key is provided by Semaphore (--private-key); vm_user comes
        # from proxmox.yaml. If Semaphore upgrades to Ansible ≥2.20, the
        # connection override may no longer be needed (test before removing).
        - name: Create output directory (dry-run)
          ansible.builtin.file:
            path: "{{ _swag_output_dir }}"
            state: directory
            mode: "0755"
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"
          when: dry_run | default(false) | bool

        - name: Generate site-conf files
          ansible.builtin.template:
            src: templates/swag_site.conf.j2
            dest: "{{ _swag_output_dir }}/{{ item.subdomain }}.conf"
            owner: "911"
            group: "911"
            mode: "0664"
          loop: "{{ _all_proxies }}"
          loop_control:
            label: "{{ item.subdomain }}.conf"
          register: _generated_configs
          # --diff --check on the CLI enables diff mode for this task automatically
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"

        # Catch-all vhost for unmatched Host headers (bare domain, scanners hitting IPs
        # directly). See templates/swag_default.conf.j2 for why this is managed
        # separately from the per-subdomain proxy loop above.
        - name: Generate default (catch-all) site-conf
          ansible.builtin.template:
            src: templates/swag_default.conf.j2
            dest: "{{ _swag_output_dir }}/default.conf"
            owner: "911"
            group: "911"
            mode: "0664"
          register: _generated_default
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"

        # Anything in site-confs this playbook didn't generate is an orphan (a removed
        # service, a hand-made conf). nginx loads every *.conf, so orphans keep serving
        # stale routes. Remove them, except the keep-list. *.sample files are ignored.
        - name: Find site-confs on the SWAG host
          ansible.builtin.find:
            paths: "{{ _swag_output_dir }}"
            patterns: "*.conf"
          register: _existing_confs
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"
          when: not (dry_run | default(false) | bool)

        - name: Remove orphaned site-confs
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{ (_existing_confs.files | default([]) | map(attribute='path') | list)
               | reject('search', '/(' ~ (_managed_confs | map('regex_escape') | join('|')) ~ ')$')
               | list }}
          register: _pruned_confs
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"
            _managed_confs: >-
              {{ (_all_proxies | map(attribute='subdomain') | map('regex_replace', '$', '.conf') | list)
                 + ['default.conf'] + swag_unmanaged_keep }}
          when: not (dry_run | default(false) | bool)

        - name: Record deploy detail
          ansible.builtin.set_fact:
            _deploy_detail: >-
              {{ _all_proxies | length }} configs generated |
              {{ (_generated_configs.results | selectattr('changed') | list | length)
                 + (1 if _generated_default is changed else 0) }} changed |
              {{ _pruned_confs.results | default([]) | selectattr('changed') | map(attribute='item') | map('basename') | list
                 | join(', ') | default('none', true) }} pruned

        - name: Report changes
          ansible.builtin.debug:
            msg: >-
              Generated {{ _all_proxies | length }} site-confs + default.conf.
              {{ (_generated_configs.results | selectattr('changed') | list | length)
                 + (1 if _generated_default is changed else 0) }} changed.
              Pruned: {{ _pruned_confs.results | default([]) | selectattr('changed') | map(attribute='item') | map('basename') | list
                 | join(', ') | default('none', true) }}.
        - name: Validate nginx configuration
          ansible.builtin.command:
            cmd: docker exec swag nginx -t
          register: _nginx_test
          changed_when: false
          failed_when: _nginx_test.rc != 0
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"
          when:
            - not (dry_run | default(false) | bool)
            - not ansible_check_mode
            - (_generated_configs is changed) or (_generated_default is changed) or (_pruned_confs is changed)

        - name: Reload nginx
          ansible.builtin.command:
            cmd: docker exec swag nginx -s reload
          changed_when: true
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"
          when:
            - not (dry_run | default(false) | bool)
            - not ansible_check_mode
            - (_generated_configs is changed) or (_generated_default is changed) or (_pruned_confs is changed)
            - _nginx_test is succeeded

        # Canary: nginx returns rc 0 even when it silently ignores duplicate server_names
        # (orphaned/legacy site-confs), so a plain `nginx -t` hides them. Surface them here —
        # non-failing — so future duplicates show up in the deploy output + Discord notice
        # instead of drifting unnoticed. Runs every deploy (catches out-of-band confs too).
        - name: Check for conflicting server names (duplicate/orphaned site-confs)
          ansible.builtin.shell:
            cmd: "docker exec swag nginx -t 2>&1 | grep 'conflicting server name' || true"
          register: _nginx_conflicts
          changed_when: false
          delegate_to: "{{ _swag_host }}"
          become: true
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vm_user }}"
          when:
            - not (dry_run | default(false) | bool)
            - not ansible_check_mode

        - name: Surface conflicting server names (non-failing)
          ansible.builtin.set_fact:
            _deploy_detail: "{{ _deploy_detail }} | ⚠️ {{ _conflict_lines | length }} conflicting server name(s) — check for duplicate/orphaned site-confs"
          vars:
            _conflict_lines: "{{ (_nginx_conflicts.stdout | default('')).splitlines() | select | list }}"
          when:
            - _nginx_conflicts is defined
            - (_nginx_conflicts.stdout | default('') | trim) | length > 0

        - name: Warn on conflicting server names
          ansible.builtin.debug:
            msg: >-
              ⚠️ nginx is ignoring duplicate server_names (orphaned/legacy site-confs):
              {{ _nginx_conflicts.stdout_lines | default([]) }}
          when:
            - _nginx_conflicts is defined
            - (_nginx_conflicts.stdout | default('') | trim) | length > 0

      rescue:
        - name: Set failure flag
          ansible.builtin.set_fact:
            deploy_failed: true
            _deploy_detail: "{{ _deploy_detail }} | Error: {{ ansible_failed_result.msg | default('unknown') }}"

      always:
        - name: Send notification
          include_tasks: tasks/notify.yaml
          vars:
            discord_name: "{{ maintenance_name }}"
            discord_operation: "Deploy"
            discord_status: "{{ 'failed' if deploy_failed else 'successful' }}"
            discord_color: "{{ discord_color_failure if deploy_failed else discord_color_success }}"
            discord_url: "{{ semaphore_ext_url }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "{{ '❌ ' if deploy_failed else '✅ ' }}Deploy"
                value: "{{ _deploy_detail }}"
                inline: true

        - name: Log to MariaDB
          include_tasks: tasks/log_mariadb.yaml
          vars:
            log_table: maintenance
            log_hostname: "{{ controller_fqdn }}"
            log_application: "{{ maintenance_name }}"
            log_type: "{{ maintenance_type }}"
            log_subtype: "{{ maintenance_subtype }}"
            log_status: "{{ 'failed' if deploy_failed else 'success' }}"

        - name: Fail play if deploy errored
          ansible.builtin.fail:
            msg: "SWAG config deploy failed — see notification for details"
          when: deploy_failed

# ═══════════════════════════════════════════════════════════════════
# Monitoring — register / clean up in Beszel (best effort, see tasks/beszel_hook.yaml)
# ═══════════════════════════════════════════════════════════════════
- name: "Sync Beszel monitoring"
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/host_definitions.yaml
    - vars/configs/beszel.yaml
  vars:
    playbook_name: "deploy_swag_configs.yaml"
    beszel_hook_prune: false
  tasks:
    - name: Resolve Semaphore task URL for notifications
      ansible.builtin.include_tasks: tasks/resolve_semaphore_task.yaml

    - name: Register / clean up monitoring
      ansible.builtin.include_tasks: tasks/beszel_hook.yaml

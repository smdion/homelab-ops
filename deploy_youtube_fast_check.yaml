---
# Category: Utilities
# Schedule: none
# Deploys files/youtube_fast_check.py to the metube host (liberty) and registers it
# as a unRAID User Scripts entry. Re-run whenever the script changes.
#
# This intentionally does NOT set the cron schedule — User Scripts' schedule.json /
# customSchedule.cron are regenerated by its own PHP backend when the schedule is
# saved via its GUI, and reproducing that mechanism in Ansible risks writing state
# the plugin doesn't actually pick up. After the first run, open unRAID's User
# Scripts plugin, find "youtube-fast-check", and set its schedule once by hand
# (Custom, e.g. */10 * * * *). See files/youtube_fast_check.py's header for the
# full design: it runs a single stateless-between-invocations pass each cron tick,
# entirely via `docker exec` into the existing metube container — metube's own
# process/entrypoint is never modified, so a bad run there can never affect it.
#
# Required extra vars:
#   hosts_variable — inventory group/host to target (use "liberty")
#
# Usage:
#   ansible-playbook deploy_youtube_fast_check.yaml -e hosts_variable=liberty

- name: Deploy YouTube fast-discovery check
  hosts: "{{ hosts_variable }}"
  gather_facts: false

  vars:
    metube_appdata_dir: "/mnt/user/appdata/youtube-dl"
    user_scripts_dir: "/boot/config/plugins/user.scripts/scripts/youtube-fast-check"

  tasks:
    - name: Ensure metube scripts directory exists
      become: true
      ansible.builtin.file:
        path: "{{ metube_appdata_dir }}/scripts"
        state: directory
        mode: "0755"

    - name: Deploy youtube_fast_check.py
      become: true
      ansible.builtin.copy:
        src: files/youtube_fast_check.py
        dest: "{{ metube_appdata_dir }}/scripts/youtube_fast_check.py"
        mode: "0755"

    - name: Ensure User Scripts entry directory exists
      become: true
      ansible.builtin.file:
        path: "{{ user_scripts_dir }}"
        state: directory
        mode: "0700"

    # Matches the file layout/permissions of existing User Scripts entries (e.g.
    # "Fix RealIP") exactly: 0600, not executable — the plugin's startCustom.php
    # bash-execs the content itself rather than relying on the execute bit.
    - name: Set User Scripts display name
      become: true
      ansible.builtin.copy:
        content: "youtube-fast-check"
        dest: "{{ user_scripts_dir }}/name"
        mode: "0600"

    # User Scripts overwrites log.txt fresh on every run, so it can only ever show
    # the latest invocation. The persistent, size-capped log youtube_fast_check.py
    # writes to /configs/youtube_fast/ lives inside the metube container, which
    # log.txt (on the unRAID host) has no visibility into — so after each run we
    # tail that file into this run's own output, making recent history show up in
    # the User Scripts GUI's "View Log" without needing a separate viewer.
    - name: Deploy User Scripts wrapper
      become: true
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          docker exec metube python3 /configs/scripts/youtube_fast_check.py
          echo "--- recent history (youtube_fast_check.log, last 200 lines) ---"
          docker exec metube tail -n 200 /configs/youtube_fast/youtube_fast_check.log
        dest: "{{ user_scripts_dir }}/script"
        mode: "0600"

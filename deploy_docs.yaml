---
# Category: Deploy
# Schedule: none
# Deploy homelab-docs MkDocs site to the docs container on the dev VM.
# The local /opt/homelab-docs (bind-mounted into code-server at /workspace/homelab-docs)
# is the source of truth. Generates auto-pages from homelab-ops, builds with mkdocs,
# and the site/ directory is served directly by the docs container.
#
# The homelab-docs repo lives at /opt/homelab-docs on the dev VM (bind-mounted
# into code-server at /workspace/homelab-docs). The docs Nginx container serves
# /opt/homelab-docs/site as its webroot.
#
# Required extra vars:
#   hosts_variable        — inventory group (pre-filled by Semaphore environment)
#
# Scope selectors:
#   stack=<name>          — deploy a single stack (auto-resolves host)
#   role=<name>           — deploy all stacks in a role (auto-resolves host)
#
# Usage:
#   ansible-playbook deploy_docs.yaml -e hosts_variable=docker_stacks -e stack=dev

- name: Deploy homelab-docs site
  hosts: "{{ hosts_variable }}"
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  serial: 1
  vars_files:
    - vars/secrets.yaml
    - vars/configs/proxmox.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/host_definitions.yaml
    - vars/definitions/app_definitions.yaml
    - vars/definitions/container_definitions.yaml
    - vars/configs/{{ config_file }}.yaml
    - vars/configs/semaphore_check.yaml
  vars:
    config_file: "{{ hosts_variable }}"
    maintenance_name: "Docs"
    maintenance_type: "Servers"
    maintenance_subtype: "Deploy"
    _docs_dir: "{{ docker_appsdir }}/homelab-docs"
    _ops_dir: "{{ docker_appsdir }}/homelab-ops"

  pre_tasks:
    - name: Resolve scope (role injection + stack/role filtering)
      include_tasks: tasks/resolve_scope.yaml

    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_playbook: "deploy_docs.yaml"
        pre_hostname: "{{ inventory_hostname }}"

  tasks:
    - name: Initialize deploy state
      ansible.builtin.set_fact:
        deploy_failed: false
        _deploy_detail: ""

    - block:
        # ── Install Python dependencies ──────────────────────────────
        - name: Install mkdocs-material and dependencies
          ansible.builtin.pip:
            requirements: "{{ _docs_dir }}/requirements.txt"
            extra_args: "--break-system-packages"

        # ── Generate auto-generated pages ────────────────────────────
        - name: Run generate_docs.py
          ansible.builtin.command:
            cmd: "python3 {{ _docs_dir }}/scripts/generate_docs.py {{ _ops_dir }}"
            chdir: "{{ _docs_dir }}"
          environment:
            SEMAPHORE_DB_HOST: "{{ vault_logging_db_host }}"
            SEMAPHORE_DB_PORT: "{{ vault_logging_db_port }}"
            SEMAPHORE_DB_USER: "{{ vault_logging_db_user }}"
            SEMAPHORE_DB_PASSWORD: "{{ vault_logging_db_password }}"
            SEMAPHORE_DB_NAME: "{{ semaphore_db_name | default('semaphore') }}"
          changed_when: true

        # ── Build MkDocs site ────────────────────────────────────────
        - name: Build MkDocs site
          ansible.builtin.command:
            cmd: "python3 -m mkdocs build --strict"
            chdir: "{{ _docs_dir }}"
          register: _mkdocs_build
          changed_when: true

        - name: Check for MkDocs build warnings
          ansible.builtin.set_fact:
            _mkdocs_warnings: >-
              {{ (_mkdocs_build.stderr_lines | default([]))
                 | select('search', 'WARNING')
                 | list }}

        # ── Verify ───────────────────────────────────────────────────
        - name: Verify site built
          ansible.builtin.stat:
            path: "{{ _docs_dir }}/site/index.html"
          register: _site_index
          failed_when: not _site_index.stat.exists


      rescue:
        - name: Record failure
          ansible.builtin.set_fact:
            deploy_failed: true
            _deploy_detail: "{{ ansible_failed_result.msg | default(ansible_failed_task.name | default('unknown')) }}"

    # ── Notification ─────────────────────────────────────────────────
    - name: Send notification
      include_tasks: tasks/notify.yaml
      vars:
        discord_name: "{{ maintenance_name }}"
        discord_operation: "Deploy"
        discord_status: >-
          {{ 'failed' if deploy_failed
             else ('partial' if (_mkdocs_warnings | default([]) | length > 0)
             else 'successful') }}
        discord_detail: >-
          {{ _deploy_detail if deploy_failed
             else (_mkdocs_warnings | length | string ~ ' build warning(s)')
                  if (_mkdocs_warnings | default([]) | length > 0)
             else '' }}
        discord_color: >-
          {{ discord_color_failure if deploy_failed
             else (discord_color_warning if (_mkdocs_warnings | default([]) | length > 0)
             else discord_color_success) }}
        discord_url: "{{ semaphore_ext_url }}"
        discord_author: "{{ controller_fqdn }}"
        discord_fields: >-
          {{ [{'name': ('⚠️ MkDocs Warnings' if (_mkdocs_warnings | default([]) | length > 0) else '✅ Build'),
               'value': (_mkdocs_warnings | join('\n') if (_mkdocs_warnings | default([]) | length > 0)
                         else 'Docs site built and deployed'),
               'inline': false}] }}
      when: _is_semaphore | default(false)

    - name: Fail play if deploy failed
      ansible.builtin.fail:
        msg: "Deploy failed: {{ _deploy_detail }}"
      when: deploy_failed

---
# Category: Maintain
# Health Maintenance Playbook
# ---------------------------
# Comprehensive environment health monitor. Runs checks across all SSH-accessible
# hosts and the Semaphore/DB environment, then sends alerts and logs results.
#
# Play 1 (localhost):  Init, load state, Semaphore API check, stale backup DB check,
#                      backup size anomaly, failed maintenance DB check,
#                      stale maintenance check, MariaDB health, WAN connectivity,
#                      appliance reachability, schedule coverage,
#                      schedule drift, UniFi device health
# Play 2 (SSH hosts):  Per-host system metrics — disk, memory, CPU, journal errors,
#                      OOM kills, Docker health, SMART disk health, PVE cluster quorum,
#                      Ceph health, APT repo health (PVE only), SSL certificate expiry, NTP sync,
#                      DNS resolution, unRAID array, PBS datastore, ZFS pool,
#                      BTRFS health, Docker HTTP, known_hosts completeness
# Play 3 (localhost):  Aggregate findings, unreachable host alerting,
#                      alerts per host, DB logging, save state
#
# Hosts covered by Play 2: defined by health_check_groups in vars/configs/semaphore_check.yaml
# Appliances (pikvm, unifi_network, unifi_protect) — covered via stale backup detection + UniFi API
#
# Required variables (vars/secrets.yaml):
#   vault_semaphore_api_token, vault_semaphore_host_url
#   vault_discord_webhook_id, vault_discord_webhook_token
#   vault_logging_db_host, vault_logging_db_port, vault_logging_db_user, vault_logging_db_password, vault_logging_db_name
#   vault_domain_local, vault_domain_ext
#
# Threshold variables (vars/configs/semaphore_check.yaml — all have defaults):
#   health_disk_warn_pct, health_disk_crit_pct, health_mem_warn_pct
#   health_cpu_load_multiplier, health_journal_errors_max
#   health_oom_kills_max, health_backup_stale_days
#   health_ssl_warn_days, health_ssl_crit_days
#   health_maintenance_stale_days, health_db_connections_warn_pct
#   health_wan_url, health_ntp_max_offset_ms, health_dns_hostname
#   health_backup_size_min_pct, appliance_check_hosts, appliance_check_port

# ═══════════════════════════════════════════════════════════════════════════════
# PLAY 1 — LOCALHOST: INIT + SEMAPHORE/DB CHECKS
# ═══════════════════════════════════════════════════════════════════════════════
- name: Check health — run DB and API checks
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/configs/semaphore_check.yaml
    - vars/configs/schedule_baseline.yaml
  vars:
    project_id: "{{ semaphore_project_id }}"
    task_count: 20
    maintenance_name: "Semaphore"
    maintenance_type: "Local"
    maintenance_subtype: "Health Check"
    maintenance_url: "{{ semaphore_ext_url }}"
    maintenance_description: "Scheduled health monitoring checks"

  pre_tasks:
    - name: Run standard pre-flight assertions
      include_tasks: tasks/pre_task_assertions.yaml
      vars:
        pre_playbook: "maintain_health.yaml"
        pre_hostname: "{{ controller_fqdn }}"

  tasks:

    # ── INIT ──────────────────────────────────────────────────────────────────
    - name: Initialize state
      ansible.builtin.set_fact:
        maintenance_failed: false
        play1_health_results: []   # list of {check_name, status, value, detail}

    - name: Load last check timestamp from DB
      block:
        - name: Query last check time
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: "SELECT DATE_FORMAT(last_check, '%%Y-%%m-%%dT%%H:%%i:%%sZ') AS last_check FROM health_check_state WHERE id = 1"
          register: _state_result
          no_log: "{{ _no_log }}"
          changed_when: false
          check_mode: false

        - name: Set last check from DB
          ansible.builtin.set_fact:
            last_check: "{{ _state_result.query_result[0][0].last_check }}"
          when: _state_result.query_result[0] | length > 0

        - name: Set default last check (1 hour ago — no DB row)
          ansible.builtin.set_fact:
            last_check: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(now(utc=true).timestamp() | int - 3600) }}"
          when: _state_result.query_result[0] | length == 0

    # ── CHECK 1: Semaphore failed tasks ───────────────────────────────────────
    - name: Check Semaphore for failed tasks
      block:
        - name: Get recent tasks from Semaphore
          ansible.builtin.uri:
            url: "{{ semaphore_url }}/api/project/{{ project_id }}/tasks/last?count={{ task_count }}"
            method: GET
            headers:
              Authorization: "Bearer {{ vault_semaphore_api_token }}"
              Accept: "application/json"
            return_content: true
            status_code: 200
          register: _tasks_response
          retries: 3
          delay: 5
          until: _tasks_response is succeeded
          no_log: "{{ _no_log }}"

        - name: Parse API response
          ansible.builtin.set_fact:
            tasks_list: "{{ _tasks_response.content | from_json }}"

        # Build failure list using a loop so we can normalize each task's 'end'
        # timestamp before comparison. Semaphore may return +00:00 suffix while
        # last_check uses Z — both are UTC but sort differently as strings.
        - name: Identify new failed tasks
          ansible.builtin.set_fact:
            new_failures: "{{ new_failures | default([]) + [item] }}"
          loop: "{{ tasks_list | selectattr('status', 'equalto', 'error') | selectattr('end', 'defined') | list }}"
          loop_control:
            label: "Task #{{ item.id }}"
          when: (item.end | regex_replace('\\+00:00$', 'Z')) > last_check

        - name: Initialize new_failures if no error tasks
          ansible.builtin.set_fact:
            new_failures: "{{ new_failures | default([]) }}"

        - name: Show results
          ansible.builtin.debug:
            msg: "Last check: {{ last_check }} | New failures: {{ new_failures | length }}"

        - name: Send alert per failed task
          include_tasks: tasks/notify.yaml
          loop: "{{ new_failures }}"
          loop_control:
            label: "Task #{{ item.id }}"
          when: new_failures | length > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "Task Alert"
            discord_status: "failed"
            discord_color: "{{ discord_color_failure }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Template"
                value: "{{ item.tpl_alias | default('Unknown') }}"
                inline: true
              - name: "Playbook"
                value: "{{ item.tpl_playbook | default('N/A') }}"
                inline: true
              - name: "Project"
                value: "Project {{ project_id }}"
                inline: true
              - name: "Triggered By"
                value: "{{ item.user_name | default('Scheduler / API') }}"
                inline: true
              - name: "Started"
                value: "{{ item.start | default('N/A') }}"
                inline: true
              - name: "Ended"
                value: "{{ item.end | default('N/A') }}"
                inline: true
              - name: "Task ID"
                value: "[#{{ item.id }}]({{ semaphore_ext_url }}/api/project/{{ project_id }}/tasks/{{ item.id }}/raw_output)"
                inline: true
            discord_footer:
              text: "Semaphore Alert"
            discord_timestamp: "{{ item.end | default(item.start) | default(now(utc=true) | string) }}"

        - name: Record Semaphore check result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'semaphore_tasks',
                'status': ('critical' if new_failures | length > 0 else 'ok'),
                'value': (new_failures | length | string + ' failed'),
                'detail': (new_failures | map(attribute='tpl_alias') | join(', ') if new_failures | length > 0 else 'no failures')
              }] }}

      rescue:
        - name: Set maintenance failed (Semaphore check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 1 FAILED: Semaphore task check error — skipping"

    # ── CHECK 2: Stale backups ─────────────────────────────────────────────────
    - name: Check for stale backups
      block:
        - name: Query for hosts with no backup in last {{ health_backup_stale_days }} days
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: >-
              SELECT CONCAT(hostname, '\t',
              DATE_FORMAT(CONVERT_TZ(MAX(timestamp), '+00:00', %s), '%%m/%%d/%%Y %%l:%%i %%p'), '\t',
              TIMESTAMPDIFF(HOUR, MAX(timestamp), UTC_TIMESTAMP()), 'h ago') AS line
              FROM backups GROUP BY hostname
              HAVING TIMESTAMPDIFF(HOUR, MAX(timestamp), UTC_TIMESTAMP()) > %s
              ORDER BY TIMESTAMPDIFF(HOUR, MAX(timestamp), UTC_TIMESTAMP()) DESC
            positional_args:
              - "{{ display_timezone }}"
              - "{{ health_backup_stale_days * 24 }}"
          register: _stale_backup_result
          no_log: "{{ _no_log }}"
          changed_when: false
          check_mode: false

        - name: Parse stale backup results
          ansible.builtin.set_fact:
            stale_backup_lines: "{{ _stale_backup_result.query_result[0] | map(attribute='line') | list }}"

        - name: Send alert for stale backups
          include_tasks: tasks/notify.yaml
          when: stale_backup_lines | length > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "Backup Check"
            discord_status: "warning"
            discord_detail: "{{ stale_backup_lines | length }} host(s) stale over {{ health_backup_stale_days }} days"
            discord_color: "{{ discord_color_warning }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Host / Last backup / Age"
                value: "{{ stale_backup_lines | join('\n') }}"
            discord_footer:
              text: "ansible_logging backup check"
            discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Record stale backup check result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'stale_backup',
                'status': ('warning' if stale_backup_lines | length > 0 else 'ok'),
                'value': (stale_backup_lines | length | string + ' stale'),
                'detail': (stale_backup_lines | join(' | ') if stale_backup_lines | length > 0 else 'all hosts current')
              }] }}

      rescue:
        - name: Set maintenance failed (stale backup check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 2 FAILED: Stale backup check error — skipping"

    # ── CHECK 3: Backup size anomaly detection ──────────────────────────────────
    - name: Check for backup size anomalies
      block:
        - name: Query for anomalously small backups
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: >-
              SELECT b.application, b.hostname, b.file_size,
                     ROUND(avg_tbl.avg_size, 2) AS avg_size
              FROM backups b
              INNER JOIN (
                SELECT application, hostname, AVG(file_size) AS avg_size, COUNT(*) AS cnt
                FROM backups
                WHERE timestamp > UTC_TIMESTAMP() - INTERVAL {{ backup_trend_days }} DAY
                GROUP BY application, hostname
                HAVING cnt >= 3
              ) avg_tbl ON b.application = avg_tbl.application AND b.hostname = avg_tbl.hostname
              WHERE b.id IN (
                SELECT MAX(id) FROM backups GROUP BY application, hostname
              )
              AND b.file_size < avg_tbl.avg_size * %s / 100
            positional_args:
              - "{{ health_backup_size_min_pct }}"
          register: _size_anomaly_raw
          check_mode: false
          no_log: "{{ _no_log }}"

        - name: Filter excluded applications from size anomaly results
          vars:
            _filtered: >-
              {{ _size_anomaly_raw.query_result[0]
                 | rejectattr('application', 'in', health_backup_size_exclude | default([])) | list }}
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'backup_size_anomaly',
                'status': 'warning' if (_filtered | length > 0) else 'ok',
                'value': (_filtered | length | string) + ' anomalies' if (_filtered | length > 0) else 'normal',
                'detail': _filtered | map(attribute='application') | join(', ') if (_filtered | length > 0) else ''
              }] }}

      rescue:
        - name: Set maintenance failed (backup size anomaly check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 3 FAILED: Backup size anomaly check error — skipping"

    # ── CHECK 4: Failed maintenance runs ──────────────────────────────────────
    - name: Check for failed maintenance
      block:
        - name: Query maintenance table for failures since last check
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: >-
              SELECT CONCAT(application, ' on ', hostname, ' (', type, '/', subtype, ')') AS line
              FROM maintenance
              WHERE status = 'failed'
              AND timestamp > STR_TO_DATE(%s, '%%Y-%%m-%%dT%%H:%%i:%%sZ')
              ORDER BY timestamp DESC
            positional_args:
              - "{{ last_check }}"
          register: _failed_maintenance_result
          no_log: "{{ _no_log }}"
          changed_when: false
          check_mode: false

        - name: Parse failed maintenance results
          ansible.builtin.set_fact:
            failed_maintenance_lines: "{{ _failed_maintenance_result.query_result[0] | map(attribute='line') | list }}"

        - name: Send alert for failed maintenance runs
          include_tasks: tasks/notify.yaml
          when: failed_maintenance_lines | length > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "Maintenance Check"
            discord_status: "warning"
            discord_detail: "{{ failed_maintenance_lines | length }} failure(s) since last health check"
            discord_color: "{{ discord_color_warning }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Failed runs"
                value: "{{ failed_maintenance_lines | join('\n') }}"
            discord_footer:
              text: "ansible_logging maintenance check"
            discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Record failed maintenance check result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'failed_maintenance',
                'status': ('warning' if failed_maintenance_lines | length > 0 else 'ok'),
                'value': (failed_maintenance_lines | length | string + ' failed'),
                'detail': (failed_maintenance_lines | join(' | ') if failed_maintenance_lines | length > 0 else 'no failures')
              }] }}

      rescue:
        - name: Set maintenance failed (maintenance check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 4 FAILED: Failed maintenance check error — skipping"

    # ── CHECK 5: Stale maintenance runs ─────────────────────────────────────────
    - name: Check for stale maintenance
      block:
        - name: Query for hosts with no successful maintenance in {{ health_maintenance_stale_days }} days
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: >-
              SELECT CONCAT(hostname, ' — last: ',
              DATE_FORMAT(CONVERT_TZ(MAX(timestamp), '+00:00', %s), '%%m/%%d %%l:%%i %%p')) AS line
              FROM maintenance WHERE status = 'success'
              AND subtype NOT IN ('Build', 'Validate Deploy')
              GROUP BY hostname
              HAVING MAX(timestamp) < UTC_TIMESTAMP() - INTERVAL %s DAY
              ORDER BY MAX(timestamp) ASC
            positional_args:
              - "{{ display_timezone }}"
              - "{{ health_maintenance_stale_days }}"
          register: _stale_maintenance_result
          no_log: "{{ _no_log }}"
          changed_when: false
          check_mode: false

        - name: Parse stale maintenance results
          ansible.builtin.set_fact:
            stale_maintenance_lines: "{{ _stale_maintenance_result.query_result[0] | map(attribute='line') | list }}"

        - name: Record stale maintenance check result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'stale_maintenance',
                'status': ('warning' if stale_maintenance_lines | length > 0 else 'ok'),
                'value': (stale_maintenance_lines | length | string + ' stale'),
                'detail': (stale_maintenance_lines | join(' | ') if stale_maintenance_lines | length > 0 else 'all hosts current')
              }] }}

      rescue:
        - name: Set maintenance failed (stale maintenance check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 5 FAILED: Stale maintenance check error — skipping"

    # ── CHECK 6: MariaDB internal health ─────────────────────────────────────────
    - name: Check MariaDB health
      block:
        - name: Check MariaDB connection usage
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: "SELECT @@max_connections AS max_conn, (SELECT COUNT(*) FROM information_schema.PROCESSLIST) AS current_conn"
          register: _mariadb_conn_result
          no_log: "{{ _no_log }}"
          changed_when: false
          check_mode: false

        - name: Calculate connection percentage
          ansible.builtin.set_fact:
            _db_max: "{{ _mariadb_conn_result.query_result[0][0].max_conn | int }}"
            _db_current: "{{ _mariadb_conn_result.query_result[0][0].current_conn | int }}"

        - name: Compute connection percent
          ansible.builtin.set_fact:
            _db_pct: "{{ ((_db_current | int / _db_max | int) * 100) | round(1) }}"

        - name: Check for crashed tables
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = %s AND TABLE_COMMENT LIKE '%%crashed%%'"
            positional_args:
              - "{{ vault_logging_db_name }}"
          register: _crashed_tables_result
          no_log: "{{ _no_log }}"
          changed_when: false
          check_mode: false

        - name: Parse crashed tables
          ansible.builtin.set_fact:
            _crashed_tables: "{{ _crashed_tables_result.query_result[0] | map(attribute='TABLE_NAME') | list }}"

        - name: Record MariaDB health result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'mariadb_health',
                'status': (
                  'critical' if _crashed_tables | length > 0
                  else ('warning' if _db_pct | float >= health_db_connections_warn_pct else 'ok')
                ),
                'value': _db_current | string + '/' + _db_max | string + ' connections' + (', ' + _crashed_tables | length | string + ' crashed' if _crashed_tables | length > 0 else ''),
                'detail': (
                  ('crashed: ' + _crashed_tables | join(', ') if _crashed_tables | length > 0 else '')
                  + (' | ' if _crashed_tables | length > 0 and _db_pct | float >= health_db_connections_warn_pct else '')
                  + (_db_pct | string + '% of max_connections' if _db_pct | float >= health_db_connections_warn_pct else '')
                )
              }] }}

      rescue:
        - name: Set maintenance failed (MariaDB health check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 6 FAILED: MariaDB health check error — skipping"

    # ── CHECK 7: WAN connectivity ────────────────────────────────────────────────
    - name: Check WAN connectivity
      block:
        - name: Test outbound internet connectivity
          ansible.builtin.uri:
            url: "{{ health_wan_url }}"
            method: GET
            status_code: 200
            timeout: 10
          register: _wan_result
          retries: 3
          delay: 5
          until: _wan_result is succeeded

        - name: Record WAN connectivity result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'wan_connectivity',
                'status': 'ok',
                'value': 'connected',
                'detail': ''
              }] }}

      rescue:
        - name: Record WAN connectivity failure
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'wan_connectivity',
                'status': 'critical',
                'value': 'unreachable',
                'detail': 'failed to reach ' + health_wan_url
              }] }}

    # ── CHECK 8: Appliance reachability ──────────────────────────────────────────
    # Appliances (PiKVM, UDMP, UNVR) lack SSH access so Play 2 can't check them.
    # This TCP connect test provides faster outage detection than stale backup alerts.
    - name: Check appliance reachability
      when: appliance_check_hosts | default([]) | length > 0
      block:
        - name: Test TCP connectivity to appliance hosts
          ansible.builtin.wait_for:
            host: "{{ item }}"
            port: "{{ appliance_check_port | default(443) }}"
            timeout: 5
          loop: "{{ appliance_check_hosts }}"
          loop_control:
            label: "{{ item }}"
          register: _appliance_results
          ignore_errors: true  # observational — appliance reachability; failure triggers individual alert

        - name: Identify unreachable appliances
          ansible.builtin.set_fact:
            _unreachable_appliances: >-
              {{ _appliance_results.results
                 | selectattr('failed', 'defined')
                 | selectattr('failed')
                 | map(attribute='item')
                 | list }}

        - name: Send alert for unreachable appliances
          include_tasks: tasks/notify.yaml
          when: _unreachable_appliances | length > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "Appliance Check"
            discord_status: "failed"
            discord_detail: "{{ _unreachable_appliances | length }} appliance(s) did not respond"
            discord_color: "{{ discord_color_failure }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Unreachable"
                value: "{{ _unreachable_appliances | join(', ') }}"
            discord_footer:
              text: "Health Check"
            discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Record appliance reachability result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'appliance_reachable',
                'status': ('critical' if _unreachable_appliances | length > 0 else 'ok'),
                'value': (_unreachable_appliances | length | string + ' unreachable') if _unreachable_appliances | length > 0 else 'all reachable',
                'detail': _unreachable_appliances | join(', ') if _unreachable_appliances | length > 0 else ''
              }] }}

      rescue:
        - name: Set maintenance failed (appliance check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 8 FAILED: Appliance reachability check error — skipping"

    # ── CHECK 28: Semaphore schedule coverage ──────────────────────────────────
    # Verifies every Semaphore template has at least one active schedule.
    # Templates whose playbook contains "# Schedule: none" are fully exempt
    # (ad-hoc, manual, one-time, or on-demand playbooks).
    # Templates whose playbook contains "# Schedule-exempt: <pattern>" are
    # exempt only when the template name contains <pattern> (for shared
    # playbooks where only some variants are blocked).
    - name: Check Semaphore schedule coverage
      block:
        - name: Get all templates from Semaphore
          ansible.builtin.uri:
            url: "{{ semaphore_url }}/api/project/{{ project_id }}/templates"
            method: GET
            headers:
              Authorization: "Bearer {{ vault_semaphore_api_token }}"
              Accept: "application/json"
            return_content: true
            status_code: 200
          register: _sched_templates
          no_log: "{{ _no_log }}"

        - name: Get all schedules from Semaphore
          ansible.builtin.uri:
            url: "{{ semaphore_url }}/api/project/{{ project_id }}/schedules"
            method: GET
            headers:
              Authorization: "Bearer {{ vault_semaphore_api_token }}"
              Accept: "application/json"
            return_content: true
            status_code: 200
          register: _sched_schedules
          no_log: "{{ _no_log }}"

        - name: Build set of template IDs with active schedules
          ansible.builtin.set_fact:
            _scheduled_ids: >-
              {{ (_sched_schedules.content | from_json)
                 | selectattr('active', 'defined')
                 | selectattr('active')
                 | map(attribute='template_id')
                 | map('int') | list | unique }}

        - name: Identify templates missing schedules (excluding exempt playbooks)
          ansible.builtin.set_fact:
            _missing_schedules: "{{ _missing_schedules | default([]) + [item] }}"
          loop: "{{ _sched_templates.content | from_json }}"
          loop_control:
            label: "{{ item.name }}"
          vars:
            _pb_content: "{{ lookup('file', playbook_dir + '/' + item.playbook, errors='ignore') | default('') }}"
            _exempt_patterns: "{{ _pb_content | regex_findall(schedule_exempt_pattern ~ '\\s*(.+)') | map('trim') | list }}"
          when:
            - (item.id | int) not in _scheduled_ids
            - schedule_exempt_marker not in _pb_content
            - _exempt_patterns | select('in', item.name) | list | length == 0

        - name: Initialize missing schedules if all covered
          ansible.builtin.set_fact:
            _missing_schedules: "{{ _missing_schedules | default([]) }}"

        - name: Show schedule coverage results
          ansible.builtin.debug:
            msg: "Templates: {{ (_sched_templates.content | from_json) | length }} | Scheduled: {{ _scheduled_ids | length }} | Missing: {{ _missing_schedules | length }}"

        - name: Send alert for missing schedules
          include_tasks: tasks/notify.yaml
          when: _missing_schedules | length > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "Schedule Coverage"
            discord_status: "warning"
            discord_detail: "{{ _missing_schedules | length }} template(s) missing active schedule"
            discord_color: "{{ discord_color_warning }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Missing"
                value: "{{ _missing_schedules | map(attribute='name') | join(', ') }}"
            discord_footer:
              text: "Health Check"
            discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Record schedule coverage result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'schedule_coverage',
                'status': ('warning' if _missing_schedules | length > 0 else 'ok'),
                'value': (_missing_schedules | length | string + ' missing') if _missing_schedules | length > 0 else 'all covered',
                'detail': _missing_schedules | map(attribute='name') | join(', ') if _missing_schedules | length > 0 else ''
              }] }}

      rescue:
        - name: Set maintenance failed (schedule coverage error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 28 FAILED: Schedule coverage check error — skipping"

    # ── CHECK 28b: Schedule drift detection ────────────────────────────────────
    # Compares live Semaphore schedules against the Git-tracked baseline in
    # vars/configs/schedule_baseline.yaml. Detects unauthorized additions,
    # removals, or cron expression changes. Warning-level (not critical).
    - name: Check schedule drift against baseline
      block:
        - name: Get all templates from Semaphore (drift check)
          ansible.builtin.uri:
            url: "{{ semaphore_url }}/api/project/{{ project_id }}/templates"
            method: GET
            headers:
              Authorization: "Bearer {{ vault_semaphore_api_token }}"
              Accept: "application/json"
            return_content: true
            status_code: 200
          register: _drift_templates
          no_log: "{{ _no_log }}"

        - name: Get all schedules from Semaphore (drift check)
          ansible.builtin.uri:
            url: "{{ semaphore_url }}/api/project/{{ project_id }}/schedules"
            method: GET
            headers:
              Authorization: "Bearer {{ vault_semaphore_api_token }}"
              Accept: "application/json"
            return_content: true
            status_code: 200
          register: _drift_schedules
          no_log: "{{ _no_log }}"

        - name: Build template ID-to-name map
          ansible.builtin.set_fact:
            _drift_template_map: >-
              {{ dict((_drift_templates.content | from_json)
                 | map(attribute='id') | map('int') | list
                 | zip((_drift_templates.content | from_json)
                 | map(attribute='name') | list)) }}

        - name: Filter active live schedules
          ansible.builtin.set_fact:
            _drift_active_schedules: >-
              {{ (_drift_schedules.content | from_json)
                 | selectattr('active', 'defined')
                 | selectattr('active')
                 | list }}

        - name: Build live schedule keys (template_name||cron)
          ansible.builtin.set_fact:
            _drift_live_named: >-
              {{ _drift_active_schedules
                 | map(attribute='template_id')
                 | map('int')
                 | map('extract', _drift_template_map)
                 | zip(_drift_active_schedules | map(attribute='cron_format'))
                 | map('join', '||')
                 | list }}

        - name: Build baseline schedule keys
          ansible.builtin.set_fact:
            _drift_baseline_keys: >-
              {{ schedule_baseline
                 | map(attribute='template_name')
                 | list
                 | zip(schedule_baseline | map(attribute='cron_expression') | list)
                 | map('join', '||')
                 | list }}

        - name: Detect drift — added schedules (in live but not baseline)
          ansible.builtin.set_fact:
            _drift_added: >-
              {{ _drift_live_named | difference(_drift_baseline_keys)
                 | map('regex_replace', '\|\|', ' @ ')
                 | list }}

        - name: Detect drift — removed schedules (in baseline but not live)
          ansible.builtin.set_fact:
            _drift_removed: >-
              {{ _drift_baseline_keys | difference(_drift_live_named)
                 | map('regex_replace', '\|\|', ' @ ')
                 | list }}

        - name: Calculate total drift
          ansible.builtin.set_fact:
            _drift_total: "{{ (_drift_added | length) + (_drift_removed | length) }}"

        - name: Show schedule drift results
          ansible.builtin.debug:
            msg: "Baseline: {{ schedule_baseline | length }} | Live: {{ _drift_active_schedules | length }} | Added: {{ _drift_added | length }} | Removed: {{ _drift_removed | length }}"

        - name: Send alert for schedule drift
          include_tasks: tasks/notify.yaml
          when: _drift_total | int > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "Schedule Drift"
            discord_status: "warning"
            discord_detail: "{{ _drift_total }} schedule(s) differ from Git baseline"
            discord_color: "{{ discord_color_warning }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Added (not in baseline)"
                value: "{{ _drift_added | join(', ') if _drift_added | length > 0 else 'none' }}"
              - name: "Removed (missing from live)"
                value: "{{ _drift_removed | join(', ') if _drift_removed | length > 0 else 'none' }}"
            discord_footer:
              text: "Health Check"
            discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Record schedule drift result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'schedule_drift',
                'status': ('check_warning' if _drift_total | int > 0 else 'ok'),
                'value': (_drift_total | string + ' drifted') if _drift_total | int > 0 else 'in sync',
                'detail': ((_drift_added | map('regex_replace', '^', 'added: ') | list + _drift_removed | map('regex_replace', '^', 'removed: ') | list) | join('; ')) if _drift_total | int > 0 else ''
              }] }}

      rescue:
        - name: Set maintenance failed (schedule drift error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 28b FAILED: Schedule drift check error — skipping"

    # ── CHECK 29: UniFi device health ──────────────────────────────────────────
    # Queries the UniFi Network API for adopted device status.
    # Critical if any device is disconnected; warning if firmware updates available.
    # Auto-skipped if vault_unifi_network_api_key is not set.
    - name: Check UniFi device health
      when: vault_unifi_network_api_key | default('') | length > 0
      block:
        - name: Query UniFi Network device status
          ansible.builtin.uri:
            url: "{{ health_unifi_network_url }}/proxy/network/api/s/default/stat/device"
            method: GET
            headers:
              X-API-Key: "{{ vault_unifi_network_api_key }}"
              Accept: "application/json"
            validate_certs: false
            return_content: true
            status_code: 200
            timeout: 10
          register: _unifi_devices
          no_log: "{{ _no_log }}"

        - name: Evaluate UniFi device status
          ansible.builtin.set_fact:
            _unifi_all_devices: "{{ (_unifi_devices.content | from_json).data | default([]) }}"

        - name: Identify disconnected and upgradable devices
          ansible.builtin.set_fact:
            _unifi_disconnected: >-
              {{ _unifi_all_devices
                 | rejectattr('state', 'equalto', 1)
                 | map(attribute='name')
                 | list }}
            _unifi_upgradable: >-
              {{ _unifi_all_devices
                 | selectattr('upgradable', 'defined')
                 | selectattr('upgradable')
                 | map(attribute='name')
                 | list }}

        - name: Send alert for disconnected UniFi devices
          include_tasks: tasks/notify.yaml
          when: _unifi_disconnected | length > 0
          vars:
            discord_name: "Semaphore"
            discord_operation: "UniFi Device Health"
            discord_status: "failed"
            discord_detail: "{{ _unifi_disconnected | length }} device(s) disconnected"
            discord_color: "{{ discord_color_failure }}"
            discord_author: "{{ controller_fqdn }}"
            discord_fields:
              - name: "Disconnected"
                value: "{{ _unifi_disconnected | join(', ') }}"
            discord_footer:
              text: "Health Check"
            discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Record UniFi device health result
          ansible.builtin.set_fact:
            play1_health_results: >-
              {{ play1_health_results + [{
                'check_name': 'unifi_device_health',
                'status': ('critical' if _unifi_disconnected | length > 0
                           else ('warning' if _unifi_upgradable | length > 0 else 'ok')),
                'value': ((_unifi_disconnected | length | string + ' disconnected')
                          if _unifi_disconnected | length > 0
                          else ((_unifi_upgradable | length | string + ' upgradable')
                                if _unifi_upgradable | length > 0 else 'all healthy')),
                'detail': ((_unifi_disconnected | join(', '))
                           if _unifi_disconnected | length > 0
                           else (_unifi_upgradable | join(', ')
                                 if _unifi_upgradable | length > 0 else ''))
              }] }}

        # Log device metrics to unifi_devices table for Grafana dashboards
        - name: Batch log UniFi device metrics to DB
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          become: false
          connection: local
          ansible.mysql.mysql_query:
            login_host: "{{ vault_logging_db_host }}"
            login_port: "{{ vault_logging_db_port }}"
            login_user: "{{ vault_logging_db_user }}"
            login_password: "{{ vault_logging_db_password }}"
            login_db: "{{ vault_logging_db_name }}"
            query: >-
              INSERT INTO unifi_devices
              (device_name, device_model, device_mac, device_ip, device_type, firmware, upgradable, state, uptime_seconds, timestamp)
              VALUES {% for d in _unifi_all_devices %}(%s, %s, %s, %s, %s, %s, %s, %s, %s, UTC_TIMESTAMP()){% if not loop.last %}, {% endif %}{% endfor %}
              ON DUPLICATE KEY UPDATE
                device_model = VALUES(device_model), device_ip = VALUES(device_ip),
                device_type = VALUES(device_type), firmware = VALUES(firmware),
                upgradable = VALUES(upgradable), state = VALUES(state),
                uptime_seconds = VALUES(uptime_seconds), timestamp = UTC_TIMESTAMP()
            positional_args: >-
              {{ _unifi_all_devices | json_query('[].[ name, model, mac, ip, type, version, upgradable, state, uptime ]') | flatten }}
          when:
            - _unifi_all_devices | length > 0
            - not (skip_db | default(false) | bool)
            - not ansible_check_mode
          no_log: "{{ _no_log }}"

      rescue:
        - name: Set maintenance failed (UniFi check error)
          ansible.builtin.set_fact:
            maintenance_failed: true
        - name: Log debug check results
          ansible.builtin.debug:
            msg: "CHECK 29 FAILED: UniFi device health check error — skipping"

# ═══════════════════════════════════════════════════════════════════════════════
# PLAY 2 — SSH HOSTS: SYSTEM METRICS
# ═══════════════════════════════════════════════════════════════════════════════
- name: Check health — gather per-host metrics
  hosts: "{{ health_check_groups | join(':') }}"
  gather_facts: true
  gather_subset: ['!all', 'date_time', 'hardware']
  ignore_unreachable: true
  vars_files:
    - vars/secrets.yaml
    - vars/configs/semaphore_check.yaml
  tasks:

    # If a host is unreachable (ignore_unreachable: true), no tasks run and these
    # vars stay undefined. Play 3 uses `| default(false)` to detect this.
    - name: Initialize host health issue list
      ansible.builtin.set_fact:
        host_health_issues: []   # list of {check_name, status, value, detail}
        host_reachable: true

    # ── CHECK 9: Disk space ───────────────────────────────────────────────────
    - name: Check disk space
      block:
        # Uses df -T + awk for all parsing in shell.
        # awk dynamically finds the Use% column by scanning for ^[0-9]+%$ — this handles
        # ZFS dataset names and mount points that contain spaces (e.g. "Windows Server 2016"),
        # which would shift fixed column indices and cause K-block counts to be read as percentages.
        # Type is always 4 columns before Use% in df -T output.
        # Excludes: tmpfs, devtmpfs, squashfs, overlay (pseudo/read-only filesystems).
        # Excludes /mnt/diskN — unRAID individual array disk mounts (xfs). These are checked
        # individually and cause false positives; /mnt/user (fuse.shfs) gives the meaningful
        # aggregate array usage and is intentionally included.
        # Excludes /mnt/user0 — unRAID direct-access union (duplicate of /mnt/user).
        - name: Get disk usage via awk
          ansible.builtin.shell: |
            df -T | awk -v warn_pct="{{ health_disk_warn_pct }}" '
              NR > 1 {
                pct_col = 0
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^[0-9]+%$/) { pct_col = i; break }
                }
                if (pct_col > 4) {
                  type = $(pct_col - 4)
                  mnt  = $(pct_col + 1)
                  if (type !~ /^(tmpfs|devtmpfs|squashfs|overlay|none)$/ &&
                      mnt  !~ /^\/mnt\/(disk[0-9]|user0)$/) {
                    pct = $pct_col; gsub(/%/, "", pct)
                    if (pct + 0 > max) max = pct + 0
                    if (pct + 0 >= warn_pct) {
                      mount = ""
                      for (j = pct_col + 1; j <= NF; j++)
                        mount = mount (mount ? " " : "") $j
                      detail = detail (detail ? " | " : "") mount " " $pct_col
                    }
                  }
                }
              }
              END { print max + 0; print detail }
            '
          register: _disk_raw
          changed_when: false
          check_mode: false

        - name: Parse disk results
          ansible.builtin.set_fact:
            disk_max_pct: "{{ _disk_raw.stdout_lines[0] | default('0') | int }}"
            disk_detail: "{{ _disk_raw.stdout_lines[1] | default('') }}"

        - name: Record disk space result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'disk_space',
                  'status': (
                    'critical' if disk_max_pct | int >= health_disk_crit_pct
                    else ('warning' if disk_max_pct | int >= health_disk_warn_pct else 'ok')
                  ),
                  'value': (disk_max_pct | string + '%') if disk_max_pct | int > 0 else 'ok',
                  'detail': disk_detail
                }]
              }}

      rescue:
        - name: Record disk check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'disk_space', 'status': 'critical', 'value': 'check_error', 'detail': 'disk check task failed'}] }}

    # ── CHECK 10: Memory pressure ─────────────────────────────────────────────
    - name: Check memory pressure
      block:
        - name: Calculate memory usage percent
          ansible.builtin.set_fact:
            mem_used_pct: >-
              {{
                ((ansible_memory_mb.nocache.used | default(ansible_memory_mb.real.used)) /
                ansible_memory_mb.real.total * 100) | round(1)
              }}

        - name: Record memory result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'memory',
                  'status': 'warning' if mem_used_pct | float >= health_mem_warn_pct else 'ok',
                  'value': mem_used_pct | string + '%',
                  'detail': (
                    mem_used_pct | string + '% used of ' + ansible_memory_mb.real.total | string + 'MB'
                    if mem_used_pct | float >= health_mem_warn_pct else ''
                  )
                }]
              }}

      rescue:
        - name: Record memory check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'memory', 'status': 'critical', 'value': 'check_error', 'detail': 'memory check task failed'}] }}

    # ── CHECK 11: CPU load average ────────────────────────────────────────────
    - name: Check CPU load
      block:
        - name: Read 5-minute load average
          ansible.builtin.shell: awk '{print $2}' /proc/loadavg
          register: _load_raw
          changed_when: false
          check_mode: false

        - name: Evaluate load against threshold
          ansible.builtin.set_fact:
            load_5m: "{{ _load_raw.stdout | float }}"
            load_threshold: "{{ (ansible_facts.processor_vcpus | int * health_cpu_load_multiplier) | round(2) }}"

        - name: Record CPU load result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'cpu_load',
                  'status': 'warning' if load_5m | float > load_threshold | float else 'ok',
                  'value': 'load: ' + load_5m | string + ' / ' + ansible_facts.processor_vcpus | string + ' vCPUs',
                  'detail': (
                    '5m avg ' + load_5m | string + ' exceeds threshold ' + load_threshold | string
                    if load_5m | float > load_threshold | float else ''
                  )
                }]
              }}

      rescue:
        - name: Record CPU load check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'cpu_load', 'status': 'critical', 'value': 'check_error', 'detail': 'cpu check task failed'}] }}

    # ── CHECK 12: Journal errors ──────────────────────────────────────────────
    - name: Check journal errors
      block:
        - name: Count unique journal errors since last check
          ansible.builtin.shell: >
            journalctl -p err
            --since "{{ hostvars['localhost']['last_check'] | replace('T', ' ') | replace('Z', '') }}"
            --no-pager -q 2>/dev/null | sort -u | wc -l
          register: _journal_raw
          changed_when: false
          failed_when: false  # observational — journal error probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record journal error result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'journal_errors',
                  'status': 'warning' if _journal_raw.stdout | int >= health_journal_errors_max else 'ok',
                  'value': _journal_raw.stdout | string + ' errors',
                  'detail': (
                    _journal_raw.stdout | string + ' journal errors since last check'
                    if _journal_raw.stdout | int >= health_journal_errors_max else ''
                  )
                }]
              }}

      rescue:
        - name: Record journal check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'journal_errors', 'status': 'critical', 'value': 'check_error', 'detail': 'journal check task failed'}] }}

    # ── CHECK 13: OOM kills ───────────────────────────────────────────────────
    - name: Check OOM kills
      block:
        - name: Count OOM kill events since last check
          ansible.builtin.shell: >
            journalctl -k
            --since "{{ hostvars['localhost']['last_check'] | replace('T', ' ') | replace('Z', '') }}"
            --no-pager -q 2>/dev/null | grep -c "Out of memory" || true
          register: _oom_count_raw
          changed_when: false
          failed_when: false  # observational — OOM event count; failure recorded in host_health_issues
          check_mode: false

        - name: Get killed process names
          ansible.builtin.shell: >
            journalctl -k
            --since "{{ hostvars['localhost']['last_check'] | replace('T', ' ') | replace('Z', '') }}"
            --no-pager -q 2>/dev/null | grep "Killed process" | awk '{print $NF}' | sort -u | head -5 || true
          register: _oom_procs_raw
          changed_when: false
          failed_when: false  # observational — OOM killed process names; failure recorded in host_health_issues
          check_mode: false
          when: _oom_count_raw.stdout | int >= health_oom_kills_max

        - name: Record OOM kill result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'oom_kills',
                  'status': 'critical' if _oom_count_raw.stdout | int >= health_oom_kills_max else 'ok',
                  'value': _oom_count_raw.stdout | string + ' kills',
                  'detail': (
                    _oom_count_raw.stdout | string + ' OOM kills — '
                    + ('processes: ' + _oom_procs_raw.stdout_lines | join(', ')
                       if (_oom_procs_raw is defined and _oom_procs_raw.stdout_lines | default([]) | length > 0)
                       else 'process names unavailable')
                    if _oom_count_raw.stdout | int >= health_oom_kills_max else ''
                  )
                }]
              }}

      rescue:
        - name: Record OOM check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'oom_kills', 'status': 'critical', 'value': 'check_error', 'detail': 'oom check task failed'}] }}

    # ── CHECK 14: Docker health ───────────────────────────────────────────────
    - name: Check Docker health
      when: inventory_hostname in (groups['docker_stacks'] | default([]) + groups['docker_run'] | default([]))
      block:
        - name: Find stopped containers that should be running
          ansible.builtin.shell: |
            docker ps -a --filter "status=exited" --format "{% raw %}{{.Names}}{% endraw %}" | while read name; do
              policy=$(docker inspect --format "{% raw %}{{.HostConfig.RestartPolicy.Name}}{% endraw %}" "$name" 2>/dev/null)
              if [ "$policy" = "always" ] || [ "$policy" = "unless-stopped" ]; then
                echo "$name"
              fi
            done
          register: _stopped_raw
          changed_when: false
          failed_when: false  # observational — stopped container probe; failure recorded in host_health_issues
          check_mode: false

        - name: Find unhealthy containers
          ansible.builtin.shell: >
            docker ps --filter "health=unhealthy" --format "{% raw %}{{.Names}}{% endraw %}" 2>/dev/null || true
          register: _unhealthy_raw
          changed_when: false
          failed_when: false  # observational — unhealthy container probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record Docker health result
          ansible.builtin.set_fact:
            docker_stopped: "{{ _stopped_raw.stdout_lines | default([]) }}"
            docker_unhealthy: "{{ _unhealthy_raw.stdout_lines | default([]) }}"

        - name: Build Docker result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'docker_health',
                  'status': 'critical' if (docker_stopped | length > 0 or docker_unhealthy | length > 0) else 'ok',
                  'value': (
                    ((docker_stopped[:5] | join(', ') + ' stopped')
                     if docker_stopped | length > 0 else '')
                    + (', ' if docker_stopped | length > 0 and docker_unhealthy | length > 0 else '')
                    + ((docker_unhealthy[:5] | join(', ') + ' unhealthy')
                       if docker_unhealthy | length > 0 else '')
                    if (docker_stopped | length > 0 or docker_unhealthy | length > 0) else 'ok'
                  ),
                  'detail': (
                    (docker_stopped | length | string + ' stopped: ' + docker_stopped[:10] | join(', ')
                     if docker_stopped | length > 0 else '')
                    + (' | ' if docker_stopped | length > 0 and docker_unhealthy | length > 0 else '')
                    + (docker_unhealthy | length | string + ' unhealthy: ' + docker_unhealthy[:10] | join(', ')
                       if docker_unhealthy | length > 0 else '')
                  )
                }]
              }}

      rescue:
        - name: Record Docker check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'docker_health', 'status': 'critical', 'value': 'check_error', 'detail': 'docker check task failed'}] }}

    # Hosts not in docker group get an explicit 'skip' entry so the check is still logged
    - name: Record Docker skipped (non-docker host)
      ansible.builtin.set_fact:
        host_health_issues: >-
          {{ host_health_issues + [{'check_name': 'docker_health', 'status': 'ok', 'value': 'skipped', 'detail': 'not a docker host'}] }}
      when: inventory_hostname not in (groups['docker_stacks'] | default([]) + groups['docker_run'] | default([]))

    # ── CHECK 15: SMART disk health ───────────────────────────────────────────
    - name: Check SMART disk health
      block:
        - name: Ensure smartmontools is installed
          become: true
          ansible.builtin.apt:
            name: smartmontools
            state: present
          when: >-
            inventory_hostname in groups['ubuntu'] | default([]) or
            inventory_hostname in groups['pve'] | default([]) or
            inventory_hostname in groups['pbs'] | default([])
          failed_when: false  # observational — smartmontools install; missing package must not block SMART check

        - name: Check SMART health on all checkable disks
          become: true
          ansible.builtin.shell: |
            if ! command -v smartctl >/dev/null 2>&1; then echo "no_smartctl"; exit 0; fi
            failed=""
            while IFS= read -r dev; do
              result=$(smartctl -H "$dev" 2>/dev/null)
              if echo "$result" | grep -q "FAILED!"; then
                failed="${failed}$(basename "$dev") "
              fi
            done < <(smartctl --scan 2>/dev/null | awk '{print $1}')
            echo "${failed:-ok}"
          register: _smart_raw
          changed_when: false
          failed_when: false  # observational — SMART disk health probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record SMART result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'smart_health',
                  'status': (
                    'ok' if _smart_raw.stdout | trim in ['ok', 'no_smartctl', '']
                    else 'critical'
                  ),
                  'value': (
                    'all ok' if _smart_raw.stdout | trim == 'ok'
                    else ('not installed' if _smart_raw.stdout | trim == 'no_smartctl'
                    else ('not checked' if _smart_raw.stdout | trim == ''
                    else _smart_raw.stdout | trim | split | length | string + ' disk(s) failing'))
                  ),
                  'detail': '' if _smart_raw.stdout | trim in ['ok', 'no_smartctl', ''] else _smart_raw.stdout | trim
                }]
              }}

      rescue:
        - name: Record SMART check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'smart_health', 'status': 'critical', 'value': 'check_error', 'detail': 'smart check task failed'}] }}

    # ── CHECK 16: Proxmox cluster health (PVE nodes only) ─────────────────────
    - name: Check Proxmox cluster health
      when: "'pve' in group_names"
      block:
        - name: Get cluster quorum status
          become: true
          ansible.builtin.shell: pvecm status 2>/dev/null
          register: _pvecm_raw
          changed_when: false
          failed_when: false  # observational — PVE cluster quorum probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse cluster status
          ansible.builtin.set_fact:
            _pvecm_quorate: "{{ _pvecm_raw.stdout | regex_search('Quorate:\\s+Yes') is not none }}"
            _pvecm_total: "{{ _pvecm_raw.stdout | regex_search('Total votes:\\s+(\\d+)', '\\1') | default(['?'], true) | first }}"
            _pvecm_expected: "{{ _pvecm_raw.stdout | regex_search('Expected votes:\\s+(\\d+)', '\\1') | default(['?'], true) | first }}"

        - name: Record cluster health result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'pve_cluster',
                  'status': 'ok' if _pvecm_quorate else 'critical',
                  'value': _pvecm_total + '/' + _pvecm_expected + ' nodes' + (' quorate' if _pvecm_quorate else ' NOT quorate'),
                  'detail': '' if _pvecm_quorate else _pvecm_raw.stdout | truncate(300)
                }]
              }}

      rescue:
        - name: Record cluster check error
          when: "'pve' in group_names"
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'pve_cluster', 'status': 'critical', 'value': 'check_error', 'detail': 'cluster check task failed'}] }}

    # ── CHECK 17: Ceph health (PVE nodes only) ────────────────────────────────
    - name: Check Ceph health
      when: "'pve' in group_names"
      block:
        - name: Get Ceph cluster health
          become: true
          ansible.builtin.shell: |
            if ! command -v ceph >/dev/null 2>&1; then echo "CEPH_NOT_INSTALLED"; exit 0; fi
            if [ ! -s /etc/ceph/ceph.conf ] && [ ! -s /etc/pve/ceph.conf ]; then echo "CEPH_NOT_CONFIGURED"; exit 0; fi
            ceph health 2>/dev/null || echo "CEPH_ERROR"
          register: _ceph_raw
          changed_when: false
          failed_when: false  # observational — Ceph cluster health probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record Ceph health result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'ceph_health',
                  'status': (
                    'ok' if _ceph_raw.stdout | trim in ['HEALTH_OK', 'CEPH_NOT_INSTALLED', 'CEPH_NOT_CONFIGURED']
                    else ('warning' if 'HEALTH_WARN' in _ceph_raw.stdout
                    else 'critical')
                  ),
                  'value': (
                    'not configured' if _ceph_raw.stdout | trim in ['CEPH_NOT_INSTALLED', 'CEPH_NOT_CONFIGURED']
                    else _ceph_raw.stdout | trim | truncate(60)
                  ),
                  'detail': '' if _ceph_raw.stdout | trim in ['HEALTH_OK', 'CEPH_NOT_INSTALLED', 'CEPH_NOT_CONFIGURED'] else _ceph_raw.stdout | trim
                }]
              }}

      rescue:
        - name: Record Ceph check error
          when: "'pve' in group_names"
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'ceph_health', 'status': 'critical', 'value': 'check_error', 'detail': 'ceph check task failed'}] }}

    # ── CHECK 18: PVE APT repository health (PVE nodes only) ─────────────────
    # Detects enterprise repos still active, missing no-subscription repo,
    # malformed .sources files, and duplicate source entries.
    - name: Check PVE APT repository health
      when: "'pve' in group_names or 'pve_standalone' in group_names"
      block:
        - name: Run APT repo health check
          become: true
          ansible.builtin.shell: |
            issues=""

            # Check for active enterprise repos (.sources with Types: + enterprise, no Enabled: false)
            for f in /etc/apt/sources.list.d/pve-enterprise.sources /etc/apt/sources.list.d/ceph.sources; do
              [ -f "$f" ] || continue
              if grep -q '^Types:' "$f" && grep -q 'enterprise' "$f"; then
                if ! grep -qP '^Enabled:\s*(false|no|0)' "$f"; then
                  issues="${issues}enterprise repo active: $(basename $f); "
                fi
              fi
            done

            # Check for active enterprise repos (.list format)
            for f in /etc/apt/sources.list.d/pve-enterprise.list; do
              [ -f "$f" ] || continue
              if grep -qP '^deb\s.*enterprise' "$f"; then
                issues="${issues}enterprise repo active: $(basename $f); "
              fi
            done

            # Check for no-subscription PVE repo
            if ! grep -rlq 'pve-no-subscription' /etc/apt/sources.list.d/ 2>/dev/null; then
              issues="${issues}no pve-no-subscription repo found; "
            fi

            # Check for malformed sources (apt-get check is fast and catches parse errors)
            apt_err=$(apt-get check 2>&1 >/dev/null || true)
            if echo "$apt_err" | grep -qi 'malformed\|could not be read'; then
              issues="${issues}malformed sources: $(echo "$apt_err" | head -1); "
            fi

            # Check for duplicate source warnings
            dup_count=$(apt-get update --print-uris 2>&1 | grep -c 'configured multiple times' || true)
            if [ "$dup_count" -gt 0 ]; then
              issues="${issues}${dup_count} duplicate source warning(s); "
            fi

            if [ -z "$issues" ]; then
              echo "OK"
            else
              echo "$issues"
            fi
          register: _apt_repo_raw
          changed_when: false
          failed_when: false  # observational — APT repo health probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record APT repo health result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'apt_repo_health',
                  'status': ('ok' if _apt_repo_raw.stdout | trim == 'OK'
                    else ('critical' if 'enterprise repo active' in _apt_repo_raw.stdout or 'malformed' in _apt_repo_raw.stdout
                    else 'warning')),
                  'value': ('healthy' if _apt_repo_raw.stdout | trim == 'OK' else _apt_repo_raw.stdout | trim | truncate(60)),
                  'detail': ('' if _apt_repo_raw.stdout | trim == 'OK' else _apt_repo_raw.stdout | trim)
                }]
              }}

      rescue:
        - name: Record APT repo check error
          when: "'pve' in group_names or 'pve_standalone' in group_names"
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'apt_repo_health', 'status': 'critical', 'value': 'check_error', 'detail': 'apt repo check task failed'}] }}

    # ── CHECK 19: SSL certificate expiry ──────────────────────────────────────
    - name: Check SSL certificate expiry
      block:
        - name: Check SSL certificate expiry dates
          become: true
          ansible.builtin.shell: |
            certs=$(find /etc/letsencrypt/live -name "cert.pem" 2>/dev/null)
            if [ -z "$certs" ]; then echo "no_certs"; echo ""; exit 0; fi
            days_min=9999
            expiring=""
            while IFS= read -r cert; do
              [ -z "$cert" ] && continue
              domain=$(basename "$(dirname "$cert")")
              expiry_epoch=$(date -d "$(openssl x509 -enddate -noout -in "$cert" 2>/dev/null | cut -d= -f2)" +%s 2>/dev/null)
              [ -z "$expiry_epoch" ] && continue
              days=$(( (expiry_epoch - $(date +%s)) / 86400 ))
              [ "$days" -lt "$days_min" ] && days_min="$days"
              expiring="${expiring}${domain}:${days}d "
            done <<< "$certs"
            echo "$days_min"
            echo "${expiring:-}"
          register: _ssl_raw
          changed_when: false
          failed_when: false  # observational — SSL certificate expiry probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse SSL cert result
          ansible.builtin.set_fact:
            _ssl_no_certs: "{{ _ssl_raw.stdout_lines[0] | default('no_certs') == 'no_certs' }}"
            _ssl_days: "{{ _ssl_raw.stdout_lines[0] | default('9999') | int }}"
            _ssl_detail: "{{ _ssl_raw.stdout_lines[1] | default('') | trim }}"

        - name: Record SSL cert check
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'ssl_cert',
                  'status': (
                    'ok' if _ssl_no_certs
                    else ('critical' if _ssl_days | int <= health_ssl_crit_days
                    else ('warning' if _ssl_days | int <= health_ssl_warn_days
                    else 'ok'))
                  ),
                  'value': 'no certs' if _ssl_no_certs else _ssl_days | string + ' days',
                  'detail': '' if _ssl_no_certs else _ssl_detail
                }]
              }}

      rescue:
        - name: Record SSL check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'ssl_cert', 'status': 'critical', 'value': 'check_error', 'detail': 'ssl check task failed'}] }}

    # ── CHECK 20: NTP / time sync drift ─────────────────────────────────────────
    - name: Check NTP time sync
      block:
        - name: Check NTP synchronization status
          ansible.builtin.shell: |
            if command -v timedatectl >/dev/null 2>&1; then
              synced=$(timedatectl show --property=NTPSynchronized --value 2>/dev/null || echo "unknown")
              if [ "$synced" = "yes" ]; then
                echo "synced"
              else
                echo "not_synced"
              fi
            elif command -v ntpq >/dev/null 2>&1; then
              offset=$(ntpq -p 2>/dev/null | awk '/^\*/{print $9}')
              if [ -n "$offset" ]; then
                echo "$offset"
              else
                echo "no_peer"
              fi
            else
              echo "no_ntp_tool"
            fi
          register: _ntp_raw
          changed_when: false
          failed_when: false  # observational — NTP sync status probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record NTP sync result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'ntp_sync',
                  'status': (
                    'ok' if _ntp_raw.stdout | trim in ['synced', 'no_ntp_tool']
                    else ('warning' if _ntp_raw.stdout | trim == 'not_synced'
                    else ('warning' if _ntp_raw.stdout | trim == 'no_peer'
                    else ('warning' if (_ntp_raw.stdout | trim | float | abs) > health_ntp_max_offset_ms
                    else 'ok')))
                  ),
                  'value': (
                    'synced' if _ntp_raw.stdout | trim == 'synced'
                    else ('no NTP tool' if _ntp_raw.stdout | trim == 'no_ntp_tool'
                    else ('not synced' if _ntp_raw.stdout | trim == 'not_synced'
                    else ('no peer' if _ntp_raw.stdout | trim == 'no_peer'
                    else _ntp_raw.stdout | trim + 'ms offset')))
                  ),
                  'detail': '' if _ntp_raw.stdout | trim in ['synced', 'no_ntp_tool'] else _ntp_raw.stdout | trim
                }]
              }}

      rescue:
        - name: Record NTP check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'ntp_sync', 'status': 'critical', 'value': 'check_error', 'detail': 'ntp check task failed'}] }}

    # ── CHECK 21: DNS resolution ────────────────────────────────────────────────
    - name: Check DNS resolution
      block:
        - name: Test DNS resolution
          ansible.builtin.shell: "getent hosts {{ health_dns_hostname }} >/dev/null 2>&1 && echo ok || echo fail"
          register: _dns_raw
          changed_when: false
          failed_when: false  # observational — DNS resolution probe; failure recorded in host_health_issues
          check_mode: false

        - name: Record DNS resolution result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'dns_resolution',
                  'status': 'ok' if _dns_raw.stdout | trim == 'ok' else 'critical',
                  'value': 'ok' if _dns_raw.stdout | trim == 'ok' else 'failed',
                  'detail': '' if _dns_raw.stdout | trim == 'ok' else 'cannot resolve ' + health_dns_hostname
                }]
              }}

      rescue:
        - name: Record DNS check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'dns_resolution', 'status': 'critical', 'value': 'check_error', 'detail': 'dns check task failed'}] }}

    # ── CHECK 22: unRAID array health (unRAID only) ─────────────────────────────
    - name: Check unRAID array health
      when: "'unraid' in group_names"
      block:
        - name: Get unRAID array status
          become: true
          ansible.builtin.shell: |
            if ! command -v mdcmd >/dev/null 2>&1; then echo "no_mdcmd"; exit 0; fi
            state=$(mdcmd status 2>/dev/null | grep '^mdState=' | cut -d= -f2)
            ini=/var/local/emhttp/disks.ini
            # Count DISK_DSBL (present but disabled = real problem).
            dsbl=$(grep -c 'status="DISK_DSBL"' "$ini" 2>/dev/null) || dsbl=0
            # Count DISK_NP_DSBL with non-empty id (configured disk went missing = real problem).
            # DISK_NP_DSBL with empty id is just an unassigned slot (e.g. unused parity2).
            missing=$(awk '/^id=/{id=$0} /^status="DISK_NP_DSBL"/{if(id !~ /^id=""$/) c++} END{print c+0}' "$ini")
            echo "${state:-unknown}|$(( dsbl + missing ))"
          register: _unraid_array_raw
          changed_when: false
          failed_when: false  # observational — unRAID array health probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse unRAID array status
          ansible.builtin.set_fact:
            _array_state: "{{ _unraid_array_raw.stdout.split('|')[0] | default('unknown') }}"
            _array_disabled: "{{ _unraid_array_raw.stdout.split('|')[1] | default('0') }}"

        - name: Record unRAID array result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'unraid_array',
                  'status': (
                    'ok' if _array_state == 'STARTED' and _array_disabled | int == 0
                    else ('ok' if _array_state == 'no_mdcmd'
                    else 'critical')
                  ),
                  'value': (
                    'healthy' if _array_state == 'STARTED' and _array_disabled | int == 0
                    else ('not applicable' if _array_state == 'no_mdcmd'
                    else _array_state + ', ' + _array_disabled | string + ' disabled')
                  ),
                  'detail': (
                    '' if (_array_state == 'STARTED' and _array_disabled | int == 0) or _array_state == 'no_mdcmd'
                    else 'state=' + _array_state + ' disabled=' + _array_disabled | string
                  )
                }]
              }}

      rescue:
        - name: Record unRAID array check error
          when: "'unraid' in group_names"
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'unraid_array', 'status': 'critical', 'value': 'check_error', 'detail': 'unraid array check task failed'}] }}

    # ── CHECK 23: PBS datastore health (PBS only) ───────────────────────────────
    - name: Check PBS datastore health
      when: "'pbs' in group_names"
      block:
        - name: List PBS datastores
          become: true
          ansible.builtin.shell: >
            proxmox-backup-manager datastore list --output-format json 2>/dev/null || echo "[]"
          register: _pbs_raw
          changed_when: false
          failed_when: false  # observational — PBS datastore list probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse PBS datastore results
          ansible.builtin.set_fact:
            _pbs_stores: "{{ _pbs_raw.stdout | from_json }}"

        - name: Record PBS datastore result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'pbs_datastore',
                  'status': 'ok' if _pbs_stores | length > 0 else 'warning',
                  'value': _pbs_stores | length | string + ' datastores',
                  'detail': '' if _pbs_stores | length > 0 else 'no datastores found'
                }]
              }}

      rescue:
        - name: Record PBS datastore check error
          when: "'pbs' in group_names"
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'pbs_datastore', 'status': 'critical', 'value': 'check_error', 'detail': 'pbs datastore check task failed'}] }}

    # ── CHECK 24: ZFS pool health ────────────────────────────────────────────────
    - name: Check ZFS pool health
      block:
        - name: Check ZFS pool health status
          become: true
          ansible.builtin.shell: |
            if ! command -v zpool >/dev/null 2>&1; then echo "no_zpool"; exit 0; fi
            pools=$(zpool list -H -o name,health 2>/dev/null)
            if [ -z "$pools" ]; then echo "no_pools"; exit 0; fi
            degraded=""
            while IFS=$'\t' read -r name health; do
              if [ "$health" != "ONLINE" ]; then
                degraded="${degraded}${name}:${health} "
              fi
            done <<< "$pools"
            if [ -n "$degraded" ]; then
              echo "unhealthy|${degraded}"
            else
              count=$(echo "$pools" | wc -l | tr -d ' ')
              echo "ok|${count}"
            fi
          register: _zfs_pool_raw
          changed_when: false
          failed_when: false  # observational — ZFS pool health probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse ZFS pool result
          ansible.builtin.set_fact:
            _zfs_status: "{{ _zfs_pool_raw.stdout.split('|')[0] | default('unknown') }}"
            _zfs_detail: "{{ _zfs_pool_raw.stdout.split('|')[1] | default('') | trim }}"

        - name: Record ZFS pool result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'zfs_pool',
                  'status': (
                    'ok' if _zfs_status in ['ok', 'no_zpool', 'no_pools']
                    else ('warning' if 'DEGRADED' in _zfs_detail
                    else 'critical')
                  ),
                  'value': (
                    'not installed' if _zfs_status == 'no_zpool'
                    else ('no pools' if _zfs_status == 'no_pools'
                    else (_zfs_detail + ' pool(s) healthy' if _zfs_status == 'ok'
                    else _zfs_detail | trim))
                  ),
                  'detail': '' if _zfs_status in ['ok', 'no_zpool', 'no_pools'] else _zfs_detail | trim
                }]
              }}

      rescue:
        - name: Record ZFS pool check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'zfs_pool', 'status': 'critical', 'value': 'check_error', 'detail': 'zfs pool check task failed'}] }}

    # ── CHECK 25: BTRFS filesystem health ────────────────────────────────────────
    - name: Check BTRFS health
      block:
        - name: Check BTRFS device error counters
          become: true
          ansible.builtin.shell: |
            if ! command -v btrfs >/dev/null 2>&1; then echo "no_btrfs"; exit 0; fi
            mounts=$(findmnt -t btrfs -n -o TARGET 2>/dev/null | sort -u)
            if [ -z "$mounts" ]; then echo "no_filesystems"; exit 0; fi
            errors=""
            count=0
            while IFS= read -r mnt; do
              count=$((count + 1))
              stats=$(btrfs device stats "$mnt" 2>/dev/null) || continue
              errs=$(echo "$stats" | awk '$NF+0 > 0 {print $0}')
              if [ -n "$errs" ]; then
                errors="${errors}${mnt}: $(echo "$errs" | wc -l | tr -d ' ') error counters; "
              fi
            done <<< "$mounts"
            if [ -n "$errors" ]; then
              echo "errors|${errors}"
            else
              echo "ok|${count}"
            fi
          register: _btrfs_raw
          changed_when: false
          failed_when: false  # observational — BTRFS device error probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse BTRFS result
          ansible.builtin.set_fact:
            _btrfs_status: "{{ _btrfs_raw.stdout.split('|')[0] | default('unknown') }}"
            _btrfs_detail: "{{ _btrfs_raw.stdout.split('|')[1] | default('') | trim }}"

        - name: Record BTRFS health result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'btrfs_health',
                  'status': (
                    'ok' if _btrfs_status in ['ok', 'no_btrfs', 'no_filesystems']
                    else 'critical'
                  ),
                  'value': (
                    'not installed' if _btrfs_status == 'no_btrfs'
                    else ('no filesystems' if _btrfs_status == 'no_filesystems'
                    else (_btrfs_detail + ' filesystem(s) healthy' if _btrfs_status == 'ok'
                    else 'device errors detected'))
                  ),
                  'detail': '' if _btrfs_status in ['ok', 'no_btrfs', 'no_filesystems'] else _btrfs_detail | trim
                }]
              }}

      rescue:
        - name: Record BTRFS check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'btrfs_health', 'status': 'critical', 'value': 'check_error', 'detail': 'btrfs health check task failed'}] }}

    # ── CHECK 26: Docker container HTTP responsiveness ──────────────────────────
    - name: Check Docker HTTP health
      when: docker_health_endpoints | default([]) | length > 0
      block:
        - name: Check Docker container HTTP endpoints
          ansible.builtin.uri:
            url: "{{ _endpoint.url }}"
            method: GET
            status_code: "{{ _endpoint.status_code | default(200) }}"
            timeout: 10
            validate_certs: "{{ _endpoint.validate_certs | default(true) }}"
          loop: "{{ docker_health_endpoints }}"
          loop_control:
            loop_var: _endpoint
            label: "{{ _endpoint.name }}"
          register: _http_results
          ignore_errors: true  # observational — Docker HTTP endpoint probe; failure recorded in host_health_issues

        - name: Build HTTP health results
          ansible.builtin.set_fact:
            _http_failures: >-
              {{ _http_results.results | default([])
                 | selectattr('failed', 'defined')
                 | selectattr('failed')
                 | map(attribute='_endpoint')
                 | map(attribute='name')
                 | list }}

        - name: Record Docker HTTP result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'docker_http',
                  'status': 'critical' if _http_failures | length > 0 else 'ok',
                  'value': (
                    _http_failures | length | string + ' failing'
                    if _http_failures | length > 0
                    else docker_health_endpoints | length | string + ' endpoints ok'
                  ),
                  'detail': _http_failures | join(', ') if _http_failures | length > 0 else ''
                }]
              }}

      rescue:
        - name: Record Docker HTTP check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'docker_http', 'status': 'critical', 'value': 'check_error', 'detail': 'docker http check task failed'}] }}

    # ── CHECK 27: Docker host /opt orphan entries (docker_stacks only) ────────
    - name: Check for orphan files and directories in /opt
      when: inventory_hostname in (groups['docker_stacks'] | default([]))
      block:
        - name: Discover expected /opt entries from running containers
          ansible.builtin.shell: |
            # Static allowlist (system dirs not owned by any container)
            expected="{{ opt_always_expected | join(' ') }}"
            # Collect all unique top-level /opt entries used by containers
            containers=$(docker ps -aq 2>/dev/null)
            if [ -n "$containers" ]; then
              # Source 1: container mount sources (bind mounts, host paths)
              for src in $(docker inspect --format '{% raw %}{{range .Mounts}}{{.Source}} {{end}}{% endraw %}' $containers 2>/dev/null | tr ' ' '\n' | grep -oP '/opt(/[^/]+)?' | sort -u); do
                # Handle both /opt/subdir mounts and direct /opt mounts
                if [ "$src" = "/opt" ]; then
                  for sub in /opt/*/; do
                    [ -d "$sub" ] && expected="$expected $(basename "$sub")"
                  done
                else
                  expected="$expected $(basename "$src")"
                fi
              done
              # Source 2: homelab.backup.paths labels (catches named-volume bind devices)
              for path in $(docker inspect --format '{% raw %}{{index .Config.Labels "homelab.backup.paths"}}{% endraw %}' $containers 2>/dev/null | tr ',' '\n' | grep -oP '/opt/[^/]+' | sort -u); do
                expected="$expected $(basename "$path")"
              done
            fi
            # Also include stack compose dirs
            if [ -d /opt/stacks ]; then
              for d in /opt/stacks/*/; do
                [ -d "$d" ] && expected="$expected stacks/$(basename "$d")"
              done
            fi
            # Check all top-level entries in /opt (files and directories)
            orphans=""
            for entry in /opt/*; do
              [ ! -e "$entry" ] && continue
              name=$(basename "$entry")
              if ! echo " $expected " | grep -q " $name "; then
                if [ -d "$entry" ]; then
                  orphans="$orphans $name/"
                else
                  orphans="$orphans $name"
                fi
              fi
            done
            echo "${orphans## }"
          register: _opt_orphans_raw
          changed_when: false
          failed_when: false  # observational — /opt orphan entry scan; failure recorded in host_health_issues
          check_mode: false

        - name: Parse orphan results
          ansible.builtin.set_fact:
            _opt_orphans: "{{ _opt_orphans_raw.stdout | default('') | trim | split(' ') | select | list }}"

        - name: Record /opt orphan check result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'opt_orphan_entries',
                  'status': 'warning' if _opt_orphans | length > 0 else 'ok',
                  'value': (_opt_orphans | length | string + ' orphan(s)') if _opt_orphans | length > 0 else 'ok',
                  'detail': _opt_orphans | join(', ') if _opt_orphans | length > 0 else ''
                }]
              }}

      rescue:
        - name: Record /opt orphan check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'opt_orphan_entries', 'status': 'critical', 'value': 'check_error', 'detail': 'opt orphan check task failed'}] }}

    - name: Record /opt orphan check skipped (non-docker_stacks host)
      ansible.builtin.set_fact:
        host_health_issues: >-
          {{ host_health_issues + [{'check_name': 'opt_orphan_entries', 'status': 'ok', 'value': 'skipped', 'detail': 'not a docker_stacks host'}] }}
      when: inventory_hostname not in (groups['docker_stacks'] | default([]))

    # ── CHECK 30: SSH known_hosts completeness ──────────────────────────────
    # Verifies that every other inventory host (short name + FQDN) is present
    # in the ansible user's known_hosts. Read-only — does not modify the file.
    # Active sync is handled by maintain_known_hosts.yaml.
    - name: Check SSH known_hosts completeness
      block:
        - name: Build list of SSH hosts excluding self (same domain only)
          ansible.builtin.set_fact:
            _known_hosts_targets: >-
              {{ (health_check_groups | map('extract', groups) | map('default', []) | flatten | unique)
                 | difference([inventory_hostname])
                 | select('search', inventory_hostname | regex_replace('^[^.]+\\.', ''))
                 | list }}

        - name: Check known_hosts for each target host
          ansible.builtin.shell: |
            missing=""
            for host in {{ (_known_hosts_targets + _known_hosts_targets | map('regex_replace', '\\..*', '') | list) | join(' ') }}; do
              ssh-keygen -F "$host" -f ~/.ssh/known_hosts >/dev/null 2>&1 || missing="$missing $host"
            done
            echo "${missing## }"
          register: _known_hosts_raw
          changed_when: false
          failed_when: false  # observational — known_hosts completeness probe; failure recorded in host_health_issues
          check_mode: false

        - name: Parse missing hosts
          ansible.builtin.set_fact:
            _known_hosts_missing: "{{ _known_hosts_raw.stdout | default('') | trim | split(' ') | select | list }}"

        - name: Record known_hosts completeness result
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{
                host_health_issues + [{
                  'check_name': 'known_hosts',
                  'status': ('warning' if _known_hosts_missing | length > 0 else 'ok'),
                  'value': ((_known_hosts_missing | length | string + ' missing')
                            if _known_hosts_missing | length > 0
                            else (_known_hosts_targets | length | string + ' hosts present')),
                  'detail': _known_hosts_missing | join(', ') if _known_hosts_missing | length > 0 else ''
                }]
              }}

      rescue:
        - name: Record known_hosts check error
          ansible.builtin.set_fact:
            host_health_issues: >-
              {{ host_health_issues + [{'check_name': 'known_hosts', 'status': 'critical', 'value': 'check_error', 'detail': 'known_hosts check task failed'}] }}

# ═══════════════════════════════════════════════════════════════════════════════
# PLAY 3 — LOCALHOST: AGGREGATE, ALERT, LOG, SAVE STATE
# ═══════════════════════════════════════════════════════════════════════════════
- name: Check health — aggregate and alert
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/configs/semaphore_check.yaml
  vars:
    maintenance_name: "Semaphore"
    maintenance_type: "Local"
    maintenance_subtype: "Health Check"
    maintenance_url: "{{ semaphore_ext_url }}"
    maintenance_description: "Scheduled health monitoring checks"
    ssh_hosts: "{{ health_check_groups | map('extract', groups) | map('default', []) | flatten }}"

  tasks:

    - name: Restore Play 1 state
      ansible.builtin.set_fact:
        maintenance_failed: "{{ hostvars['localhost']['maintenance_failed'] | default(false) }}"
        play1_health_results: "{{ hostvars['localhost']['play1_health_results'] | default([]) }}"

    # ── CHECK 28: UNREACHABLE HOST ALERTING ──────────────────────────────────────
    - name: Build unreachable host list
      ansible.builtin.set_fact:
        unreachable_hosts: "{{ unreachable_hosts | default([]) + [item] }}"
      loop: "{{ ssh_hosts }}"
      when: not (hostvars[item]['host_reachable'] | default(false))

    - name: Initialize unreachable_hosts if all reachable
      ansible.builtin.set_fact:
        unreachable_hosts: "{{ unreachable_hosts | default([]) }}"

    - name: Send alert for unreachable hosts
      include_tasks: tasks/notify.yaml
      when: unreachable_hosts | length > 0
      vars:
        discord_name: "Semaphore"
        discord_operation: "Host Check"
        discord_status: "failed"
        discord_detail: "{{ unreachable_hosts | length }} host(s) unreachable via SSH"
        discord_color: "{{ discord_color_failure }}"
        discord_author: "{{ controller_fqdn }}"
        discord_fields:
          - name: "Unreachable"
            value: "{{ unreachable_hosts | join(', ') }}"
        discord_footer:
          text: "Health Check"
        discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    # ── PER-HOST DISCORD ALERTS ────────────────────────────────────────────────
    - name: Send alert for hosts with issues
      include_tasks: tasks/notify.yaml
      loop: "{{ ssh_hosts }}"
      loop_control:
        label: "{{ item }}"
      when:
        - hostvars[item]['host_reachable'] | default(false)
        - (hostvars[item]['host_health_issues'] | default([]) | selectattr('status', 'ne', 'ok') | list | length) > 0
      vars:
        discord_name: "System"
        discord_operation: "Health"
        discord_status: >-
          {{ 'failed' if (hostvars[item]['host_health_issues'] | default([]) | selectattr('status', 'equalto', 'critical') | list | length > 0) else 'warning' }}
        discord_color: >-
          {{ discord_color_failure if (hostvars[item]['host_health_issues'] | default([]) | selectattr('status', 'equalto', 'critical') | list | length > 0) else discord_color_warning }}
        discord_author: "{{ item }}"
        discord_fields: >-
          [
           {% for issue in hostvars[item]['host_health_issues'] | default([]) | selectattr('status', 'ne', 'ok') | list %}
           {% if not loop.first %},{% endif %}
           {"name": "{{ ('❌ ' if issue.status == 'critical' else '⚠️ ') + issue.check_name }}", "value": "{{ issue.value }}{{ (' — ' + issue.detail) if issue.detail else '' }}", "inline": true}
           {% endfor %}]
        discord_footer:
          text: "Health Check"
        discord_timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    # ── BATCH LOG — unified results to DB in a single INSERT ────────────────────
    - name: Build unified results — Play 1 checks
      ansible.builtin.set_fact:
        _all_results: "{{ play1_health_results | map('combine', {'hostname': controller_fqdn}) | list }}"

    - name: Build unified results — unreachable hosts
      ansible.builtin.set_fact:
        _all_results: "{{ _all_results + [{'hostname': item, 'check_name': 'host_reachable', 'status': 'critical', 'value': 'unreachable', 'detail': 'Host did not respond to SSH'}] }}"
      loop: "{{ unreachable_hosts }}"

    - name: Build unified results — per-host checks
      ansible.builtin.set_fact:
        _all_results: >-
          {{ _all_results +
             (hostvars[item]['host_health_issues'] | default([])
              | map('combine', {'hostname': item}) | list)
          }}
      loop: "{{ ssh_hosts }}"
      when: hostvars[item]['host_reachable'] | default(false)

    - name: Batch log all health check results to DB
      include_tasks: tasks/log_health_checks_batch.yaml
      when: _all_results | length > 0

    - name: Detect partial failures from check errors
      ansible.builtin.set_fact:
        maintenance_partial: >-
          {{ (_all_results | default([]) | selectattr('value', 'equalto', 'check_error') | list | length > 0)
             and not maintenance_failed }}

    # ── FINALIZE ──────────────────────────────────────────────────────────────
    - name: Save health check state to DB
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      become: false
      connection: local
      ansible.mysql.mysql_query:
        login_host: "{{ vault_logging_db_host }}"
        login_port: "{{ vault_logging_db_port }}"
        login_user: "{{ vault_logging_db_user }}"
        login_password: "{{ vault_logging_db_password }}"
        login_db: "{{ vault_logging_db_name }}"
        query: "INSERT INTO health_check_state (id, last_check) VALUES (1, UTC_TIMESTAMP()) ON DUPLICATE KEY UPDATE last_check = UTC_TIMESTAMP()"
      when: not ansible_check_mode
      no_log: "{{ _no_log }}"

    - name: Send alert on maintenance failure
      include_tasks: tasks/notify.yaml
      when: maintenance_failed
      vars:
        discord_name: "{{ maintenance_name }}"
        discord_operation: "Health"
        discord_status: "failed"
        discord_detail: "one or more checks encountered an error"
        discord_color: "{{ discord_color_failure }}"
        discord_url: "{{ maintenance_url }}"
        discord_author: "{{ controller_fqdn }}"

    - name: Log maintenance to MariaDB
      include_tasks: tasks/log_mariadb.yaml
      vars:
        log_table: maintenance
        log_application: "{{ maintenance_name }}"
        log_hostname: "{{ controller_fqdn }}"
        log_type: "{{ maintenance_type }}"
        log_subtype: "{{ maintenance_subtype }}"
        log_status: "{{ 'failed' if maintenance_failed else ('partial' if maintenance_partial | default(false) else 'success') }}"

    # ── DEAD MAN'S SWITCH — Uptime Kuma push heartbeat ──────────────────────────
    # If this playbook fails to complete (crashes, hangs, scheduler dies), Uptime Kuma
    # will detect the missing heartbeat and alert independently of notifications.
    - name: Send heartbeat to Uptime Kuma
      ansible.builtin.uri:
        url: "{{ vault_uptime_kuma_push_url }}"
        method: GET
        status_code: 200
        timeout: 10
      when:
        - not ansible_check_mode
        - vault_uptime_kuma_push_url is defined
        - not maintenance_failed
      failed_when: false  # notification-guard — heartbeat failure must not block playbook

    - name: Fail play if health check failed
      ansible.builtin.fail:
        msg: "Health check failed — see notification for details"
      when: maintenance_failed

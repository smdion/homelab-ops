---
# Category: Build & Provision
# Schedule: none
# Install/converge iVentoy (PXE ISO boot server) on VM `iventoy` and hook it into netboot.xyz.
# Users pick netboot.xyz "Custom URL Menu" -> "Boot an ISO (iVentoy)"; netboot.xyz itself is untouched.
#
#   - VM: create it first with build_ubuntu.yaml -e vm_name=iventoy (vm_definitions.iventoy, incl. UFW)
#   - iVentoy: pinned release + systemd unit. iventoy-configure (ExecStartPost) forces External
#     DHCP mode on every start - iVentoy never answers DHCP here - then starts the PXE service.
#   - netboot.xyz hook: local-vars.ipxe + custom.ipxe in netbootxyz's menus dir (dev host)
#   - netboot_proxy (container_definitions.yaml) answers iVentoy's BIOS loader - see its comments
#
# Idempotent. ISOs: upload in the iVentoy web UI (http://<vm ip>:26000) or copy to /opt/iventoy/iso.
#
# Usage:
#   ansible-playbook build_ubuntu.yaml -e vm_name=iventoy     # once - creates the VM
#   ansible-playbook build_iventoy.yaml
#
# Config: vars/configs/iventoy.yaml · Templates: templates/iventoy/

- name: Resolve iVentoy VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/secrets.yaml
    - vars/definitions/vm_definitions.yaml
  tasks:
    - name: Add iVentoy VM to in-memory inventory
      ansible.builtin.add_host:
        name: iventoy_vm
        ansible_host: "{{ vm_definitions.iventoy.vm_ip }}"
        ansible_user: ansible
        groups: iventoy_target
      changed_when: false

- name: Install and configure iVentoy
  hosts: iventoy_target
  become: true
  gather_facts: false
  vars_files:
    - vars/secrets.yaml
    - vars/configs/proxmox.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/configs/iventoy.yaml

  tasks:
    - name: Ensure iVentoy directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ iventoy_dir }}"
        - "{{ iventoy_dir }}/iso"
        - /opt/iventoy-dist

    - name: Download pinned iVentoy release
      ansible.builtin.get_url:
        url: "{{ iventoy_url }}"
        dest: "/opt/iventoy-dist/iventoy-{{ iventoy_version }}.tar.gz"
        checksum: "sha256:{{ iventoy_sha256 }}"
        mode: "0644"

    # Unpacks over the existing dir: data/config.dat and iso/ are not in the tarball, so
    # settings and the ISO library survive upgrades. Re-done only when the version changes.
    - name: Unpack iVentoy
      ansible.builtin.unarchive:
        src: "/opt/iventoy-dist/iventoy-{{ iventoy_version }}.tar.gz"
        dest: "{{ iventoy_dir }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]
        creates: "{{ iventoy_dir }}/.installed-{{ iventoy_version }}"
      register: _iventoy_unpack
      notify: Restart iVentoy

    - name: Record installed iVentoy version
      ansible.builtin.copy:
        content: "{{ iventoy_version }}\n"
        dest: "{{ iventoy_dir }}/.installed-{{ iventoy_version }}"
        mode: "0644"
      when: _iventoy_unpack.changed

    - name: Install iVentoy configure script
      ansible.builtin.template:
        src: templates/iventoy/iventoy-configure.sh.j2
        dest: /usr/local/sbin/iventoy-configure
        mode: "0755"
      notify: Restart iVentoy

    - name: Install iVentoy systemd unit
      ansible.builtin.template:
        src: templates/iventoy/iventoy.service.j2
        dest: /etc/systemd/system/iventoy.service
        mode: "0644"
      notify: Restart iVentoy

    # Repeated failed starts can leave systemd rate-limiting the unit
    - name: Clear any failed state on the iVentoy unit
      ansible.builtin.command: systemctl reset-failed iventoy
      changed_when: false
      failed_when: false

    - name: Enable and start iVentoy
      ansible.builtin.systemd:
        name: iventoy
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply pending iVentoy restarts
      ansible.builtin.meta: flush_handlers

    - name: Read iVentoy DHCP mode
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ iventoy_ui_port }}/iventoy/json"
        method: POST
        body_format: json
        body: { method: get_dhcp_mode }
      register: _iventoy_mode

    - name: Read iVentoy PXE service status
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ iventoy_ui_port }}/iventoy/json"
        method: POST
        body_format: json
        body: { method: query_status }
      register: _iventoy_status

    # iVentoy scans the ISO dir at startup; ISOs copied in later need a refresh
    - name: Refresh the iVentoy ISO library
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ iventoy_ui_port }}/iventoy/json"
        method: POST
        body_format: json
        body: { method: refresh_img_list }
      changed_when: false

    - name: Read iVentoy ISO library summary
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ iventoy_ui_port }}/iventoy/json"
        method: POST
        body_format: json
        body: { method: get_img_summary }
      register: _iventoy_images

    # iVentoy will not start the PXE service while the ISO library is empty, so it stays
    # idle until ISOs are added (uploaded in the web UI, or copied into the iso dir).
    - name: Start the PXE service if it is idle and ISOs are present
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ iventoy_ui_port }}/iventoy/json"
        method: POST
        body_format: json
        body:
          method: start_server
          ip: "{{ vm_definitions.iventoy.vm_ip }}"
          mask: "255.255.255.0"
          gw: "{{ vm_gateway }}"
          pool_begin: "{{ iventoy_pool_begin }}"
          pool_end: "{{ iventoy_pool_end }}"
          dns_server: ""
      when:
        - _iventoy_status.json.status != 'running'
        - _iventoy_images.json.count | int > 0
      changed_when: true
      register: _iventoy_started

    - name: Re-read iVentoy PXE service status
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ iventoy_ui_port }}/iventoy/json"
        method: POST
        body_format: json
        body: { method: query_status }
      register: _iventoy_status
      when: _iventoy_started.changed

    # iVentoy will not start the PXE service while the ISO library is empty ("No image
    # file detected") — expected on a fresh build, so only require it once ISOs exist.
    - name: Assert iVentoy is in External DHCP mode, and serving if it has ISOs
      ansible.builtin.assert:
        that:
          - _iventoy_mode.json.dhcp_mode | int == 1
          - _iventoy_status.json.status == 'running' or _iventoy_images.json.count | int == 0
        fail_msg: "iVentoy unhealthy: mode={{ _iventoy_mode.json }} status={{ _iventoy_status.json }} images={{ _iventoy_images.json }}"
        quiet: true

    - name: Display iVentoy state
      ansible.builtin.debug:
        msg: >-
          iVentoy {{ iventoy_version }} on {{ vm_definitions.iventoy.vm_ip }}:
          External DHCP mode, {{ _iventoy_images.json.count }} ISO(s),
          PXE service {{ _iventoy_status.json.status }}.
          {{ 'Add an ISO (web UI port ' ~ iventoy_ui_port ~ ') then rerun this playbook to start serving.'
             if _iventoy_images.json.count | int == 0 else '' }}

  handlers:
    - name: Restart iVentoy
      ansible.builtin.systemd:
        name: iventoy
        state: restarted
        daemon_reload: true

- name: Hook iVentoy into netboot.xyz (Custom URL Menu)
  hosts: dev
  become: true
  gather_facts: false
  vars_files:
    - vars/secrets.yaml
    - vars/configs/docker_stacks.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/configs/iventoy.yaml
  vars:
    _iv_ip: "{{ vm_definitions.iventoy.vm_ip }}"

  tasks:
    - name: Install netboot.xyz menu hook files
      ansible.builtin.template:
        src: "templates/iventoy/{{ item }}.j2"
        dest: "{{ iventoy_netboot_menus_dir }}/{{ item }}"
        owner: "{{ docker_puid | default('1000') }}"
        group: "{{ docker_pgid | default('1000') }}"
        mode: "0644"   # world-readable: netboot_proxy's dnsmasq serves TFTP as nobody
      loop:
        - local-vars.ipxe
        - custom.ipxe

# ═══════════════════════════════════════════════════════════════════
# Monitoring — register / clean up in Beszel (best effort, see tasks/beszel_hook.yaml)
# ═══════════════════════════════════════════════════════════════════
- name: "Sync Beszel monitoring"
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', 'date_time']
  vars_files:
    - vars/secrets.yaml
    - vars/definitions/vm_definitions.yaml
    - vars/definitions/host_definitions.yaml
    - vars/configs/beszel.yaml
  vars:
    playbook_name: "build_iventoy.yaml"
    beszel_hook_prune: false
  tasks:
    - name: Resolve Semaphore task URL for notifications
      ansible.builtin.include_tasks: tasks/resolve_semaphore_task.yaml

    - name: Register / clean up monitoring
      ansible.builtin.include_tasks: tasks/beszel_hook.yaml
